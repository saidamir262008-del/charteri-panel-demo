<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charteri — авиабилеты из Узбекистана</title>
<meta name="description" content="Демонстрация пассажирского приложения Charteri: поиск рейсов, оплата Payme, Uzum или картой и электронный билет с QR-кодом.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E13" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CHARTERI.UZ">
<meta property="og:title" content="Charteri — авиабилеты из Узбекистана">
<meta property="og:description" content="Демонстрация пассажирского приложения: поиск рейсов, оплата Payme, Uzum или картой, электронный билет с QR-кодом.">
<meta property="og:url" content="https://saidamir262008-del.github.io/charteri-panel-demo/app/">
<meta property="og:locale" content="ru_RU">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Unbounded:wght@800&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%232F6FE0'/><path fill='%23fff' d='M20 16.2v-1.6l-7-4.4V5.1a1.3 1.3 0 0 0-2.6 0v5.1l-7 4.4v1.6l7-2.2v4.3l-1.7 1.3v1.3L12 20l3.3.9v-1.3L13.6 18.3V14z'/></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Токены — брендбук Charteri и src/theme/tokens.ts мобильного приложения. */
:root{
  --blue:#2F6FE0; --navy:#16275C; --paper:#F6F4EF; --surface:#FFFFFF;
  --sunken:#EFEBE3; --sky:#E7EFFC; --ink:#191B20; --muted:#5C6270; --faint:#8A8F9C;
  --line:#E4E0D6; --mint:#12996A; --mint-bg:#DDF2E8; --coral:#E14B4B; --coral-bg:#FCE9E9;
  --warn:#9A6206; --warn-bg:#FCF0DC;
  --hero-a:#3F7DF0; --hero-b:#1E3577; --cta-a:#3D82F6; --cta-b:#2565E0;
  --pass-top:#16275C; --backdrop:#E6E2D8;
  --shadow:0 1px 2px rgba(22,39,92,.05),0 12px 30px -18px rgba(22,39,92,.28);
  --card-border:transparent;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#6D9BF2; --navy:#D2DEF7; --paper:#0C0E13; --surface:#1B202B;
  --sunken:#141922; --sky:#1F2A3F; --ink:#E9EAEE; --muted:#A0A6B4; --faint:#767D8C;
  --line:#2B3240; --mint:#4FC79A; --mint-bg:#10291E; --coral:#F07070; --coral-bg:#2C1919;
  --warn:#E0A94B; --warn-bg:#2A2113;
  --hero-a:#24427C; --hero-b:#132650; --pass-top:#132650; --backdrop:#050608;
  --shadow:none; --card-border:#2B3240;
}}
:root[data-theme="dark"]{
  --blue:#6D9BF2; --navy:#D2DEF7; --paper:#0C0E13; --surface:#1B202B;
  --sunken:#141922; --sky:#1F2A3F; --ink:#E9EAEE; --muted:#A0A6B4; --faint:#767D8C;
  --line:#2B3240; --mint:#4FC79A; --mint-bg:#10291E; --coral:#F07070; --coral-bg:#2C1919;
  --warn:#E0A94B; --warn-bg:#2A2113;
  --hero-a:#24427C; --hero-b:#132650; --pass-top:#132650; --backdrop:#050608;
  --shadow:none; --card-border:#2B3240;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--backdrop);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;color:var(--navy)}
p{margin:0}

/* ---- каркас: приложение, а не сайт ---- */
.stage{min-height:100dvh;display:flex;justify-content:center}
.device{position:relative;width:100%;max-width:440px;height:100dvh;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:560px){
  .stage{align-items:center;padding-block:24px}
  .device{height:min(900px,calc(100dvh - 48px));border-radius:34px;
    box-shadow:0 40px 90px -30px rgba(22,39,92,.45),0 0 0 1px var(--line)}
}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.pad{padding-inline:18px}
.stack{display:flex;flex-direction:column;gap:14px}

/* ---- шапка вложенных экранов ---- */
.bar{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:6px;
  padding:12px 12px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px)}
.bar h1{font-size:16px;font-weight:700;text-align:center;color:var(--ink)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--blue)}
.iconbtn:hover{background:var(--sunken)}
.iconbtn svg{width:22px;height:22px}

/* ---- типографика элементов ---- */
.lbl{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.sec{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:10px}

/* ---- кнопки ---- */
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:16px;
  background:linear-gradient(135deg,var(--cta-a),var(--cta-b));color:#fff;font-weight:700;font-size:17px;
  box-shadow:0 10px 24px -12px rgba(37,101,224,.8);text-align:center}
.cta:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.solid{display:flex;align-items:center;justify-content:center;width:100%;height:48px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700}
.ghost{display:flex;align-items:center;justify-content:center;width:100%;height:48px;border-radius:14px;border:1px solid var(--line);color:var(--blue);font-weight:600;background:var(--surface)}
.link{color:var(--blue);font-weight:600;font-size:14.5px;text-align:center;padding:8px}
.danger{color:var(--coral)}

/* ---- поля ---- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0;min-height:46px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.upper{text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{background:var(--coral-bg);color:var(--coral);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:500}
.ok{background:var(--mint-bg);color:var(--mint);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:500}

.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--card-border);padding:16px}

/* ---- сегменты ---- */
.seg{display:flex;background:var(--sunken);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);text-align:center;white-space:nowrap;padding-inline:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---- герой ---- */
.hero{background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:#fff;padding:18px 20px 70px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;
  border:1px dashed rgba(255,255,255,.18)}
.wordmark{font-family:"Unbounded","IBM Plex Sans",sans-serif;font-weight:800;letter-spacing:.4px;font-size:17px;color:#fff}
.wordmark b{color:#9CC0FF;font-weight:800}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.badge-demo{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:1.2px;
  padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.14);color:#fff}
.greet{margin-top:22px;font-size:14px;color:rgba(255,255,255,.75);font-weight:500;position:relative;z-index:1}
.greet-q{font-size:30px;font-weight:700;color:#fff;letter-spacing:-.6px;margin-top:2px;position:relative;z-index:1}
.lift{margin-top:-50px;position:relative;z-index:2}

/* ---- откуда / куда ---- */
.odpair{position:relative;border:1px solid var(--line);border-radius:16px}
.odrow{display:grid;grid-template-columns:52px 1fr;align-items:center;column-gap:10px;width:100%;padding:12px 60px 12px 14px;text-align:left}
.odrow + .odrow{border-top:1px solid var(--line)}
.odrow .iata{grid-row:span 2;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:21px;color:var(--navy);letter-spacing:.5px}
.odrow .l{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint)}
.odrow .c{font-weight:600;font-size:15.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swap{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;
  background:var(--surface);border:1px solid var(--line);color:var(--blue);display:grid;place-items:center}
.swap svg{width:20px;height:20px}

/* ---- пассажиры (степперы) ---- */
.steps{display:flex;flex-direction:column}
.steprow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:9px}
.steprow + .steprow{border-top:1px solid var(--line)}
.steprow b{font-weight:600;display:block}
.steprow small{color:var(--muted);font-size:12.5px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--blue);font-size:19px;font-weight:600}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper span{min-width:18px;text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:16px}

/* ---- табло популярных направлений ---- */
.board{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--card-border);overflow:hidden}
.brow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;padding:13px 16px;text-align:left}
.brow + .brow{border-top:1px dashed var(--line)}
.brow:hover{background:var(--sunken)}
.brow .codes{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;color:var(--navy);letter-spacing:.4px}
.brow .codes i{font-style:normal;color:var(--blue);padding-inline:4px}
.brow .city{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .from{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:600;color:var(--blue);white-space:nowrap}

/* ---- выдача ---- */
.qhead{display:flex;flex-direction:column;gap:4px;padding:4px 18px 14px}
.qroute{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:22px;color:var(--navy);letter-spacing:.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 18px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding-inline:14px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted);background:var(--surface);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.offer{display:flex;flex-direction:column;gap:12px;width:100%;background:var(--surface);border:1px solid var(--card-border);border-radius:20px;padding:15px 16px;box-shadow:var(--shadow);text-align:left}
.offer:hover{outline:2px solid color-mix(in srgb,var(--blue) 35%,transparent)}
.o-top{display:flex;align-items:center;gap:10px}
.cb{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12.5px;flex:none}
.o-car{display:flex;flex-direction:column;min-width:0;flex:1}
.o-car b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.o-car small{color:var(--faint);font-size:12px;font-family:"IBM Plex Mono",monospace}
.best{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:1px;padding:4px 8px;border-radius:7px;background:var(--mint-bg);color:var(--mint)}
.o-mid{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.tm{display:flex;flex-direction:column}
.tm b{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:21px;color:var(--navy);line-height:1.1}
.tm b sup{font-size:11px;color:var(--coral);margin-left:2px}
.tm span{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted)}
.tm.r{text-align:right}
.track{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.track .d{font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.track .ln{position:relative;width:100%;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px)}
.track .ln svg{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%) rotate(90deg);fill:var(--blue);background:var(--surface);border-radius:50%}
.track .s{font-size:12px;font-weight:600}
.s-direct{color:var(--mint)}
.s-stop{color:var(--coral)}
.o-bot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:11px}
.o-bot .meta{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column}
.o-bot .left{color:var(--coral);font-weight:600}
.price{text-align:right;display:flex;flex-direction:column}
.price b{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:19px;color:var(--navy);white-space:nowrap}
.price small{font-size:11.5px;color:var(--faint)}
.note-leg{margin:0 18px 12px;padding:11px 13px;border-radius:12px;background:var(--sky);color:var(--navy);font-size:13.5px;font-weight:600}

/* ---- скелет загрузки ---- */
.skel{height:152px;border-radius:20px;background:linear-gradient(90deg,var(--sunken) 0,var(--surface) 50%,var(--sunken) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.searching{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:0 18px 12px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--blue);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- маршрут рейса (детали, билет) ---- */
.leg{display:flex;flex-direction:column;gap:14px}
.leg-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.route .end{display:flex;flex-direction:column}
.route .end.r{text-align:right}
.route .code{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:28px;color:var(--navy);letter-spacing:.5px;line-height:1}
.route .city{font-size:13px;color:var(--muted);margin-top:4px}
.route .time{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;color:var(--ink);margin-top:2px}
.rows{display:flex;flex-direction:column}
.rows > div{display:flex;justify-content:space-between;gap:12px;padding-block:9px;font-size:14.5px}
.rows > div + div{border-top:1px solid var(--line)}
.rows .k{color:var(--muted)}
.rows .v{font-weight:600;text-align:right}
.rows .v.mono{font-weight:600}
.rows .tot{font-size:17px}
.rows .tot .v{font-family:"IBM Plex Mono",monospace;color:var(--navy);font-size:20px}

/* ---- пассажиры (формы) ---- */
.pcard{display:flex;flex-direction:column;gap:12px}
.pcard-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard-h b{font-size:16px;color:var(--navy)}
.tchips{display:flex;flex-wrap:wrap;gap:7px}
.tchip{height:32px;padding-inline:12px;border-radius:999px;background:var(--sky);color:var(--navy);font-weight:600;font-size:13px}
.tchip[aria-pressed="true"]{background:var(--blue);color:#fff}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink)}
.check input{width:20px;height:20px;min-height:0;accent-color:var(--blue)}
.secure{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--muted)}
.secure svg{width:17px;height:17px;flex:none;margin-top:1px;color:var(--mint)}

/* ---- проверка цены и оплата ---- */
.pcheck{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600}
.pcheck.wait{background:var(--sunken);color:var(--muted)}
.pcheck.good{background:var(--mint-bg);color:var(--mint)}
.pcheck svg{width:18px;height:18px}
.changed{background:var(--warn-bg);border-radius:16px;padding:15px;display:flex;flex-direction:column;gap:10px;color:var(--ink)}
.changed h3{color:var(--warn);font-size:16px}
.changed .rows > div + div{border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.strike{text-decoration:line-through;color:var(--muted)}
.methods{display:flex;flex-direction:column;gap:8px}
.method{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.method[aria-pressed="true"]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 7%,var(--surface))}
.method .dot{width:12px;height:12px;border-radius:50%;flex:none}
.method .rad{margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.method[aria-pressed="true"] .rad{border:6px solid var(--blue)}
.demo-note{font-size:12.5px;color:var(--faint);text-align:center}

/* ---- успех ---- */
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:56px 24px 24px}
.checkmark{width:96px;height:96px;animation:pop .7s cubic-bezier(.34,1.56,.64,1) both}
.checkmark circle{fill:none;stroke:var(--blue);stroke-width:4;stroke-dasharray:283;stroke-dashoffset:283;animation:draw .7s ease-out forwards}
.checkmark path{fill:none;stroke:var(--blue);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;animation:draw .45s .55s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.success h1{font-size:26px;margin-top:8px}
.refbox{display:flex;flex-direction:column;gap:2px;padding:12px 22px;border-radius:14px;background:var(--sky);margin-block:6px}
.refbox b{font-family:"IBM Plex Mono",monospace;font-size:20px;letter-spacing:1.5px;color:var(--navy)}

/* ---- посадочный талон ---- */
.pass{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--card-border);overflow:hidden}
.pass-top{background:var(--pass-top);color:#fff;display:flex;align-items:center;gap:10px;padding:13px 16px}
.pass-top .n{flex:1;font-weight:600;font-size:14.5px}
.pass-top .f{font-family:"IBM Plex Mono",monospace;font-size:13px;color:#9CC0FF}
.pass-body{padding:18px 16px 16px;display:flex;flex-direction:column;gap:16px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.pgrid > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.pgrid b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgrid .wide{grid-column:span 2}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin-inline:14px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--paper)}
.perf::before{left:-26px}.perf::after{right:-26px}
.pass-qr{display:flex;align-items:center;gap:16px;padding:16px}
.qr{width:112px;height:112px;background:#fff;border-radius:12px;padding:9px;flex:none;display:grid;place-items:center}
.qr svg{width:100%;height:100%;display:block}
.ref{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;letter-spacing:1.5px;color:var(--navy)}
.reqbanner{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:var(--warn-bg);font-size:13.5px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.new{background:var(--warn-bg);color:var(--warn)}
.pill.soon{background:var(--sky);color:var(--blue)}

/* ---- поездки ---- */
.pagehead{padding:22px 18px 14px;display:flex;flex-direction:column;gap:3px}
.pagehead h1{font-size:28px;letter-spacing:-.5px}
.trip{display:flex;flex-direction:column;gap:10px;width:100%;background:var(--surface);border:1px solid var(--card-border);border-radius:20px;padding:15px 16px;box-shadow:var(--shadow);text-align:left}
.trip-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.trip .codes{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:20px;color:var(--navy);letter-spacing:.5px}
.trip .codes i{font-style:normal;color:var(--blue);padding-inline:6px;font-size:16px}
.trip .cities{font-size:13.5px;color:var(--muted)}
.trip-f{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.trip.past{opacity:.72}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 24px}
.empty svg{width:170px;height:100px}
.empty .plane-fly{animation:fly 4.2s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-5px)}}

/* ---- профиль ---- */
.who{display:flex;align-items:center;gap:14px}
.avatar{width:52px;height:52px;border-radius:16px;background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.who b{display:block;font-size:17px;color:var(--navy)}
.setrow{display:flex;flex-direction:column;gap:8px;padding-block:12px}
.setrow + .setrow,.navrow + .setrow,.setrow + .navrow{border-top:1px solid var(--line)}
.setrow > span{font-weight:600;font-size:14.5px}
.navrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding-block:14px;font-weight:600}
.navrow svg{width:18px;height:18px;color:var(--faint)}
.navrow .count{margin-left:auto;margin-right:8px;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-weight:500}

/* ---- вход ---- */
.login-hero{background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:#fff;padding:18px 20px 88px;position:relative;overflow:hidden}
.login-hero .tag{margin-top:26px;font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.25;max-width:17ch;position:relative;z-index:1}
.miniboard{margin-top:20px;border-radius:14px;background:rgba(6,14,40,.28);padding:6px 12px;position:relative;z-index:1}
.miniboard div{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding-block:6px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:rgba(255,255,255,.88)}
.miniboard div + div{border-top:1px dashed rgba(255,255,255,.16)}
.miniboard .st{color:#8FE3BF}
.langs{display:flex;gap:2px;background:rgba(255,255,255,.14);border-radius:10px;padding:3px}
.langs button{height:28px;padding-inline:9px;border-radius:7px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.8)}
.langs button[aria-pressed="true"]{background:#fff;color:#16275C}
.otp{font-family:"IBM Plex Mono",monospace;font-size:30px;letter-spacing:14px;text-align:center;padding-block:14px}

/* ---- список аэропортов ---- */
.aplist{display:flex;flex-direction:column}
.aprow{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;width:100%;padding:12px 18px;text-align:left}
.aprow + .aprow{border-top:1px solid var(--line)}
.aprow:hover{background:var(--sunken)}
.aprow .code{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--blue)}
.aprow b{font-weight:600;display:block}
.aprow small{color:var(--muted);font-size:12.5px}

/* ---- таббар, тост, оверлей ---- */
.tabbar{display:flex;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:5px;border-radius:12px;color:var(--faint);font-size:11px;font-weight:600;text-align:center}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="true"]{color:var(--blue)}
.toast{position:absolute;left:16px;right:16px;bottom:86px;z-index:30;background:var(--ink);color:var(--paper);
  border-radius:14px;padding:12px 14px;font-size:14px;font-weight:500;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);animation:rise .3s ease-out both}
.overlay{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(6px)}
.overlay .box{display:flex;flex-direction:column;align-items:center;gap:14px;font-weight:600;color:var(--ink)}
.overlay .spin{width:40px;height:40px;border-width:3px}

/* ---- движение: брендбук, «появление карточки» ---- */
.rise{animation:rise .42s ease-out both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

    <nav class="tabbar" id="tabbar" hidden></nav>
    <div id="toastHost"></div>
    <div id="overlayHost"></div>
  </div>
</div>

/* =========================================================================
   Поисковый движок — перенесён 1:1 из src/data/flights.ts.
   Детерминированный: тот же маршрут и дата дают те же рейсы, что в приложении.
   ========================================================================= */
function seedFrom(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function mulberry32(seed){ let a=seed; return ()=>{ a|=0; a=(a+0x6d2b79f5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function addMinutes(hhmm,mins){ const [h,m]=hhmm.split(":").map(Number); const total=(h*60+m+mins+1440*3)%1440; return String(Math.floor(total/60)).padStart(2,"0")+":"+String(total%60).padStart(2,"0"); }
function baseSeed(from,to){
  const key=`${from}-${to}`; if(ROUTES[key]) return ROUTES[key];
  const rnd=mulberry32(seedFrom(key));
  const eco=180+Math.floor(rnd()*420), durationMin=150+Math.floor(rnd()*420), depH=5+Math.floor(rnd()*16);
  const c=CARRIERS[Math.floor(rnd()*CARRIERS.length)];
  const depTime=`${String(depH).padStart(2,"0")}:${["00","15","30","45"][Math.floor(rnd()*4)]}`;
  return { carrier:c.name, flightNo:`${c.code}-${100+Math.floor(rnd()*899)}`, plane:PLANES[Math.floor(rnd()*PLANES.length)],
    depTime, arrTime:addMinutes(depTime,durationMin), ecoPrice:eco, busPrice:eco+220+Math.floor(rnd()*260), durationMin };
}
function generateOffers({from,to,date,cabin}){
  const seed=baseSeed(from,to), rnd=mulberry32(seedFrom(`${from}-${to}-${date}-${cabin}`));
  const count=4+Math.floor(rnd()*4), offers=[];
  for(let i=0;i<count;i++){
    const isBase=i===0;
    const carrier=isBase?{name:seed.carrier,code:seed.flightNo.split("-")[0]}:CARRIERS[Math.floor(rnd()*CARRIERS.length)];
    const stops=isBase?0:(rnd()<0.55?0:1);
    const extra=stops===1?120+Math.floor(rnd()*150):0;
    const durationMin=seed.durationMin+extra+Math.floor((rnd()-0.5)*40);
    const depTime=isBase?seed.depTime:addMinutes(seed.depTime,Math.floor((rnd()-0.5)*600));
    const arrTime=addMinutes(depTime,durationMin);
    const rawBase=cabin==="business"?seed.busPrice:seed.ecoPrice;
    const jitter=isBase?0:Math.floor((rnd()-0.35)*(cabin==="business"?160:90));
    const stopDiscount=stops===1?-Math.floor(rawBase*0.08):0;
    const rawUSD=Math.max(90,rawBase+jitter+stopDiscount);
    const priceUSD=Math.round(rawUSD*1.1);               // +10% наценка, как на сервере
    const stopCities=["DXB","IST","DME","SHJ","ALA"];
    offers.push({ id:`${from}${to}-${date}-${i}`, provider:PROVIDERS[Math.floor(rnd()*PROVIDERS.length)],
      carrier:carrier.name, carrierCode:carrier.code,
      flightNo:isBase?seed.flightNo:`${carrier.code}-${100+Math.floor(rnd()*899)}`,
      aircraft:isBase?seed.plane:PLANES[Math.floor(rnd()*PLANES.length)],
      from, to, date, depTime, arrTime, durationMin, stops,
      stopCity:stops===1?stopCities[Math.floor(rnd()*stopCities.length)]:undefined,
      cabin, priceUSD, priceUZS:Math.round((priceUSD*USD_TO_UZS)/1000)*1000,
      baggageKg:cabin==="business"?30:20, seatsLeft:1+Math.floor(rnd()*9) });
  }
  return offers.sort((a,b)=>a.priceUSD-b.priceUSD);
}
/* Код брони — src/app/review.tsx makeRef. */
function makeRef(seed){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let h=0;
  for(let i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))>>>0;
  let out=""; for(let i=0;i<6;i++){ out+=chars[h%chars.length]; h=Math.floor(h/chars.length)+seed.charCodeAt(i%seed.length)*7; }
  return `CHR-${out}`;
}
/* Цена — src/app/offer.tsx: (туда + обратно) × (взрослые + дети) + 10% × младенцы. */
function totals(out,back,q){
  const uU=out.priceUZS+(back?back.priceUZS:0), uD=out.priceUSD+(back?back.priceUSD:0), paying=q.adults+q.children;
  return { uzs:uU*paying+Math.round(uU*0.1)*q.infants, usd:uD*paying+Math.round(uD*0.1)*q.infants, unitUZS:uU, unitUSD:uD };
}

function airportList(q){

      <p class="small muted">${esc(fdateLong(tr.out.date))} · ${tr.out.flightNo} · ${tr.ref}</p></div>
    <span class="lbl">${esc(t("req_kind_label"))}</span>
    <div class="methods">${REQ_KINDS.map(k=>`<button type="button" class="method" data-act="reqKind" data-v="${k}" aria-pressed="${REQ.kind===k}">${esc(t("req_kind_"+k))}<span class="rad"></span></button>`).join("")}</div>
    <label class="field"><span>${esc(t("req_note"))}</span><textarea id="reqNote" placeholder="${esc(t("req_note_ph"))}">${esc(REQ.note)}</textarea></label>
    <button type="button" class="cta" data-act="submitReq" data-v="${tr.id}">${esc(t("req_submit"))}</button></div>`;
};

function tripCard(tr,i,past){
  const d=daysUntil(tr.q.depart);
  const badge = past ? "" : `<span class="pill soon">${d===0?esc(t("dep_today")):d===1?esc(t("dep_tomorrow")):`${d} ${esc(t("dep_in"))}`}</span>`;
  return `<button type="button" class="trip rise ${past?"past":""}" style="--i:${i}" data-act="openTicket" data-v="${tr.id}">
    <div class="trip-h"><span class="codes">${tr.out.from}<i>${tr.back?"⇄":"→"}</i>${tr.out.to}</span>${tr.req?`<span class="pill new">${esc(t("req_status_new"))}</span>`:badge}</div>
    <span class="cities">${esc(cityName(tr.out.from))} — ${esc(cityName(tr.out.to))}</span>
    <div class="trip-f"><span>${esc(fdate(tr.out.date,{day:"numeric",month:"long",year:"numeric"}))} · ${tr.out.depTime}</span><span class="mono">${tr.ref}</span></div>
  </button>`;
}
SCREENS.trips = () => {
  const up=P.trips.filter(x=>x.q.depart>=TODAY).sort((a,b)=>a.q.depart.localeCompare(b.q.depart));
  const past=P.trips.filter(x=>x.q.depart<TODAY).sort((a,b)=>b.q.depart.localeCompare(a.q.depart));
  const head=`<div class="pagehead"><h1>${esc(t("tab_trips"))}</h1><p class="muted">${esc(t("trips_sub"))}</p></div>`;
  if(!P.trips.length) return head + `<div class="empty">
      <svg viewBox="0 0 170 100" aria-hidden="true"><path d="M10 88 Q85 -8 160 88" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 6"/>
      <g class="plane-fly" transform="translate(73 18) rotate(35 12 12)" style="fill:var(--blue)">${PLANE.replace('<svg viewBox="0 0 24 24" aria-hidden="true">','').replace("</svg>","")}</g></svg>
      <h2>${esc(t("trips_empty_title"))}</h2><p class="muted">${esc(t("trips_empty_body"))}</p>
      <button type="button" class="solid" style="max-width:240px;margin-top:6px" data-act="tab" data-v="search">${esc(t("trips_start"))}</button></div>`;
  return head + `<div class="pad stack">
    ${up.length?`<h2 class="sec" style="margin:0">${esc(t("upcoming"))}</h2>${up.map((x,i)=>tripCard(x,i,false)).join("")}`:""}
    ${past.length?`<h2 class="sec" style="margin:12px 0 0">${esc(t("past_trips"))}</h2>${past.map((x,i)=>tripCard(x,i+up.length,true)).join("")}`:""}
  </div>`;
};

SCREENS.profile = () => {
  const tr=P.travellers[0];
  const name = U.guest ? t("profile_guest") : tr ? `${title(tr.given)} ${title(tr.surname)}` : prettyPhone(U.phone);
  const initials = U.guest ? "?" : tr ? tr.given[0]+tr.surname[0] : "C";
  const seg=(act,opts,val)=>`<div class="seg" role="group">${opts.map(([k,l])=>`<button type="button" data-act="${act}" data-v="${k}" aria-pressed="${val===k}">${esc(l)}</button>`).join("")}</div>`;
  return `<div class="pagehead"><h1>${esc(t("tab_profile"))}</h1></div><div class="pad stack">
    <div class="card who rise"><span class="avatar">${esc(initials)}</span><div><b>${esc(name)}</b><span class="mono small muted">${U.guest?"":esc(prettyPhone(U.phone))}</span></div></div>
    <div class="card rise" style="--i:1;padding-block:4px">
      <div class="setrow"><span>${esc(t("language"))}</span>${seg("lang",[["uz","O‘zbekcha"],["ru","Русский"],["en","English"]],P.lang)}</div>
      <div class="setrow"><span>${esc(t("currency"))}</span>${seg("cur",[["UZS","UZS"],["USD","USD"]],P.cur)}</div>
      <div class="setrow"><span>${esc(t("appearance"))}</span>${seg("theme",[["system",t("theme_system")],["light",t("theme_light")],["dark",t("theme_dark")]],P.theme)}</div>
      <button type="button" class="navrow" data-act="go" data-v="travellers">${esc(t("saved_travellers"))}<span class="count">${P.travellers.length}</span>${I.chev}</button>
    </div>
    <div class="card rise" style="--i:2;padding-block:4px">
      <button type="button" class="navrow" data-act="reset">${esc(t("reset_demo"))}${I.chev}</button>
      <button type="button" class="navrow danger" style="border-top:1px solid var(--line)" data-act="signout">${esc(t("sign_out"))}</button>
    </div>
    <p class="demo-note">${esc(t("demo_banner"))}</p></div>`;
};

SCREENS.travellers = () => `${header(t("saved_travellers"))}<div class="pad stack">${
  P.travellers.length ? P.travellers.map((x,i)=>`<div class="card rise" style="--i:${i};display:flex;align-items:center;gap:12px">
      <span class="avatar" style="width:44px;height:44px;font-size:15px;border-radius:13px">${esc(x.given[0]+x.surname[0])}</span>
      <div style="flex:1;min-width:0"><b style="display:block">${esc(x.given)} ${esc(x.surname)}</b>
        <span class="small muted mono">${esc(x.passport.slice(0,2))}•••${esc(x.passport.slice(-3))} · ${esc(t("expiry"))} ${esc(fdate(x.expiry,{month:"2-digit",year:"numeric"}))}</span></div>
      <button type="button" class="link danger" data-act="delTraveller" data-v="${x.id}">${esc(t("remove"))}</button></div>`).join("")
  : `<div class="empty"><h2>${esc(t("travellers_empty_title"))}</h2><p class="muted">${esc(t("travellers_empty_body"))}</p></div>`}</div>`;

/* =========================================================================
   Действия после отрисовки
   ========================================================================= */
const AFTER = {
  otp: () => $("#otp")?.focus(),
  results: p => {
    const key=legKey(p.leg||"out");
    if(!LOADED.has(key)) setTimeout(()=>{ LOADED.add(key); if(cur().s==="results") draw(false); }, 900);
  },
  review: () => {
    if(PRICE.state!=="checking") return;
    setTimeout(()=>{
      if(cur().s!=="review" || PRICE.state!=="checking") return;
      // Демонстрация экрана «Цена изменилась»: срабатывает на маршруте в Анталию,
      // чтобы его можно было показать по заказу, а не случайно.
      if(SEL.out.to==="AYT" && !PRICE.accepted){
        const old=totals(SEL.out,SEL.back,Q);
        const usd=Math.round(SEL.out.priceUSD*1.045);
        PRICE.pending={...SEL.out, priceUSD:usd, priceUZS:Math.round(usd*USD_TO_UZS/1000)*1000};
        PRICE.old=old; PRICE.neu=totals(PRICE.pending,SEL.back,Q); PRICE.state="changed";
      } else PRICE.state="ok";
      draw(false);
    }, 1100);
  },
  ticket: () => {
    document.querySelectorAll("[data-qr]").forEach(el=>{
      if(typeof qrcode!=="function"){ el.innerHTML=`<span class="mono small" style="color:#16275C">QR</span>`; return; }
      try{ const q=qrcode(0,"M"); q.addData(el.dataset.qr); q.make(); el.innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true}); }
      catch(e){ el.innerHTML=""; }
    });
  }
};

/* =========================================================================
   Обработчики
   ========================================================================= */
function showErr(id,msg){ const e=$(id); if(!e) return; e.hidden=false; e.textContent=msg; e.scrollIntoView({block:"center",behavior:"smooth"}); }
function hideErr(id){ const e=$(id); if(e){ e.hidden=true; e.textContent=""; } }
function enter(){ U.signedIn=true; root("search"); }
function verify(){
  const v=($("#otp")?.value||"").trim();
  if(!/^\d{4}$/.test(v)) return showErr("#otpErr",t("err_code"));
  enter();
}
function validatePax(){
  const last = Q.type==="roundtrip" ? Q.ret : Q.depart;
  for(let i=0;i<PAX.length;i++){
    const x=PAX[i]; hideErr("#perr"+i);
    let e=null;
    if(!/^[A-Z][A-Z' -]{0,40}$/.test(x.surname) || !/^[A-Z][A-Z' -]{0,40}$/.test(x.given)) e="err_name";
    else if(!/^[A-Z0-9]{5,9}$/.test(x.passport)) e="err_passport";
    else if(!x.gender) e="err_gender";
    else if(!x.dob || x.dob>=TODAY) e="err_dob";
    else if(!x.expiry || x.expiry<=last) e="err_expiry";
    if(e){ showErr("#perr"+i,t(e)); return false; }
  }
  hideErr("#cerr");
  if(!validPhone(CONTACT)){ showErr("#cerr",t("err_contact")); return false; }
  return true;
}

const ACT = {
  back: () => back(),
  tab: el => root(el.dataset.v),
  go: el => go(el.dataset.v),
  lang: el => { P.lang=el.dataset.v; save(); draw(false); },
  cur: el => { P.cur=el.dataset.v; save(); draw(false); },
  theme: el => { P.theme=el.dataset.v; save(); draw(false); },

  sendCode: () => {
    const v=$("#ph").value;
    if(!validPhone(v)) return showErr("#loginErr",t("err_phone"));
    U.phone=prettyPhone(v); U.guest=false; go("otp");
  },
  guest: () => { U.guest=true; U.phone=""; enter(); },
  verify: () => verify(),
  resend: () => toast(t("code_resent")),

  type: el => { Q.type=el.dataset.v; draw(false); },
  cabin: el => { Q.cabin=el.dataset.v; draw(false); },
  pick: el => go("airport",{field:el.dataset.v}),
  setAirport: el => { Q[cur().p.field]=el.dataset.v; back(); },
  swap: () => { [Q.from,Q.to]=[Q.to,Q.from]; draw(false); },
  step: el => {
    const k=el.dataset.k, n={...Q}; n[k]=Math.max(k==="adults"?1:0, n[k]+Number(el.dataset.d));
    if(n.adults+n.children+n.infants>9) return toast(t("max_pax"));
    if(n.infants>n.adults) return toast(t("infants_rule"));
    Object.assign(Q,n); draw(false);
  },
  search: () => {
    hideErr("#searchErr");
    if(Q.from===Q.to) return showErr("#searchErr",t("err_same_city"));
    if(Q.depart<TODAY) return showErr("#searchErr",t("err_date_past"));
    if(Q.type==="roundtrip" && Q.ret<Q.depart) return showErr("#searchErr",t("err_return"));
    SEL={out:null,back:null}; R={sort:"cheapest",direct:false}; go("results",{leg:"out"});
  },
  popular: el => { Q.from="TAS"; Q.to=el.dataset.v; ACT.search(); },
  editSearch: () => root("search"),
  sort: el => { R.sort=el.dataset.v; draw(false); },
  direct: () => { R.direct=!R.direct; draw(false); },
  chooseOffer: el => {
    const leg=cur().p.leg||"out", o=offersFor(leg).find(x=>x.id===el.dataset.v); if(!o) return;
    if(leg==="out"){ SEL={out:o,back:null}; if(Q.type==="roundtrip"){ R={sort:"cheapest",direct:false}; return go("results",{leg:"back"}); } }
    else SEL.back=o;
    go("offer");
  },
  continue: () => { ensurePax(); go("passengers"); },
  fillTraveller: el => {
    const i=Number(el.dataset.i), tr=P.travellers.find(x=>x.id===el.dataset.v); if(!tr) return;
    Object.assign(PAX[i],{surname:tr.surname,given:tr.given,passport:tr.passport,gender:tr.gender,dob:tr.dob,expiry:tr.expiry,cit:tr.cit,fromId:tr.id,save:false});
    draw(false);
  },
  gender: el => { PAX[Number(el.dataset.i)].gender=el.dataset.v; draw(false); },
  toReview: () => {
    if(!validatePax()) return;
    PAX.forEach(x=>{
      if(!x.save) return;
      if(P.travellers.some(tr=>tr.passport===x.passport)) return;
      P.travellers.push({id:"tr"+Date.now().toString(36)+Math.floor(Math.random()*1e4),surname:x.surname,given:x.given,passport:x.passport,gender:x.gender,dob:x.dob,expiry:x.expiry,cit:x.cit});
    });
    P.travellers=P.travellers.slice(0,10); save();
    PRICE={state:"checking",accepted:false}; go("review");
  },
  acceptPrice: () => { SEL.out=PRICE.pending; PRICE={state:"ok",accepted:true}; draw(false); },
  method: el => { PAY.method=el.dataset.v; draw(false); },
  pay: () => {
    if(PRICE.state!=="ok") return;
    overlay(t("processing"));
    setTimeout(()=>{
      const tr=mkTrip(SEL.out,SEL.back,Q,PAX.map(({type,save,fromId,...x})=>x),PAY.method,Date.now());
      P.trips.unshift(tr); save(); overlay("");
      stack=[{s:"trips",p:{}},{s:"success",p:{id:tr.id}}]; draw(true);
    }, 1400);
  },
  openTicket: el => go("ticket",{id:el.dataset.v}),
  openTicketFresh: el => { stack=[{s:"trips",p:{}},{s:"ticket",p:{id:el.dataset.v}}]; draw(true); },
  request: el => { REQ={kind:"change_date",note:""}; go("request",{id:el.dataset.v}); },
  reqKind: el => { REQ.kind=el.dataset.v; draw(false); },
  submitReq: el => {
    const tr=P.trips.find(x=>x.id===el.dataset.v); if(!tr) return;
    tr.req={kind:REQ.kind,note:REQ.note.trim(),status:"new",at:Date.now()}; save();
    back(); toast(t("req_status_new"));
  },
  delTraveller: el => {
    if(!confirm(t("delete_traveller_title"))) return;
    P.travellers=P.travellers.filter(x=>x.id!==el.dataset.v); save(); draw(false); toast(t("removed"));
  },
  reset: () => { if(!confirm(t("reset_confirm"))) return; P=seed(P); save(); LOADED.clear(); root("search"); },
  signout: () => { U={signedIn:false,guest:false,phone:""}; PAX=[]; CONTACT=""; root("login"); }
};

document.addEventListener("click", e => {
  const el=e.target.closest("[data-act]"); if(!el || el.disabled) return;
  const fn=ACT[el.dataset.act]; if(fn){ e.preventDefault(); fn(el); }
});
document.addEventListener("input", e => {
  const el=e.target;
  if(el.dataset.pax!==undefined && el.dataset.f!=="save"){
    const i=Number(el.dataset.pax), f=el.dataset.f; let v=el.value;
    if(f==="surname"||f==="given"||f==="passport"){ v=v.toUpperCase(); if(f==="passport") v=v.replace(/\s/g,""); }
    PAX[i][f]=v; if(f!=="dob"&&f!=="expiry"&&f!=="cit") PAX[i].fromId=null;
  }
  if(el.id==="apq") $("#aplist").innerHTML=airportList(el.value);
  if(el.id==="contact") CONTACT=el.value;
  if(el.id==="reqNote") REQ.note=el.value;
  if(el.id==="otp"){ el.value=el.value.replace(/\D/g,"").slice(0,4); if(el.value.length===4) verify(); }
});
document.addEventListener("change", e => {
  const el=e.target;
  if(el.dataset.bind==="depart" && el.value){ Q.depart=el.value; if(Q.ret<=Q.depart) Q.ret=addDays(Q.depart,7); draw(false); }
  if(el.dataset.bind==="ret" && el.value){ Q.ret=el.value; }
  if(el.dataset.pax!==undefined && el.dataset.f==="save") PAX[Number(el.dataset.pax)].save=el.checked;
});
document.addEventListener("keydown", e => {
  if(e.key!=="Enter") return;
  if(e.target.id==="ph") ACT.sendCode();
  if(e.target.id==="otp") verify();
});

P = load();
draw(true);
</script>
</body>
</html>
