/* ---- 16-routemap.js ---- */
/* ==========================================================================
   Маршрут из формы поиска на карте в шапке главной. Основная карта —
   настоящая (18-glmap.js). Здесь — общее состояние маршрута и запасная
   SVG-схема на случай, если WebGL или картографический сервис недоступны.
   Самолёт — фирменный силуэт, нос по направлению полёта (брендбук).
   ========================================================================== */
"use strict";

const MAP_W = 600, MAP_H = 340;
const WORLD = { lat0:4, lat1:58, lon0:24, lon1:114 };
const LOCAL = { lat0:39.25, lat1:42.15, lon0:66.3, lon1:70.9 };
const WORLD_BG = ["IST","AYT","DXB","SSH","JED","SHJ","CXR","HKT","DME"];

function mapState(){
  if (M.module === "heli") return { local:true, from:"TAS", to:M.heli.to };
  const r = { flights:[M.flights.from, M.flights.to], tours:["TAS", M.tours.to], hotels:["TAS", M.hotels.city], jet:[M.jet.from, M.jet.to] }[M.module];
  return { local:false, from:r[0], to:r[1] };
}
function mapAria(){
  const st = mapState();
  if (!st.local) return tf("map_aria", { a:cityName(st.from), b:cityName(st.to) });
  return HELI_DEST.find(d => d.id === st.to)?.tour ? heliName(st.to) : tf("map_aria", { a:t("heli_base").split(",")[0], b:heliName(st.to) });
}
/* Рамка карты растягивается, чтобы вместить любой выбранный аэропорт. */
function mapBounds(points, base){
  const b = { ...base };
  for (const [la, lo] of points) {
    b.lat0 = Math.min(b.lat0, la - 3); b.lat1 = Math.max(b.lat1, la + 3);
    b.lon0 = Math.min(b.lon0, lo - 5); b.lon1 = Math.max(b.lon1, lo + 5);
  }
  return b;
}
const project = (b, [la, lo]) => [(lo - b.lon0) / (b.lon1 - b.lon0) * MAP_W, (b.lat1 - la) / (b.lat1 - b.lat0) * MAP_H];
/* Дуга выгибается к северу — так выглядят маршруты по большому кругу. */
function arc([x1, y1], [x2, y2]){
  const d = Math.hypot(x2 - x1, y2 - y1) || 1;
  let nx = -(y2 - y1) / d, ny = (x2 - x1) / d;
  if (ny > 0) { nx = -nx; ny = -ny; }
  const k = Math.min(95, d * 0.3), cx = (x1 + x2) / 2 + nx * k, cy = (y1 + y2) / 2 + ny * k;
  return { d:`M${x1.toFixed(1)} ${y1.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`,
    end:[x2, y2], angle: Math.atan2(y2 - cy, x2 - cx) * 180 / Math.PI };
}
/* Обзорный полёт — петля над городом с возвращением на площадку. */
function loop([x, y]){
  return { d:`M${x} ${y} C${x + 70} ${y - 90} ${x + 190} ${y - 40} ${x + 120} ${y + 24} S${x + 10} ${y + 40} ${x} ${y}`,
    end:[x, y], angle:-150 };
}
function mapLabel([x, y], text, cls){
  const right = x > MAP_W - 130;
  return `<text class="${cls}" x="${(x + (right ? -12 : 12)).toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="${right ? "end" : "start"}">${esc(text)}</text>`;
}

/* Запасная схема: без подложки, только дуги и точки. */
function routeSvg(){
  const st = mapState(), key = `${M.module}:${st.from}-${st.to}`;
  const animate = !REDUCED && M.ui.mapKey !== key, first = !REDUCED && M.ui.mapKey == null;
  M.ui.mapKey = key;

  let b, pts, route, labels;
  if (st.local) {
    const dests = HELI_DEST.filter(d => d.coord);
    b = LOCAL; const home = project(b, HELI_BASE);
    const sel = HELI_DEST.find(d => d.id === st.to);
    pts = dests.map(d => ({ id:d.id, p:project(b, d.coord), name:d.name[S.lang] }));
    route = sel.tour ? loop(home) : arc(home, project(b, sel.coord));
    labels = mapLabel(home, t("heli_base").split(",")[0], "m-lbl m-lbl-home")
      + pts.filter(x => x.id === st.to).map(x => mapLabel(x.p, x.name, "m-lbl")).join("");
    pts = [{ id:"home", p:home }, ...pts];
  } else {
    const from = COORDS[st.from], to = COORDS[st.to];
    b = mapBounds([from, to], WORLD);
    const bg = [...new Set([...WORLD_BG, st.from, st.to])];
    pts = bg.map(c => ({ id:c, p:project(b, COORDS[c]) }));
    route = arc(project(b, from), project(b, to));
    labels = mapLabel(project(b, from), cityName(st.from), "m-lbl m-lbl-home") + mapLabel(route.end, cityName(st.to), "m-lbl");
  }
  const hub = st.local ? project(b, HELI_BASE) : project(b, COORDS["TAS"]);
  const bgArcs = pts.filter(x => x.id !== "home" && x.id !== "TAS").map((x, i) =>
    `<path class="m-bg" style="--i:${i}" d="${arc(hub, x.p).d}"/>`).join("");
  const dots = pts.map(x => { const sel = x.id === st.to || x.id === st.from || x.id === "home";
    return `<circle class="m-dot ${sel ? "m-dot-on" : ""}" cx="${x.p[0].toFixed(1)}" cy="${x.p[1].toFixed(1)}" r="${sel ? 4.5 : 3}"/>`; }).join("");
  const [ex, ey] = route.end;
  return `<svg class="rmap ${animate ? "anim" : ""} ${first ? "first" : ""}" viewBox="0 0 ${MAP_W} ${MAP_H}" aria-hidden="true">
    <defs>
      <pattern id="mdots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff"/></pattern>
      <radialGradient id="mfade" cx="55%" cy="45%" r="62%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <mask id="mmask"><rect width="${MAP_W}" height="${MAP_H}" fill="url(#mfade)"/></mask>
    </defs>
    <rect width="${MAP_W}" height="${MAP_H}" fill="url(#mdots)" opacity=".15" mask="url(#mmask)"/>
    <g>${bgArcs}</g>
    <path class="m-glow" d="${route.d}" pathLength="1"/>
    <path id="mroute" class="m-route" d="${route.d}" pathLength="1"/>
    ${dots}
    <circle class="m-ping" cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="6"/>
    ${labels}
    <g class="m-plane" ${animate ? 'opacity="0"' : `transform="translate(${ex.toFixed(1)} ${ey.toFixed(1)}) rotate(${route.angle.toFixed(1)})"`}>
      <g transform="rotate(90) scale(.95) translate(-12 -12)"><path d="${PLANE_PATH}"/></g>
      ${animate ? `<animateMotion id="mfly" data-go="330" dur="0.9s" begin="indefinite" fill="freeze" rotate="auto" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.65 0 0.35 1"><mpath href="#mroute"/></animateMotion>
        <set attributeName="opacity" to="1" begin="mfly.begin" fill="freeze"/>` : ""}
    </g>
  </svg>`;
}

/* Дуга в деталях рейса: самолёт летит к вершине и остаётся там (брендбук).
   Время SMIL у встроенного SVG идёт от загрузки документа, поэтому видимость
   привязана к началу полёта (id.begin), а не к абсолютной задержке. */
let arcSeq = 0;
function arcTrack(animate, delay = 0){
  const id = "ta" + (++arcSeq);
  return `<svg class="tarc" viewBox="0 0 200 46" aria-hidden="true">
    <path class="ta-path" d="M8 40 Q100 -6 192 40"/>
    <circle class="ta-end" cx="8" cy="40" r="3"/><circle class="ta-end" cx="192" cy="40" r="3"/>
    <g class="ta-plane" ${animate ? 'opacity="0"' : 'transform="translate(100 17)"'}>
      <g transform="rotate(90) scale(.72) translate(-12 -12)"><path d="${PLANE_PATH}"/></g>
      ${animate ? `<animateMotion id="${id}" data-go="${140 + delay}" dur="0.9s" begin="indefinite" fill="freeze" rotate="auto" calcMode="spline" keyPoints="0;0.5" keyTimes="0;1" keySplines="0.33 0 0.2 1" path="M8 40 Q100 -6 192 40"/>
        <set attributeName="opacity" to="1" begin="${id}.begin" fill="freeze"/>` : ""}
    </g></svg>`;
}

/* ---- 17-board.js ---- */
/* ==========================================================================
   Табло вылетов на главной — как в аэропорту Ташкента (брендбук: «Board»,
   IBM Plex Mono). Табло живое: часы идут по ташкентскому времени, статус
   каждого рейса считается от текущей минуты — по расписанию, регистрация,
   посадка, выход закрыт, вылетел. Раз в минуту перещёлкиваются только те
   ячейки, где поменялся текст. Рейсы — базовые рейсы маршрутов из движка
   приложения, выход на посадку — тот же, что в посадочном талоне.
   ========================================================================== */
"use strict";

const BOARD_DEST = ["IST","DXB","AYT","JED","SSH","CXR","HKT","DME"];
const FLAP_POOL = {
  lat:"ABCDEFGHIJKLMNOPQRSTUVWXYZ", cyr:"АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ", dig:"0123456789"
};
/* Статус по минутам до вылета; вылетевший рейс висит на табло ещё полчаса. */
const FIDS = [["departed", 0], ["closed", 20], ["boarding", 50], ["checkin", 180], ["sched", Infinity]];
const DEPARTED_KEEP = 30;
const fidsStatus = m => FIDS.find(([, max]) => m <= max)[0];
const poolFor = ch => /\d/.test(ch) ? FLAP_POOL.dig : /[А-ЯЁ]/.test(ch) ? FLAP_POOL.cyr : FLAP_POOL.lat;
const flaps = (s, row, col0) => [...s].map((ch, i) =>
  `<span class="fl${ch === " " ? " fl-sp" : ""}" data-r="${row}" data-c="${col0 + i}">${ch === " " ? "&nbsp;" : esc(ch)}</span>`).join("");
const hhmm = min => `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;

/* Ташкентское время: рейсы вылетают отсюда, где бы ни был посетитель. */
function tashNow(){
  const p = new Intl.DateTimeFormat("en-GB", { timeZone:"Asia/Tashkent", year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", hourCycle:"h23" }).formatToParts(new Date());
  const g = type => p.find(x => x.type === type).value;
  return { date:`${g("year")}-${g("month")}-${g("day")}`, min:Number(g("hour")) * 60 + Number(g("minute")) };
}
function boardRows(now){
  return BOARD_DEST.map(c => {
    const today = baseOffer("TAS", c, now.date), [h, mm] = today.depTime.split(":").map(Number);
    let m = h * 60 + mm - now.min, day = 0;
    if (m < -DEPARTED_KEEP) { m += 1440; day = 1; }
    const date = addDays(now.date, day), o = day ? baseOffer("TAS", c, date) : today;
    return { c, o, m, day, date, st:fidsStatus(m), code:o.flightNo.split("-")[0] };
  }).sort((a, b) => a.m - b.m);
}

/* Строка — кнопка. Экранному диктору — одна фраза целиком, а не буквы табло. */
const rowLabel = r => [r.o.depTime, `${r.o.flightNo} ${r.o.carrier}`, cityName(r.c), `${t("gate")} ${gateFor(r.o)}`, t("fs_" + r.st),
  priceFrom(fmt({ usd:r.o.priceUSD, uzs:r.o.priceUZS })), t("board_sub")].join(", ");
function boardRow(r, i, w){
  const name = cityName(r.c).toLocaleUpperCase(LOC[S.lang]);
  return `<button type="button" class="brd-row st-${r.st}" data-act="boardgo" data-v="${r.c}" data-d="${r.date}" data-st="${r.st}" aria-label="${esc(rowLabel(r))}">
    <span class="brd-cell brd-t" aria-hidden="true">${flaps(r.o.depTime, i, 0)}</span>
    <span class="brd-fl" aria-hidden="true">${carrierBadge(r.code, "cb-sm")}<span class="brd-cell brd-fn">${flaps(r.o.flightNo.padEnd(7, " "), i, 6)}</span></span>
    <span class="brd-cell brd-to" aria-hidden="true">${flaps(name.padEnd(w, " "), i, 14)}</span>
    <span class="brd-cell brd-gt" aria-hidden="true">${flaps(gateFor(r.o).padEnd(3, " "), i, 14 + w)}</span>
    <span class="brd-st" aria-hidden="true"><i></i><span>${esc(t("fs_" + r.st))}</span></span>
    <span class="brd-pr" aria-hidden="true"><span>${priceFrom(fmt({ usd:r.o.priceUSD, uzs:r.o.priceUZS }))}</span>${IC.chev}</span>
  </button>`;
}
const BOARD = { sig:"", timer:0 };
function boardHTML(){
  const now = tashNow(), rows = boardRows(now);
  const w = Math.max(...rows.map(r => cityName(r.c).length));
  BOARD.sig = rows.map(r => r.c + r.day).join();
  return `<div class="board" id="board" style="--w:${w}">
    <div class="brd-top">
      <span class="brd-kind"><span class="brd-kind-ic">${IC.flights}</span>${esc(t("board_dep"))}</span>
      <span class="brd-port">TAS · ${esc(cityName("TAS"))}</span>
      <span class="brd-clock" role="timer" aria-label="${esc(t("board_now"))}: ${hhmm(now.min)}"><span aria-hidden="true">${flaps(hhmm(now.min), "k", 0)}</span></span>
    </div>
    <div>
      <div class="brd-h" aria-hidden="true"><span>${esc(t("board_time"))}</span><span class="brd-fl">${esc(t("board_flight"))}</span>
        <span>${esc(t("board_to"))}</span><span class="brd-gt">${esc(t("gate"))}</span>
        <span class="brd-st">${esc(t("board_status"))}</span><span class="brd-pr">${esc(t("board_price"))}</span></div>
      ${rows.map((r, i) => (r.day && !rows[i - 1]?.day ? daySep(r.date) : "") + boardRow(r, i, w)).join("")}
    </div></div>`;
}
/* Рейсы, чей сегодняшний вылет уже прошёл, идут следом — под строкой с датой. */
const daySep = date => `<div class="brd-sep"><span>${esc(t("fs_tomorrow"))}, ${esc(fdate(date, { day:"numeric", month:"long" }))}</span></div>`;
function departureBoard(){
  return `<section class="container section">
    <div class="sec-h"><h2>${esc(t("board_title"))}</h2><p class="muted">${esc(t("board_sub"))}</p></div>
    ${boardHTML()}</section>`;
}

/* Перещёлкивание: один цикл requestAnimationFrame на все ячейки, с условием
   остановки. jobs — [{ el, final, pool, end }]. */
function flapRun(jobs, root){
  if (!jobs.length) return;
  let last = 0;
  const tick = now => {
    if (!root.isConnected) return;
    if (now - last >= 50) {
      last = now; let busy = false;
      for (const j of jobs) {
        if (j.done) continue;
        if (now >= j.end) { j.el.textContent = j.final; j.done = true; }
        else { busy = true; j.el.textContent = j.pool[Math.floor(Math.random() * j.pool.length)]; }
      }
      if (!busy) return;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
const flapJob = (el, final, delay) => ({ el, final, pool:poolFor(final), end:performance.now() + delay });
/* Первое появление табло: щёлкают все буквы, каскадом по строкам и столбцам. */
function flapBoard(board){
  if (REDUCED || !board) return;
  flapRun($$(".brd-row .fl:not(.fl-sp)", board).map(el =>
    flapJob(el, el.textContent, 180 + Number(el.dataset.c) * 26 + Number(el.dataset.r) * 55 + Math.random() * 140)), board);
}
/* Точечная замена текста: щёлкают только изменившиеся буквы. */
function flapTo(cells, text, board){
  const jobs = [];
  [...text].forEach((ch, i) => {
    const el = cells[i]; if (!el || el.textContent === ch) return;
    if (REDUCED) el.textContent = ch; else jobs.push(flapJob(el, ch, 160 + i * 70));
  });
  flapRun(jobs, board);
}

/* На смене минуты: часы и статусы. Если порядок рейсов поменялся (рейс
   улетел и ушёл на завтра) — табло собирается заново. */
function boardTick(){
  const board = $("#board"); if (!board) return;
  const now = tashNow(), rows = boardRows(now);
  if (rows.map(r => r.c + r.day).join() !== BOARD.sig) {
    board.outerHTML = boardHTML();
    return flapBoard($("#board"));
  }
  const clock = $(".brd-clock", board);
  flapTo($$(".fl", clock), hhmm(now.min), board);
  clock.setAttribute("aria-label", `${t("board_now")}: ${hhmm(now.min)}`);
  for (const r of rows) {
    const row = $(`.brd-row[data-v="${r.c}"]`, board);
    if (!row || row.dataset.st === r.st) continue;
    row.classList.replace(`st-${row.dataset.st}`, `st-${r.st}`); row.dataset.st = r.st;
    const label = $(".brd-st span", row); label.textContent = t("fs_" + r.st);
    row.setAttribute("aria-label", rowLabel(r));
    if (!REDUCED) label.animate([{ opacity:0, transform:"translateY(-6px)" }, { opacity:1, transform:"none" }], { duration:320, easing:EASE_OUT });
  }
}
function scheduleBoardTick(){
  clearTimeout(BOARD.timer);
  BOARD.timer = setTimeout(() => { if (!$("#board")) return; boardTick(); scheduleBoardTick(); }, 60000 - Date.now() % 60000 + 40);
}
/* Табло щёлкает, когда его видно, и один раз за посещение главной. */
function armBoard(){
  const board = $("#board"); if (!board) return;
  scheduleBoardTick();

/* ==========================================================================

   (данные OpenStreetMap) и рельеф Natural Earth, в фирменном тёмно-синем.

   innerHTML, поэтому узел карты живёт отдельно и после каждой отрисовки
   переставляется в новую «док»-обёртку героя — WebGL-контекст и загруженные
   тайлы при этом сохраняются.

   прорисовывается, и по ней летит самолёт (дуга большого круга — так летают
   настоящие рейсы). Для вертолётов камера опускается к Ташкентской области.

/* ---- геометрия маршрута ---- */
const R = Math.PI / 180;
const mercY = lat => Math.log(Math.tan(Math.PI / 4 + lat * R / 2));
const ll = ([lat, lon]) => [lon, lat];                           // COORDS хранит [широта, долгота]
/* Дуга большого круга, точками [долгота, широта]. */
function gcLine(a, b, n = 96){
  const [p1, l1, p2, l2] = [a[0] * R, a[1] * R, b[0] * R, b[1] * R];
  const d = 2 * Math.asin(Math.sqrt(Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin((l2 - l1) / 2) ** 2));
  if (d < 1e-6) return [ll(a), ll(b)];
  return Array.from({ length:n + 1 }, (_, i) => {
    const f = i / n, A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
    const x = A * Math.cos(p1) * Math.cos(l1) + B * Math.cos(p2) * Math.cos(l2);
    const y = A * Math.cos(p1) * Math.sin(l1) + B * Math.cos(p2) * Math.sin(l2);
    const z = A * Math.sin(p1) + B * Math.sin(p2);
    return [Math.atan2(y, x) / R, Math.atan2(z, Math.hypot(x, y)) / R];
  });
}
/* Короткий вертолётный перелёт: мягкая дуга, выгнутая к северу. */
function bowLine(a, b, n = 48){
  const [x1, y1, x2, y2] = [a[1], a[0], b[1], b[0]], k = Math.cos(y1 * R);
  let nx = -(y2 - y1), ny = (x2 - x1) * k;                         // нормаль в «квадратных» координатах
  const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
  if (ny < 0) { nx = -nx; ny = -ny; }
  const d = Math.hypot((x2 - x1) * k, y2 - y1) * 0.22, cx = (x1 + x2) / 2 + nx * d / k, cy = (y1 + y2) / 2 + ny * d;
  return Array.from({ length:n + 1 }, (_, i) => { const f = i / n, g = 1 - f;
    return [g * g * x1 + 2 * g * f * cx + f * f * x2, g * g * y1 + 2 * g * f * cy + f * f * y2]; });
}
/* Обзорный полёт: круг над городом с возвращением на площадку. */
function loopLine([lat, lon], n = 72){
  const r = 0.075, k = Math.cos(lat * R), c = [lon + r * 0.7 / k, lat + r * 0.7];
  const a0 = Math.atan2(lat - c[1], (lon - c[0]) * k);
  return Array.from({ length:n + 1 }, (_, i) => { const a = a0 - (i / n) * Math.PI * 2;
    return [c[0] + Math.cos(a) * r / k, c[1] + Math.sin(a) * r]; });
}
/* Положение на линии по доле пути. Расстояния — в проекции Меркатора,
   как у line-progress, чтобы самолёт шёл ровно по кромке прорисовки. */
function pathAt(line){
  const acc = [0];
  for (let i = 1; i < line.length; i++)
    acc.push(acc[i - 1] + Math.hypot((line[i][0] - line[i - 1][0]) * R, mercY(line[i][1]) - mercY(line[i - 1][1])));
  const L = acc[acc.length - 1] || 1;
  return p => {
    const d = clamp(p, 0, 1) * L; let i = 1;
    while (i < acc.length - 1 && acc[i] < d) i++;
    const f = (d - acc[i - 1]) / ((acc[i] - acc[i - 1]) || 1), a = line[i - 1], b = line[i];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  };
}

function glBounds(g){

function loadGL(){

  const css = Object.assign(document.createElement("link"), { rel:"stylesheet", href:GL_BASE + "maplibre-gl.css" });
  const js = Object.assign(document.createElement("script"), { src:GL_BASE + "maplibre-gl.js", async:true });
  js.onload = () => {
    if (GL.state !== "loading") return;          // уже показали запасную схему — не рисуем вторую карту поверх
    GL.state = "script"; const dock = $("#mapdock"); if (dock) glCreate(dock);
  };
  js.onerror = glFail;

  setTimeout(() => { if (GL.state === "loading") glFail(); }, GL_TIMEOUT);
}
function glFail(){
  if (GL.state === "failed") return;
  GL.state = "failed";

  GL.el?.remove(); GL.map = GL.el = null;

/* ---- маркеры: подписи точек, самолёт, круг прибытия ----
   Подпись ставится с той стороны точки, куда не уходит линия, и не
   вылезает за край карты. Ставится после того, как камера встала. */
const PILL_OFFSET = { left:[13, 0], right:[-13, 0], top:[0, 11], bottom:[0, -11] };
const EDGE = 10;                                                              // отступ подписи от края свободного поля
const pillWidth = p => 22 + (p.code ? 34 : 0) + p.name.length * 8.2;         // оценка до вставки в DOM
/* Сторона — прочь от линии; не помещается в свободное поле — на другую сторону
   или над/под точкой, а центрированную подпись сдвигаем внутрь поля. */
function pillPlace(p, next){
  const ox = -(next[0] - p[0]) * Math.cos(p[1] * R), oy = next[1] - p[1];     // y экрана — вниз
  const vert = oy > 0 ? "top" : "bottom", f = glFrameBox(), x = GL.map.project(p.ll).x, w = pillWidth(p);
  const fitsR = x + 13 + w <= f.x1 - EDGE, fitsL = x - 13 - w >= f.x0 + EDGE;
  let a = Math.abs(ox) > Math.abs(oy) ? (ox > 0 ? "left" : "right") : vert;
  if (a === "left" && !fitsR) a = fitsL && Math.abs(ox) > Math.abs(oy) * 2 ? "right" : vert;
  else if (a === "right" && !fitsL) a = fitsR && Math.abs(ox) > Math.abs(oy) * 2 ? "left" : vert;
  const off = [...PILL_OFFSET[a]];
  if (a === "top" || a === "bottom") off[0] = clamp(0, f.x0 + EDGE - (x - w / 2), f.x1 - EDGE - (x + w / 2));
  return { a, off };
}
function glPill(p, place, home){
  const el = document.createElement("div");
  el.className = "gl-pill" + (home ? " gl-home" : "");
  el.innerHTML = `${p.code ? `<b class="mono">${esc(p.code)}</b>` : ""}<span>${esc(p.name)}</span>`;
  return new maplibregl.Marker({ element:el, anchor:place.a, offset:place.off }).setLngLat(p.ll).addTo(GL.map);
}
const BLOCK_OFFSET = { left:[1.2, 0], right:[-1.2, 0], top:[0, .95], bottom:[0, -.95] };
function glMarkers(g){
  GL.pills.forEach(m => m.remove());
  const n = g.line.length, ends = [[g.home, g.line[Math.min(6, n - 1)]], ...(g.dest ? [[g.dest, g.line[Math.max(0, n - 7)]]] : [])];
  const places = ends.map(([p, next]) => pillPlace(p, next));
  GL.pills = ends.map(([p], i) => glPill(p, places[i], i === 0));
  GL.map.getSource("ends").setData({ type:"FeatureCollection", features:ends.map(([p], i) => { const { a, off } = places[i];
    const o = [BLOCK_OFFSET[a][0] + off[0] / 14 - PILL_OFFSET[a][0] / 14, BLOCK_OFFSET[a][1]];
    return { type:"Feature", geometry:{ type:"Point", coordinates:p.ll }, properties:{ t:`${p.code} ${p.name}`.trim(), a, o } }; }) });
  glPorts(g);
  if (GL.plane) { const el = GL.plane.getElement(); el.innerHTML = g.local ? HELI_ICON : PLANE_ICON; el.classList.toggle("is-heli", g.local); return; }
  const pe = Object.assign(document.createElement("div"), { className:"gl-plane" + (g.local ? " is-heli" : ""), innerHTML:g.local ? HELI_ICON : PLANE_ICON });
  GL.plane = new maplibregl.Marker({ element:pe, rotationAlignment:"viewport" }).setLngLat(g.home.ll).addTo(GL.map);
  GL.ping = new maplibregl.Marker({ element:Object.assign(document.createElement("div"), { className:"gl-ping" }) }).setLngLat(g.home.ll).addTo(GL.map);
}
/* Точки-города — только в свободном поле: под текстом и формой их не нажать. */
function glPorts(g){
  const f = glFrameBox(), pad = 24;
  const feats = g.ports.map(p => ({ p, ...GL.map.project(p.ll) }))
    .filter(({ x, y }) => x > f.x0 - pad && x < f.x1 + pad && y > f.y0 - pad && y < f.y1 + pad)
    .map(({ p, x }) => { const right = x + 14 + p.n.length * 7.2 > f.x1;       // подпись не влезает справа — ставим слева от точки
      return { type:"Feature", properties:{ n:p.n, id:p.id, a:right ? "right" : "left", o:right ? [-.75, 0] : [.75, 0] }, geometry:{ type:"Point", coordinates:p.ll } }; });
  GL.map.getSource("ports").setData({ type:"FeatureCollection", features:feats });
}
function glClearMarkers(){ GL.pills.forEach(m => m.remove()); GL.pills = []; GL.plane?.getElement().classList.remove("on"); }
function glSources(g){
  const pt = (c, props = {}) => ({ type:"Feature", properties:props, geometry:{ type:"Point", coordinates:c } });
  GL.map.getSource("ports").setData(EMPTY);                                // точки ставит glPorts, когда камера встанет
  GL.map.getSource("ends").setData({ type:"FeatureCollection", features:[pt(g.home.ll), ...(g.dest ? [pt(g.dest.ll)] : [])] });
  GL.map.getSource("route").setData({ type:"Feature", properties:{}, geometry:{ type:"LineString", coordinates:g.line } });
}
/* Кадр полёта: линия прорисована до p, самолёт — на её кромке, нос по курсу. */
function glFrame(g, at, p){
  GL.map.setPaintProperty("route-line", "line-gradient", grad(p, "#fff"));
  GL.map.setPaintProperty("route-glow", "line-gradient", grad(p, MAPC.glow));
  const a = GL.map.project(at(Math.min(p, .996))), b = GL.map.project(at(Math.min(p, .996) + .004));
  GL.plane.setLngLat(at(p)).setRotation(Math.atan2(b.y - a.y, b.x - a.x) / R + 90);
}
function glFly(g){
  cancelAnimationFrame(GL.raf);
  const at = pathAt(g.line), seq = GL.seq;
  GL.plane.getElement().classList.add("on");
  if (REDUCED) { glFrame(g, at, 1); return; }
  const t0 = performance.now(), pe = GL.plane.getElement();
  pe.classList.add("flying"); GL.flying = true;
  const tick = now => {
    if (seq !== GL.seq || !GL.map) { GL.flying = false; return; }
    const x = Math.min(1, (now - t0) / FLY_MS);
    glFrame(g, at, easeInOut(x));
    if (x < 1) { GL.raf = requestAnimationFrame(tick); return; }
    pe.classList.remove("flying"); GL.flying = false;
    const ring = GL.ping.getElement();
    GL.ping.setLngLat(g.dest ? g.dest.ll : g.home.ll);
    ring.classList.remove("go"); void ring.offsetWidth; ring.classList.add("go");
  };
  GL.raf = requestAnimationFrame(tick);
}

/* Нажали на город на карте — он становится направлением в форме,
   и камера перелетает к новому маршруту. */
function glPick(id){
  if (!id) return;
  if (M.module === "heli") M.heli.to = id;
  else if (M.module === "tours") M.tours.to = id;
  else if (M.module === "hotels") M.hotels.city = id;
  else if (M.module === "jet") M.jet.to = id;
  else M.flights.to = id;
  rerender();
}

/* ---- обновление после каждой отрисовки героя ---- */
function glUpdate(first = false){
  if (!GL.el.isConnected) { GL.stale = true; return; }         // ушли с главной, пока карта грузилась
  const g = glGeo(), moved = g.key !== GL.key, relang = S.lang !== GL.lang;
  if (!moved && !relang && !first) return;
  GL.key = g.key; GL.lang = S.lang; GL.geo = g;
  if (relang) for (const id of LABEL_LAYERS) GL.map.setLayoutProperty(id, "text-field", glName());
  glSources(g);
  if (!moved && !first) { glRefit(true); return; }                     // сменился только язык: герой мог перестроиться

  const seq = ++GL.seq;
  cancelAnimationFrame(GL.raf);
  glClearMarkers();
  glFrame0();
  const cam = GL.map.cameraForBounds(glBounds(g), { padding:glPadding(), maxZoom:g.maxZoom });
  let started = false;
  /* GL.geo, а не g: если за время перелёта сменили язык, подписи — на новом. */
  const land = () => { if (started || seq !== GL.seq) return; started = true; glMarkers(GL.geo); glFly(GL.geo); GL.fit = glFitKey(); };
  if (first || !cam || REDUCED) { if (cam) GL.map.jumpTo(cam); setTimeout(land, first ? 350 : 0); return; }
  GL.map.flyTo({ ...cam, duration:1500, curve:1.35 });
  GL.map.once("moveend", land);
  setTimeout(land, 1750);                  // страховка, если moveend не придёт
}
/* Размер карты и свободного поля, под которые ставилась камера. */
const glFitKey = () => `${GL.el.clientWidth}x${GL.el.clientHeight}:${JSON.stringify(glPadding())}`;
/* Поле поменялось (поворот телефона, другая ширина окна, язык перестроил
   герой) — та же камера в новых полях, без анимации. Не поменялось — ничего:
   на телефоне resize приходит и при сворачивании адресной строки. */
function glRefit(force = false){
  if (GL.state !== "ready" || !GL.el?.isConnected || !GL.geo) return;
  const key = glFitKey();
  if (!force && key === GL.fit) return;
  GL.fit = key;
  const cam = GL.map.cameraForBounds(glBounds(GL.geo), { padding:glPadding(), maxZoom:GL.geo.maxZoom });
  if (cam) GL.map.jumpTo(cam);
  glMarkers(GL.geo);
  if (!GL.flying) glFrame(GL.geo, pathAt(GL.geo.line), 1);
}
/* Линия спрятана — перед перелётом камеры. */
function glFrame0(){
  GL.map.setPaintProperty("route-line", "line-gradient", grad(0, "#fff"));
  GL.map.setPaintProperty("route-glow", "line-gradient", grad(0, MAPC.glow));
}
/* Каждая отрисовка главной переставляет карту в новый герой. */
function dockMap(){
  const dock = $("#mapdock"); if (!dock) return;
  if (GL.state === "idle") return loadGL();
  if (GL.state === "script" && !GL.map) return glCreate(dock);
  if (!GL.el || GL.state === "failed") return;
  dock.append(GL.el);
  if (GL.state !== "ready") return;
  $("#mapframe")?.classList.add("gl-on");
  GL.map.resize();
  if (GL.stale) { GL.stale = false; GL.key = null; return glUpdate(true); }
  const before = GL.key;
  glUpdate();
  if (GL.key === before) glRefit();                                     // вернулись на главную после поворота экрана
}
/* Ширина окна изменилась — та же камера в новых полях, без анимации. */
let glResizeT = 0;
window.addEventListener("resize", () => { clearTimeout(glResizeT); glResizeT = setTimeout(() => glRefit(), 160); });

/* ==========================================================================
   Модуль «Авиабилеты». Движок перенесён 1:1 из src/data/flights.ts:
   тот же маршрут и дата дают те же рейсы, что в мобильном приложении.
   ========================================================================== */
"use strict";

const PROVIDERS = ["aqua","kompas","easy","prestige"];
function addMinutes(hhmm, mins){ const [h,m] = hhmm.split(":").map(Number); const x = (h*60+m+mins+1440*3) % 1440; return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0"); }
function baseSeed(from, to){
  const key = `${from}-${to}`; if (ROUTES[key]) return ROUTES[key];
  const rnd = mulberry32(seedFrom(key));
  const eco = 180+Math.floor(rnd()*420), durationMin = 150+Math.floor(rnd()*420), depH = 5+Math.floor(rnd()*16);
  const c = CARRIERS[Math.floor(rnd()*CARRIERS.length)];
  const depTime = `${String(depH).padStart(2,"0")}:${["00","15","30","45"][Math.floor(rnd()*4)]}`;
  return { carrier:c.name, flightNo:`${c.code}-${100+Math.floor(rnd()*899)}`, plane:PLANES[Math.floor(rnd()*PLANES.length)],
    depTime, arrTime:addMinutes(depTime, durationMin), ecoPrice:eco, busPrice:eco+220+Math.floor(rnd()*260), durationMin };
}
function generateOffers({ from, to, date, cabin }){
  const seed = baseSeed(from, to), rnd = mulberry32(seedFrom(`${from}-${to}-${date}-${cabin}`));
  const count = 4+Math.floor(rnd()*4), offers = [];
  for (let i = 0; i < count; i++) {
    const isBase = i === 0;
    const carrier = isBase ? { name:seed.carrier, code:seed.flightNo.split("-")[0] } : CARRIERS[Math.floor(rnd()*CARRIERS.length)];
    const stops = isBase ? 0 : (rnd() < 0.55 ? 0 : 1);
    const extra = stops === 1 ? 120+Math.floor(rnd()*150) : 0;
    const durationMin = seed.durationMin+extra+Math.floor((rnd()-0.5)*40);
    const depTime = isBase ? seed.depTime : addMinutes(seed.depTime, Math.floor((rnd()-0.5)*600));
    const arrTime = addMinutes(depTime, durationMin);
    const rawBase = cabin === "business" ? seed.busPrice : seed.ecoPrice;
    const jitter = isBase ? 0 : Math.floor((rnd()-0.35)*(cabin === "business" ? 160 : 90));
    const stopDiscount = stops === 1 ? -Math.floor(rawBase*0.08) : 0;
    const priceUSD = Math.round(Math.max(90, rawBase+jitter+stopDiscount) * (1 + prices().flightMarkupBps / 10000));   // наценка (10%, меняется в админке), как на сервере
    const stopCities = ["DXB","IST","DME","SHJ","ALA"];
    offers.push({ id:`${from}${to}-${date}-${i}`, provider:PROVIDERS[Math.floor(rnd()*PROVIDERS.length)],
      carrier:carrier.name, carrierCode:carrier.code,
      flightNo:isBase ? seed.flightNo : `${carrier.code}-${100+Math.floor(rnd()*899)}`,
      aircraft:isBase ? seed.plane : PLANES[Math.floor(rnd()*PLANES.length)],
      from, to, date, depTime, arrTime, durationMin, stops,
      stopCity:stops === 1 ? stopCities[Math.floor(rnd()*stopCities.length)] : undefined,
      cabin, priceUSD, priceUZS:toUzs(priceUSD), baggageKg:cabin === "business" ? 30 : 20, seatsLeft:1+Math.floor(rnd()*9) });
  }
  return offers.sort((a, b) => a.priceUSD - b.priceUSD);
}
/* Код брони — src/app/review.tsx makeRef. */
function makeRef(seed){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  let out = ""; for (let i = 0; i < 6; i++) { out += chars[h % chars.length]; h = Math.floor(h/chars.length) + seed.charCodeAt(i % seed.length)*7; }
  return `CHR-${out}`;
}
/* Регулярный рейс маршрута из таблицы приложения, если он есть, иначе самый дешёвый. */
function baseOffer(from, to, date, cabin = "economy"){
  const list = generateOffers({ from, to, date, cabin }), r = ROUTES[`${from}-${to}`];
  return (r && list.find(o => o.flightNo === r.flightNo)) || list[0];
}
const seatFor = o => `${10 + (o.durationMin % 20)}${"ABCDEF"[o.priceUSD % 6]}`;
const gateFor = o => `${"AB"[o.priceUSD % 2]}${5 + (o.durationMin % 15)}`;

/* Цена — src/app/offer.tsx: (туда + обратно) × (взрослые + дети) + 10% × младенцы. */
function flightFare(out, back, q){
  const unit = { usd: out.priceUSD + (back ? back.priceUSD : 0), uzs: out.priceUZS + (back ? back.priceUZS : 0) };
  const inf  = { usd: Math.round(unit.usd * 0.1), uzs: Math.round(unit.uzs * 0.1) };
  const paying = q.adults + q.children;
  return { unit, inf, total: addA(mulA(unit, paying), mulA(inf, q.infants)) };
}

function priceCalendar(){
  const f = M.flights, q = legQuery(f.leg), minDate = f.leg === "back" ? f.depart : TODAY;
  const days = [];
  for (let i = -3; i <= 3; i++) { const d = addDays(q.date, i); if (d >= minDate) days.push(d); }
  const prices = days.map(d => generateOffers({ from:q.from, to:q.to, date:d, cabin:f.cabin })[0]);
  const lo = Math.min(...prices.map(p => p.priceUSD)), hi = Math.max(...prices.map(p => p.priceUSD));
  return `<div class="cal" role="group" aria-label="${esc(t("price_calendar"))}">${days.map((d, i) => {
    const p = prices[i], cls = d === q.date ? "on" : p.priceUSD === lo ? "lo" : p.priceUSD === hi && hi !== lo ? "hi" : "";
    return `<button type="button" class="calday ${cls}" data-act="fday" data-v="${d}" aria-pressed="${d === q.date}">
      <span class="cd">${esc(fdate(d, { weekday:"short", day:"numeric", month:"short" }))}</span>
      <span class="cp">${fmt({ usd:p.priceUSD, uzs:p.priceUZS })}</span></button>`; }).join("")}</div>`;
}

/* Маршрут с дугой: в деталях рейса самолёт летит к вершине (брендбук). */
function routeArc(o, animate, delay){
  const nd = nextDay(o);
  return `<div class="route">
    <div class="end"><span class="code">${o.from}</span><span class="city">${esc(cityName(o.from))}</span><span class="time">${o.depTime}</span></div>
    <div class="track">${arcTrack(animate, delay)}<span class="d">${dur(o.durationMin)}</span>
      <span class="s ${o.stops ? "s-stop" : "s-direct"}">${o.stops ? esc(tf("via", { c: o.stopCity })) : esc(t("direct"))}</span></div>
    <div class="end r"><span class="code">${o.to}</span><span class="city">${esc(cityName(o.to))}</span><span class="time">${o.arrTime}${nd ? ` <sup class="nd">+${nd}</sup>` : ""}</span></div>
  </div>`;
}
/* Дуга анимируется один раз за посещение страницы, не при каждой перерисовке. */
function arcOnce(){ const a = !REDUCED && !M.ui.arcSeen; M.ui.arcSeen = true; return a; }
function legCard(o, label, animate = false, delay = 0){
  return `<div class="card leg">
    <div class="leg-h"><span class="lbl">${esc(label)} · ${esc(fdateLong(o.date))}</span>${carrierBadge(o.carrierCode)}</div>
    ${routeArc(o, animate, delay)}
    <div class="rows">
      <div><span class="k">${esc(o.carrier)}</span><span class="v mono">${o.flightNo}</span></div>
      <div><span class="k">${esc(t("aircraft"))}</span><span class="v">${esc(o.aircraft)}</span></div>
      <div><span class="k">${esc(t("baggage"))}</span><span class="v">${o.baggageKg} ${esc(t("kg"))}</span></div>
      <div><span class="k">${esc(t("carryon"))}</span><span class="v">${IC.ok}</span></div>
    </div></div>`;
}
function flightLines(out, back, q){
  const fare = flightFare(out, back, q), lines = [];
  if (q.adults)   lines.push([`${t("adults")} × ${q.adults}`, mulA(fare.unit, q.adults)]);
  if (q.children) lines.push([`${t("children")} × ${q.children}`, mulA(fare.unit, q.children)]);
  if (q.infants)  lines.push([`${t("infant_fare")} × ${q.infants}`, mulA(fare.inf, q.infants)]);
  return { lines, total: fare.total };
}

function flightDetailsOf(out, back, q){ return { out, back, q:{ adults:q.adults, children:q.children, infants:q.infants, cabin:q.cabin } }; }
function startFlightCheckout(){
  const f = M.flights, out = f.sel.out, back = f.sel.back;
  const { lines, total } = flightLines(out, back, f);
  const types = [...Array(f.adults).fill("adult"), ...Array(f.children).fill("child"), ...Array(f.infants).fill("infant")];
  startCheckout({
    type: "FLIGHT",
    title: `${cityName(out.from)} → ${cityName(out.to)}${back ? " → " + cityName(back.to) : ""}`,
    sub: `${fdateY(out.date)}${back ? " — " + fdateY(back.date) : ""} · ${pl(types.length, "pax")}`,
    start: out.date, end: back ? back.date : out.date,
    travellers: { mode:"full", types },
    lines, total, recheck: true,
    details: flightDetailsOf(out, back, f),
    ref: makeRef(out.id + out.date),
    /* Перепроверка цены: рейс берётся заново по текущей наценке (её могли
       сменить в админке после выбора). Демонстрация «Цена изменилась» на рейсах
       в Анталию — чтобы экран можно было показать по заказу, а не случайно. */
    priceChange: () => {
      const fresh = x => x && (generateOffers({ from:x.from, to:x.to, date:x.date, cabin:x.cabin }).find(y => y.id === x.id) || x);
      let newOut = fresh(out); const newBack = fresh(back);
      if (out.to === "AYT") { const usd = Math.round(newOut.priceUSD * 1.045); newOut = { ...newOut, priceUSD:usd, priceUZS:toUzs(usd) }; }
      if (newOut.priceUSD === out.priceUSD && (!back || newBack.priceUSD === back.priceUSD)) return null;
      const r = flightLines(newOut, newBack, f);
      return { total:r.total, lines:r.lines, details:flightDetailsOf(newOut, newBack, f) };
    }
  });
}

   Модуль «Отели». Тестовый каталог на курортных направлениях чартеров.

"use strict";

function hotelNightly(h, date){
  const month = parseYMD(date).getMonth() + 1;
  const season = HIGH_SEASON[h.city].includes(month) ? 1.18 : 1;
  return h.base * season * (0.94 + mulberry32(seedFrom(h.id + date))() * 0.12);
}
function hotelStay(h, checkin, nights, rooms, mult = 1){
  let sum = 0; for (let i = 0; i < nights; i++) sum += hotelNightly(h, addDays(checkin, i));
  return amt(sum * mult * rooms);
}

const nightsOf = q => daysBetween(q.checkin, q.checkout);
const beachText = h => h.beach == null ? t("beach_none") : h.beach <= 50 ? t("beach_first") : tf("beach_m", { m:h.beach });

/* ---- 40-tours.js ---- */
/* ==========================================================================
   Модуль «Туры». Пакет = регулярный рейс туда и обратно из движка приложения
   + отель из каталога + трансфер + страховка, с пакетной скидкой 7%.
   Скидка — это то, ради чего покупают тур, а не всё по отдельности, поэтому
   экономия показывается в явном виде.
   ========================================================================== */
"use strict";

const TOUR_DISCOUNT = 0.93;
const TRANSFER_USD = 20;          // за человека, туда и обратно

/* legs — рейсы из сохранённого заказа: чек старого заказа не должен зависеть
   от сегодняшней наценки. Без них — рейсы по текущим ценам. */
function tourPackage(h, q, legs = null){
  const out = legs?.out || baseOffer("TAS", q.to, q.depart), back = legs?.back || baseOffer(q.to, "TAS", addDays(q.depart, q.nights));
  const people = q.adults + q.children, rooms = Math.ceil(q.adults / 2);
  const flights = mulA({ usd: out.priceUSD + back.priceUSD, uzs: out.priceUZS + back.priceUZS }, people);
  const hotel = hotelStay(h, q.depart, q.nights, rooms);
  const transfer = mulA(amt(TRANSFER_USD), people);
  const separate = addA(flights, hotel, transfer);
  const total = pctA(separate, TOUR_DISCOUNT);
  const saving = { usd: separate.usd - total.usd, uzs: separate.uzs - total.uzs };
  const perPerson = { usd: Math.round(total.usd / people), uzs: Math.round(total.uzs / people / 1000) * 1000 };
  return { h, out, back, people, rooms, flights, hotel, transfer, separate, total, saving, perPerson };
}
/* Строки чека: их сумма ровно равна итогу — скидка идёт отрицательной строкой. */
function tourLines(p, q){
  return [
    [`${t("flight_rt")} × ${pl(p.people, "pax")}`, p.flights],
    [`${p.h.name} · ${pl(q.nights, "night")} × ${pl(p.rooms, "room")}`, p.hotel],
    [t("transfer"), p.transfer],
    [t("insurance"), null],
    [t("package_discount"), { usd: -p.saving.usd, uzs: -p.saving.uzs }]
  ];
}

/* ---- 50-charter.js ---- */
/* ==========================================================================
   Модули «Частные самолёты» и «Вертолёты». Поиска с ценами нет — у чартерных
   бортов нет API, цену ставит менеджер. Это та же заявочная модель, что в
   B2B-панели и в спецификации: NEW → PENDING (цена) → PAID → CONFIRMED.
   Сайт показывает честную оценку диапазоном до отправки заявки.
   ========================================================================== */
"use strict";

const round = (x, step) => Math.round(x / step) * step;
const fitClass = (list, pax, id) => id === "auto" ? list.find(c => c.seats >= pax) : list.find(c => c.id === id && c.seats >= pax);

function jetEstimate(q){
  const cls = fitClass(JETS, q.pax, q.cls); if (!cls) return null;
  const km = distanceKm(COORDS[q.from], COORDS[q.to]);
  const hours = km / cls.speed + 0.4;                         // + руление, набор, снижение
  const base = hours * cls.rate * (q.trip === "roundtrip" ? 2 : 1);
  return { cls, km, hours, low: amt(round(base, 100)), high: amt(round(base * 1.3, 100)), final: amt(round(base * 1.12, 100)) };
}
function heliEstimate(q){
  const cls = fitClass(HELIS, q.pax, q.cls); if (!cls) return null;
  const d = HELI_DEST.find(x => x.id === q.to);
  const km = d.tour ? 0 : distanceKm(HELI_BASE, d.coord);
  const hours = d.tour ? 0.5 : km / cls.speed + 0.25;
  // В одну сторону вертолёт всё равно возвращается на базу — оплачивается частично.
  const legs = d.tour ? 1 : q.trip === "roundtrip" ? 2 : 1.6;
  const base = Math.max(hours * cls.rate * legs, cls.rate * 0.5);
  return { cls, km, hours, dest:d, low: amt(round(base, 50)), high: amt(round(base * 1.25, 50)), final: amt(round(base * 1.1, 50)) };
}
const heliName = id => HELI_DEST.find(x => x.id === id)?.name[S.lang] ?? id;
const hoursText = h => { const m = Math.round(h * 60); return m < 60 ? `${m} ${t("min")}` : dur(m); };

function sendCharterRequest(kind){
  const q = M[kind], isJet = kind === "jet", e = isJet ? jetEstimate(q) : heliEstimate(q);
  hideErr("#cherr");
  const phone = q.phone || S.user?.phone || "";
  if (isJet && q.from === q.to) return showErr("#cherr", t("err_same_city"));
  if (q.date < TODAY) return showErr("#cherr", t("err_date_past"));
  if (!e) return showErr("#cherr", t("no_aircraft"));
  if (q.name.trim().length < 2) return showErr("#cherr", t("err_your_name"));
  if (!validPhone(phone)) return showErr("#cherr", t("err_contact"));
  const title = isJet ? `${cityName(q.from)} → ${cityName(q.to)}` : heliName(q.to);
  createOrder({
    type: isJet ? "JET" : "HELI", status: "NEW",
    title, sub: `${fdateY(q.date)}, ${q.time} · ${pl(q.pax, "pax")} · ${e.cls.model}`,
    start: q.date, end: q.date,
    ref: makeRef(kind + q.date + q.time + Date.now()),
    total: null, lines: null,
    travellers: [{ given: q.name.trim(), surname: "" }],
    contact: { phone: prettyPhone(phone), email: "" },
    details: { kind, from: isJet ? q.from : "TAS", to: q.to, date: q.date, time: q.time, pax: q.pax, trip: q.trip,
      cls: e.cls.id, model: e.cls.model, hours: e.hours, km: e.km, low: e.low, high: e.high, quote: e.final, note: q.note.trim() }
  }, id => { q.note = ""; go(`orders/${id}`); });
}

/* ==========================================================================
   Общее для всех модулей: оформление, оплата, заказы, документы.
   Заказ повторяет таблицу orders из спецификации: тип, статус, сумма, детали,
   история статусов (order_events). Строки чека не хранятся — они
   пересчитываются из деталей, поэтому переключение языка меняет и их.
   ========================================================================== */
"use strict";

const PAY_METHODS = [["payme","Payme","#33CCCC"],["click","Click","#0088FF"],["uzum","Uzum","#7C3AED"],["humo","Uzcard / Humo","#12996A"],["card","Visa / Mastercard","#2F6FE0"]];
const methodName = k => PAY_METHODS.find(m => m[0] === k)?.[1] ?? k;
const CITS = ["UZB","KAZ","KGZ","TJK","TKM","RUS","TUR"];
const blankTraveller = type => ({ type, surname:"", given:"", passport:"", gender:"", dob:"", expiry:"", cit:"UZB", save:false, fromId:null });

function checkLines(lines, total, countKey){
  return `<div class="rows">${lines.map(([l, a]) => `<div><span class="k">${esc(l)}</span><span class="v mono ${a && a.usd < 0 ? "neg" : ""}">${
      a == null ? esc(t("included")) : a.usd < 0 ? "−" + fmt({ usd:-a.usd, uzs:-a.uzs }) : fmt(a)}</span></div>`).join("")}
    <div class="tot"><span class="k">${esc(t("total"))}</span><span class="v" ${countKey ? countAttr(countKey, total) : ""}>${fmt(total)}</span></div></div>`;
}

/* ---------------------------------------------------------------- оформление */
function startCheckout(spec){
  M.checkout = { ...spec, method:"payme", pstate: spec.recheck ? "checking" : "ok", pending:null,
    travellers: spec.travellers.types.map(blankTraveller), mode: spec.travellers.mode,
    contact: { phone: S.user?.phone || "", email: "" } };
  go("checkout");
}
function travellerForm(x, i, mode){
  const full = mode === "full";
  const chips = S.travellers.length ? `<div class="tchips"><span class="lbl">${esc(t("select_traveller"))}</span>${S.travellers.map(tr =>
    `<button type="button" class="tchip" data-act="cfill" data-i="${i}" data-v="${tr.id}" aria-pressed="${x.fromId === tr.id}">${esc(tr.given)} ${esc(tr.surname[0])}.</button>`).join("")}</div>` : "";
  const f = (k, label, extra = "") => `<label class="field"><span>${esc(label)}</span><input data-tv="${i}" data-f="${k}" value="${esc(x[k])}" ${extra}></label>`;
  return `<div class="tform" id="tv${i}">
    <div class="tform-h"><b>${esc(mode === "lead" ? t("lead_guest") : `${t("passenger")} ${i+1}`)}</b><span class="muted small">${esc(t("pax_" + x.type))}</span></div>
    ${chips}
    <div class="sgrid sgrid-2">
      ${f("surname", t("surname"), 'class="upper" autocomplete="off" autocapitalize="characters" spellcheck="false"')}
      ${f("given", t("given_name"), 'class="upper" autocomplete="off" autocapitalize="characters" spellcheck="false"')}
      ${full ? f("passport", t("passport_no"), 'class="upper mono" autocomplete="off" autocapitalize="characters" spellcheck="false"') : ""}
      ${full ? `<label class="field"><span>${esc(t("citizenship"))}</span><select data-tv="${i}" data-f="cit">${CITS.map(c => `<option ${x.cit === c ? "selected" : ""}>${c}</option>`).join("")}</select></label>` : ""}
      ${full ? `<div class="field"><span>${esc(t("gender"))}</span>${seg("cgender", [["M", t("gender_m")], ["F", t("gender_f")]], x.gender, `data-i="${i}"`)}</div>` : ""}
      ${full ? f("dob", t("dob"), `type="date" max="${TODAY}"`) : ""}
      ${full ? f("expiry", t("expiry"), `type="date" min="${TODAY}"`) : ""}
    </div>
    ${full ? `<label class="chk"><input type="checkbox" data-act="csave" data-i="${i}" ${x.save ? "checked" : ""}><span>${esc(t("save_traveller"))}</span></label>` : ""}
    <div class="err" id="terr${i}" hidden></div></div>`;
}
PAGES.checkout = {
  render(){
    const c = M.checkout; if (!c) { go(SEARCH_PATH); return null; }
    const lines = c.pstate === "changed" ? c.pending.lines : c.lines, total = c.pstate === "changed" ? c.pending.total : c.total;
    let check = "";
    if (c.recheck && c.pstate === "checking") check = `<div class="pcheck wait"><span class="spin"></span>${esc(t("verifying_price"))}</div>`;
    else if (c.pstate === "changed") check = `<div class="changed settle"><h3>${esc(t("price_changed_title"))}</h3><p class="small">${esc(t("price_changed_body"))}</p>
        <div class="rows"><div><span class="k">${esc(t("old_price"))}</span><span class="v mono strike">${fmt(c.total)}</span></div>
          <div><span class="k">${esc(t("new_price"))}</span><span class="v mono">${fmt(c.pending.total)}</span></div></div>
        <button type="button" class="solid" data-act="caccept">${esc(t("accept_new_price"))}</button></div>`;
    else if (c.recheck) check = `<div class="pcheck good">${IC.ok}${esc(t("price_confirmed"))}</div>`;
    return `<div class="container section"><button type="button" class="backlink" data-act="hback">${IC.back}<span>${esc(t("back"))}</span></button>
      ${pageHead(t("checkout_title"), c.title)}
      <div class="twocol"><div class="stack">
        <div class="card stack"><h3>${esc(t(c.mode === "lead" ? "guest_details" : "passenger_details"))}</h3>
          ${c.travellers.map((x, i) => travellerForm(x, i, c.mode)).join('<hr class="sep">')}
          ${c.mode === "full" ? `<p class="secure">${IC.lock}<span>${esc(t("secure_note"))}</span></p>` : ""}</div>
        <div class="card stack"><h3>${esc(t("contact_details"))}</h3><div class="sgrid sgrid-2">
          <label class="field"><span>${esc(t("contact_phone"))}</span><input data-ct="phone" type="tel" value="${esc(c.contact.phone)}" autocomplete="tel" placeholder="+998"></label>
          <label class="field"><span>${esc(t("email_opt"))}</span><input data-ct="email" type="email" value="${esc(c.contact.email)}" autocomplete="email"></label></div>
          <div class="err" id="cerr" hidden></div></div>
        <div class="card stack"><h3>${esc(t("pay_method"))}</h3>${payMethods("cmethod", c.method)}</div>
      </div>
      <aside class="card sticky stack">
        <span class="lbl">${esc(t("doc_" + c.type))}</span><b>${esc(c.title)}</b><span class="muted small">${esc(c.sub)}</span>
        ${checkLines(lines, total, "checkout")}${check}
        <button type="button" class="cta" data-act="cpay" ${c.pstate === "ok" ? "" : "disabled"}>${esc(t("pay_now"))} · ${fmt(total)}</button>
        <p class="demo-note">${esc(t("pay_demo_note"))}</p></aside></div></div>`;
  },
  after(){
    const c = M.checkout; if (!c || c.pstate !== "checking") return;
    setTimeout(() => {
      if (M.checkout !== c || c.pstate !== "checking") return;
      const change = c.priceChange && !c.accepted ? c.priceChange() : null;
      if (change) { c.pending = change; c.pstate = "changed"; } else c.pstate = "ok";
      if (currentParts()[0] === "checkout") rerender();
    }, 1100);
  }
};
const payMethods = (act, val) => `<div class="methods">${PAY_METHODS.map(([k, l, col]) =>
  `<button type="button" class="method" data-act="${act}" data-v="${k}" aria-pressed="${val === k}"><span class="dot" style="background:${col}"></span>${l}<span class="rad"></span></button>`).join("")}</div>`;

function validateCheckout(){
  const c = M.checkout, last = c.end;
  const latin = s => /^[A-Z][A-Z' -]{0,40}$/.test(s);
  for (let i = 0; i < c.travellers.length; i++) {
    const x = c.travellers[i]; hideErr("#terr" + i);
    let e = null;
    if (!latin(x.surname) || !latin(x.given)) e = "err_name";
    else if (c.mode === "full") {
      if (!/^[A-Z0-9]{5,9}$/.test(x.passport)) e = "err_passport";
      else if (!x.gender) e = "err_gender";
      else if (!x.dob || x.dob >= TODAY) e = "err_dob";
      else if (!x.expiry || x.expiry <= last) e = "err_expiry";
    }
    if (e) { showErr("#terr" + i, t(e)); return false; }
  }
  hideErr("#cerr");
  if (!validPhone(c.contact.phone)) { showErr("#cerr", t("err_contact")); return false; }
  if (!validEmail(c.contact.email)) { showErr("#cerr", t("err_email")); return false; }
  return true;
}
Object.assign(ACT, {
  hback:   () => history.back(),
  cgender: el => { M.checkout.travellers[Number(el.dataset.i)].gender = el.dataset.v; rerender(); },
  csave:   el => { const x = M.checkout.travellers[Number(el.dataset.i)]; x.save = !x.save; rerender(); },
  cfill:   el => {
    const x = M.checkout.travellers[Number(el.dataset.i)], tr = S.travellers.find(v => v.id === el.dataset.v); if (!tr) return;
    Object.assign(x, { surname:tr.surname, given:tr.given, passport:tr.passport, gender:tr.gender, dob:tr.dob, expiry:tr.expiry, cit:tr.cit, fromId:tr.id, save:false });
    rerender();
  },
  cmethod: el => { M.checkout.method = el.dataset.v; rerender(); },
  caccept: () => { const c = M.checkout; Object.assign(c, { total:c.pending.total, lines:c.pending.lines, details:c.pending.details, accepted:true, pstate:"ok" }); rerender(); },
  cpay:    () => {
    const c = M.checkout; if (c.pstate !== "ok" || !validateCheckout()) return;
    c.travellers.forEach(x => {
      if (!x.save || S.travellers.some(v => v.passport === x.passport)) return;
      S.travellers.push({ id:uid("tr"), surname:x.surname, given:x.given, passport:x.passport, gender:x.gender, dob:x.dob, expiry:x.expiry, cit:x.cit });
    });
    S.travellers = S.travellers.slice(0, 10);
    overlay(t("processing"));
    setTimeout(() => {
      overlay("");
      createOrder({ type:c.type, status:"CONFIRMED", title:c.title, sub:c.sub, start:c.start, end:c.end, ref:c.ref, total:c.total,
        travellers:c.travellers.map(({ type, save, fromId, ...x }) => x), contact:{ ...c.contact, phone:prettyPhone(c.contact.phone) },
        method:c.method, details:c.details }, id => { M.checkout = null; go(`done/${id}`); });
    }, 1400);

function createOrder(spec, then){
  const now = Date.now();
  const o = { id:uid("o"), no:makeRef(`${spec.ref}:${now}:${Math.random()}`), type:spec.type, status:spec.status, createdAt:now,
    title:spec.title, sub:spec.sub, start:spec.start, end:spec.end, total:spec.total, method:spec.method || null,
    travellers:spec.travellers, contact:spec.contact, details:spec.details, req:null, paidAt:null,
    history: spec.status === "CONFIRMED" ? [{ s:"PAID", at:now }, { s:"CONFIRMED", at:now + 1000 }] : [{ s:"NEW", at:now }] };
  S.orders.unshift(o); save(); then?.(o.id);
  return o;
}
const hist = (o, s) => o.history.push({ s, at:Date.now() });
/* Заголовки заказа собираются из деталей при показе, а не хранятся строкой —
   иначе заказ, оформленный по-русски, остался бы русским в узбекском интерфейсе. */
function orderTitle(o){
  const d = o.details;
  if (o.type === "FLIGHT") return `${cityName(d.out.from)} → ${cityName(d.out.to)}${d.back ? " → " + cityName(d.back.to) : ""}`;
  if (o.type === "TOUR")   return `${hotelById(d.hotelId).name} · ${cityName(d.to)}`;
  if (o.type === "HOTEL")  return hotelById(d.hotelId).name;
  if (o.type === "JET")    return `${cityName(d.from)} → ${cityName(d.to)}`;
  return heliName(d.to);
}
function orderSub(o){
  const d = o.details;
  if (o.type === "FLIGHT") return `${fdateY(d.out.date)}${d.back ? " — " + fdateY(d.back.date) : ""} · ${pl(d.q.adults + d.q.children + d.q.infants, "pax")}`;
  if (o.type === "TOUR")   return `${fdateY(d.depart)} — ${fdateY(addDays(d.depart, d.nights))} · ${pl(d.nights, "night")} · ${pl(d.adults + d.children, "tourist")}`;
  if (o.type === "HOTEL")  return `${cityName(hotelById(d.hotelId).city)} · ${fdateY(d.checkin)} — ${fdateY(d.checkout)} · ${pl(d.nights, "night")}`;
  return `${fdateY(d.date)}, ${d.time} · ${pl(d.pax, "pax")} · ${d.model}`;
}
function effStatus(o){ return o.status === "CONFIRMED" && o.end < TODAY ? "COMPLETED" : o.status; }
const pill = s => `<span class="pill st-${s}">${esc(t("st_" + s))}</span>`;
function orderLines(o){
  const d = o.details;
  if (o.type === "FLIGHT") return flightLines(d.out, d.back, { ...d.q }).lines;
  if (o.type === "TOUR")  { const q = { to:d.to, depart:d.depart, nights:d.nights, adults:d.adults, children:d.children }; return tourLines(tourPackage(hotelById(d.hotelId), q, { out:d.out, back:d.back }), q); }
  if (o.type === "HOTEL") { const h = hotelById(d.hotelId), r = ROOM_TYPES.find(x => x.id === d.room);
    return [[`${t("room_" + r.id)} × ${pl(d.rooms, "room")} · ${pl(d.nights, "night")}`, o.total]]; }
  return [[`${d.model} · ${hoursText(d.hours)}`, o.total]];
}

/* Менеджер по чартерам — в демо отвечает за 5 секунд, подтверждает борт за 2,5.
   Таймер проверяет все заказы, поэтому переживает и переходы, и перезагрузку. */
function tickCharter(){
  const now = Date.now(); let changed = false;
  for (const o of S.orders) {
    if (o.type !== "JET" && o.type !== "HELI") continue;
    // Пока открыта админка, цену ставит оператор, а не таймер.
    if (o.status === "NEW" && now - o.createdAt >= 5000 && !opsLive()) { o.status = "PENDING"; o.total = o.details.quote; hist(o, "PENDING"); changed = true; toast(tf("toast_priced", { no:o.no })); }
    if (o.status === "PAID" && o.paidAt && now - o.paidAt >= 2500) { o.status = "CONFIRMED"; hist(o, "CONFIRMED"); changed = true; toast(tf("toast_confirmed", { no:o.no })); }
  }
  if (changed) { save(); if (currentParts()[0] === "orders") rerender(); }
}

}

        <p class="small muted center">${esc(t("otp_hint"))}</p><div class="err" id="lerr" hidden></div>
        <button type="button" class="cta" data-act="lverify">${esc(t("otp_cta"))}</button>
        <button type="button" class="link" data-act="lback">${esc(t("change_number"))}</button>`}
      <p class="demo-note">${esc(t("demo_banner"))}</p></div></div>`;
  },
  after(){ $("#lotp")?.focus(); }
};
function doVerify(){
  const v = ($("#lotp")?.value || "").trim();
  if (!/^\d{4}$/.test(v)) return showErr("#lerr", t("err_code"));
  S.user = { phone:M.ui.loginPhone }; save(); M.ui.loginStep = "phone";
  toast(t("signed_in")); go(M.returnTo || "orders"); M.returnTo = null;
}
Object.assign(ACT, {
  lsend:   () => { const v = $("#lph").value; if (!validPhone(v)) return showErr("#lerr", t("err_phone")); M.ui.loginPhone = prettyPhone(v); M.ui.loginStep = "code"; rerender(); },
  lverify: () => doVerify(),
  lback:   () => { M.ui.loginStep = "phone"; rerender(); }
});
document.addEventListener("input", e => { if (e.target.id === "lotp") { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4); if (e.target.value.length === 4) doVerify(); } });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "lph") ACT.lsend(); });

/* Полоса вкладок прокручивается вбок на узком экране, а перерисовка сбрасывает
   прокрутку — возвращаем выбранную вкладку в середину полосы. Только по
   горизонтали: scrollIntoView прокрутил бы и саму страницу. */
function centerActive(el){
  const strip = el?.parentElement; if (!strip || strip.scrollWidth <= strip.clientWidth) return;
  strip.scrollLeft = el.offsetLeft - (strip.clientWidth - el.offsetWidth) / 2;
}
function renderNav(key){
  const active = key === "" ? M.module : key.startsWith("charter/") ? key.split("/")[1] : key.split("/")[0];
  const live = S.orders.filter(o => o.start >= TODAY && !["CANCELLED","REFUNDED"].includes(o.status)).length;
  $("#nav").innerHTML = `<div class="container nav-in">
    <a class="logo" href="#/" aria-label="Charteri"><span class="wordmark dark">CHARTERI<b>.UZ</b></span></a>
    <nav class="navmods" aria-label="${esc(t("all_services"))}">${MODULE_ORDER.map(k => `<button type="button" data-act="mod" data-v="${k}" aria-current="${active === k}">${esc(t(MODULES[k].label))}</button>`).join("")}</nav>
    <div class="navright">
      <select id="langSel" class="minisel" aria-label="${esc(t("language"))}">${[["uz","O‘z"],["ru","Рус"],["en","Eng"]].map(([k, l]) => `<option value="${k}" ${S.lang === k ? "selected" : ""}>${l}</option>`).join("")}</select>
      <div class="cursw">${seg("setcur", [["UZS","UZS"],["USD","USD"]], S.cur)}</div>
      <a class="navlink" href="#/orders" aria-current="${key.startsWith("orders")}">${IC.bag}<span>${esc(t("my_orders"))}</span>${live ? `<i class="badge">${live}</i>` : ""}</a>
      <a class="navlink" href="#/${S.user ? "account" : "login"}" aria-current="${key === "account" || key === "login"}">${IC.user}<span>${esc(S.user ? t("tab_profile") : t("sign_in"))}</span></a>
    </div></div>`;
  centerActive($('.navmods [aria-current="true"]'));
  $("#footer").innerHTML = `<div class="container foot-in">
    <div class="stack" style="gap:8px"><span class="wordmark">CHARTERI<b>.UZ</b></span><p class="small">${esc(t("tagline"))}</p></div>
    <div class="stack" style="gap:6px"><b>${esc(t("all_services"))}</b>${MODULE_ORDER.map(k => `<button type="button" class="footlink" data-act="mod" data-v="${k}">${esc(t(MODULES[k].label))}</button>`).join("")}</div>
    <div class="stack" style="gap:6px"><b>${esc(t("we_accept"))}</b><div class="paychips">${PAY_METHODS.map(m => `<span>${m[1]}</span>`).join("")}</div></div>
    <p class="foot-note small">${esc(t("demo_footer"))}<br>${esc(t("credits"))}</p></div>`;
}

"use strict";

const SEED_TRAVELLER = { id:"tr1", surname:"KARIMOV", given:"AZIZ", passport:"FA1234567", gender:"M", dob:"1988-04-12", expiry:"2031-06-30", cit:"UZB" };

function freshState(){
  const st = { v:1, lang:S?.lang || "ru", cur:S?.cur || "UZS", theme:S?.theme || "system", user:null, travellers:[{ ...SEED_TRAVELLER }], orders:[] };
  const traveller = ({ id, ...x }) => x;

  // Предстоящий перелёт в Стамбул — у демо сразу есть билет, который можно открыть.
  const d1 = addDays(TODAY, 9), out = baseOffer("TAS", "IST", d1), q1 = { adults:1, children:0, infants:0, cabin:"economy" };
  const t1 = Date.now() - 3 * 864e5;
  st.orders.push({ id:"o-seed-1", no:makeRef("seed-1" + d1), type:"FLIGHT", status:"CONFIRMED", createdAt:t1,
    title:`${cityName("TAS")} → ${cityName("IST")}`, sub:`${fdateY(d1)} · ${pl(1, "pax")}`, start:d1, end:d1,
    total:flightFare(out, null, q1).total, method:"payme", travellers:[traveller(SEED_TRAVELLER)],
    contact:{ phone:"+998 90 123 45 67", email:"" }, details:{ out, back:null, q:q1 }, req:null, paidAt:null,
    history:[{ s:"PAID", at:t1 }, { s:"CONFIRMED", at:t1 + 1000 }] });

  // Прошедший отдых в Анталии — показывает статус «Выполнен».
  const h = hotelById("ayt-lara"), ci = addDays(TODAY, -40), n = 7, t2 = Date.now() - 55 * 864e5;
  st.orders.push({ id:"o-seed-2", no:makeRef("seed-2" + ci), type:"HOTEL", status:"CONFIRMED", createdAt:t2,
    title:h.name, sub:`${cityName("AYT")} · ${fdateY(ci)} — ${fdateY(addDays(ci, n))} · ${pl(n, "night")}`, start:ci, end:addDays(ci, n),
    total:hotelStay(h, ci, n, 1, 1), method:"uzum", travellers:[traveller(SEED_TRAVELLER)],
    contact:{ phone:"+998 90 123 45 67", email:"" },
    details:{ hotelId:h.id, room:"standard", checkin:ci, checkout:addDays(ci, n), nights:n, adults:2, children:0, rooms:1 }, req:null, paidAt:null,
    history:[{ s:"PAID", at:t2 }, { s:"CONFIRMED", at:t2 + 1000 }] });
  return st;
}
