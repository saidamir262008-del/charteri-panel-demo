<style>
/* ==========================================================================
   Сайт Charteri для пассажиров. Токены — брендбук и src/theme/tokens.ts.
   Unbounded — только латинский логотип: кириллицы в нём нет.
   ========================================================================== */
:root{
  --blue:#2F6FE0; --blue-hi:#255FC9; --navy:#16275C; --paper:#F6F4EF; --surface:#FFFFFF;
  --sunken:#EFEBE3; --sky:#E7EFFC; --ink:#191B20; --muted:#5C6270; --faint:#8A8F9C;
  --line:#E4E0D6; --mint:#12996A; --mint-bg:#DDF2E8; --coral:#E14B4B; --coral-bg:#FCE9E9;
  --warn:#9A6206; --warn-bg:#FCF0DC;
  --hero-a:#3F7DF0; --hero-b:#1E3577; --cta-a:#3D82F6; --cta-b:#2565E0; --band:#EEEAE1;
  --shadow:0 1px 2px rgba(22,39,92,.05),0 14px 34px -20px rgba(22,39,92,.30);
  --card-border:transparent; --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --blue:#6D9BF2; --blue-hi:#87ADF6; --navy:#D2DEF7; --paper:#0C0E13; --surface:#1B202B;
  --sunken:#141922; --sky:#1F2A3F; --ink:#E9EAEE; --muted:#A0A6B4; --faint:#767D8C;
  --line:#2B3240; --mint:#4FC79A; --mint-bg:#10291E; --coral:#F07070; --coral-bg:#2C1919;
  --warn:#E0A94B; --warn-bg:#2A2113; --hero-a:#24427C; --hero-b:#132650; --band:#11151D;
  --shadow:none; --card-border:#2B3240;
}}
:root[data-theme="dark"]{
  --blue:#6D9BF2; --blue-hi:#87ADF6; --navy:#D2DEF7; --paper:#0C0E13; --surface:#1B202B;
  --sunken:#141922; --sky:#1F2A3F; --ink:#E9EAEE; --muted:#A0A6B4; --faint:#767D8C;
  --line:#2B3240; --mint:#4FC79A; --mint-bg:#10291E; --coral:#F07070; --coral-bg:#2C1919;
  --warn:#E0A94B; --warn-bg:#2A2113; --hero-a:#24427C; --hero-b:#132650; --band:#11151D;
  --shadow:none; --card-border:#2B3240;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;color:var(--navy)}
h1{font-size:clamp(26px,3.4vw,34px);letter-spacing:-.6px}
h2{font-size:clamp(21px,2.4vw,26px);letter-spacing:-.4px}
h3{font-size:17px;letter-spacing:-.1px}
p{margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.lbl{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
.container{max-width:1180px;margin-inline:auto;padding-inline:20px}
.narrow{max-width:640px}
.section{padding-block:32px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.center{justify-content:center}
hr.sep{border:0;border-top:1px dashed var(--line);margin:4px 0}

/* ---- кнопки ---- */
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding-inline:20px;border-radius:14px;
  background:linear-gradient(135deg,var(--cta-a),var(--cta-b));color:#fff;font-weight:700;font-size:16px;text-align:center;
  box-shadow:0 10px 24px -12px rgba(37,101,224,.8)}
.cta:hover{filter:brightness(1.06)}
.cta:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;filter:none}
.solid{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding-inline:18px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;text-align:center}
.solid:hover{background:var(--blue-hi)}
.ghost{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding-inline:18px;border-radius:12px;border:1px solid var(--line);color:var(--blue);font-weight:600;background:var(--surface);text-align:center}
.ghost:hover{background:var(--sky)}
.ghost.sm{min-height:36px;padding-inline:14px;font-size:14px}
.link{color:var(--blue);font-weight:600;font-size:14.5px}
.danger{color:var(--coral)}
.backlink{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:600;font-size:14.5px;margin-bottom:14px}
.backlink svg{width:18px;height:18px}

/* ---- поля ---- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;width:100%;min-width:0;min-height:48px}
select{appearance:auto}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
input:disabled,select:disabled{opacity:.6}
.field.is-off{opacity:.5}
.upper{text-transform:uppercase}
.err{background:var(--coral-bg);color:var(--coral);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;padding-block:3px}
.chk input{width:18px;height:18px;min-height:0;accent-color:var(--blue);flex:none;margin:0}
.chk .stars svg{width:14px;height:14px}
.seg{display:flex;background:var(--sunken);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;min-height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);text-align:center;white-space:nowrap;padding-inline:10px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--card-border);padding:20px}

/* ---- выпадающие панели (пассажиры, гости) ---- */
.drop{position:relative}
.dropsum{list-style:none;display:flex;align-items:center;min-height:48px;padding:11px 36px 11px 12px;border:1px solid var(--line);border-radius:12px;
  background:var(--paper);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15.5px;position:relative}
.dropsum::-webkit-details-marker{display:none}
.dropsum::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);transform:translateY(-70%) rotate(45deg)}
.drop[open] .dropsum{border-color:var(--blue)}
.droppanel{position:absolute;z-index:30;top:calc(100% + 6px);right:0;min-width:310px;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:6px 16px;box-shadow:0 24px 50px -20px rgba(12,14,19,.45)}
.steps{display:flex;flex-direction:column}
.steprow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.steprow + .steprow{border-top:1px solid var(--line)}
.steprow b{font-weight:600;display:block}
.steprow small{color:var(--muted);font-size:12.5px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--blue);font-size:19px;font-weight:600}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper span{min-width:18px;text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:16px}

/* ---- шапка ---- */
.wordmark{font-family:"Unbounded","IBM Plex Sans",sans-serif;font-weight:800;letter-spacing:.3px;font-size:17px;color:#fff;white-space:nowrap}
.wordmark b{color:#9CC0FF;font-weight:800}
.wordmark.dark{color:var(--navy)}
.wordmark.dark b{color:var(--blue)}
#nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:20px;min-height:64px}
.navmods{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.navmods::-webkit-scrollbar{display:none}
.navmods button{padding:8px 12px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--muted);white-space:nowrap}
.navmods button:hover{background:var(--sunken);color:var(--ink)}
.navmods button[aria-current="true"]{color:var(--navy);background:var(--sky)}
.navright{display:flex;align-items:center;gap:8px;margin-left:auto}
.minisel{min-height:38px;width:auto;padding:6px 8px;font-size:14px;border-radius:10px}
.cursw .seg{flex-wrap:nowrap}
.cursw .seg button{min-height:30px;font-size:12.5px;padding-inline:8px}
.navlink{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.navlink:hover,.navlink[aria-current="true"]{background:var(--sunken);color:var(--ink)}
.navlink svg{width:20px;height:20px}
.badge{position:absolute;top:2px;left:22px;min-width:17px;height:17px;border-radius:9px;background:var(--coral);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding-inline:4px}

/* ---- главная: герой и поиск ---- */
/* Блок поиска нависает над следующей секцией, поэтому у героя нет overflow:hidden —
   декоративные круги обрезаются собственным слоем. */
.hero{background:linear-gradient(155deg,var(--hero-a),var(--hero-b));color:#fff;padding-block:44px 40px;position:relative}
.hero-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.hero-deco::before{content:"";position:absolute;right:-120px;top:-160px;width:520px;height:520px;border-radius:50%;border:1px dashed rgba(255,255,255,.16)}
.hero-deco::after{content:"";position:absolute;right:40px;top:-40px;width:300px;height:300px;border-radius:50%;border:1px dashed rgba(255,255,255,.10)}
.eyebrow{font-size:13px;font-weight:600;color:rgba(255,255,255,.72);letter-spacing:.2px;position:relative;z-index:1}
.hero-h{color:#fff;font-size:clamp(32px,5vw,52px);letter-spacing:-1.2px;margin-top:10px;max-width:18ch;position:relative;z-index:1}
.hero-sub{color:rgba(255,255,255,.82);font-size:17px;margin-top:12px;max-width:60ch;position:relative;z-index:1}
.searchbox{position:relative;z-index:2;margin-top:28px;margin-bottom:-96px;background:var(--surface);color:var(--ink);border-radius:22px;
  box-shadow:0 30px 70px -30px rgba(12,20,50,.55);border:1px solid var(--card-border)}
.hero + .container{padding-top:128px}
.modtabs{display:flex;gap:4px;padding:10px 10px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.modtabs::-webkit-scrollbar{display:none}
.modtab{display:flex;align-items:center;gap:8px;padding:11px 14px 13px;border-radius:12px 12px 0 0;font-weight:600;font-size:14.5px;color:var(--muted);white-space:nowrap;position:relative}
.modtab svg{width:20px;height:20px}
.modtab:hover{color:var(--ink)}
.modtab[aria-selected="true"]{color:var(--blue)}
.modtab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--blue)}
.sform{padding:18px}
.sform-top{margin-bottom:14px;max-width:340px}
.sgrid{display:grid;gap:12px;align-items:end}
.sgrid-flights{grid-template-columns:1fr auto 1fr 1fr 1fr 1.1fr auto}
.sgrid-hotels{grid-template-columns:1.4fr 1fr 1fr 1.2fr auto}
.sgrid-tours{grid-template-columns:1fr 1.3fr 1fr .9fr 1.1fr auto}
.sgrid-jet{grid-template-columns:1fr 1fr 1fr 1fr auto}
.sgrid-heli{grid-template-columns:1.2fr 1.3fr 1fr 1fr auto}
.sgrid-2{grid-template-columns:1fr 1fr}
.sgo{width:auto;min-width:150px}
.swapbtn{width:40px;height:48px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--blue);background:var(--surface)}
.swapbtn svg{width:20px;height:20px}
.sform-note{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--muted);min-height:20px}
.sform-note svg{width:18px;height:18px;flex:none;color:var(--blue)}
.sform-note b{color:var(--navy);font-family:"IBM Plex Mono",monospace}
.sform .err{margin-top:12px}

/* ---- главная: секции ---- */
.sec-h{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.band{background:var(--band)}
.destgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.dest{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--card-border)}
.postcard{position:relative;height:150px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;overflow:hidden;
  background:linear-gradient(150deg,var(--pa),var(--pb))}
.postcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 14px);
  -webkit-mask:linear-gradient(to top,#000 0,transparent 70%);mask:linear-gradient(to top,#000 0,transparent 70%)}
.postcard::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.pc-code{position:absolute;right:18px;top:14px;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:46px;letter-spacing:1px;opacity:.9;z-index:1}
.pc-city{font-size:22px;font-weight:700;position:relative;z-index:1}
.pc-sub{font-size:13px;opacity:.85;position:relative;z-index:1}
.dest-b{display:flex;flex-direction:column}
.dest-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 18px;font-size:14.5px}
.dest-row + .dest-row{border-top:1px dashed var(--line)}
.dest-row:hover{background:var(--sunken)}
.dest-row span{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.dest-row svg{width:18px;height:18px;color:var(--blue)}
.dest-row b{font-family:"IBM Plex Mono",monospace;color:var(--navy);white-space:nowrap}
.svcgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.svc{display:flex;flex-direction:column;gap:8px;padding:20px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--card-border);text-align:left}
.svc:hover{outline:2px solid color-mix(in srgb,var(--blue) 30%,transparent)}
.svc-ic{width:44px;height:44px;border-radius:13px;background:var(--sky);color:var(--blue);display:grid;place-items:center}
.svc-ic svg{width:24px;height:24px}
.svc b{font-size:16px;color:var(--navy)}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.how li{display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:2px solid var(--navy)}
.how-n{font-size:13px;font-weight:600;color:var(--blue)}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.trust > div{display:flex;gap:14px;align-items:flex-start}
.trust svg{width:30px;height:30px;flex:none;color:var(--mint)}
.trust b{display:block;margin-bottom:3px}

/* ---- выдача ---- */
.resbar{background:var(--surface);border-bottom:1px solid var(--line)}
.resbar-in{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.resbar-in > div{display:flex;flex-direction:column;gap:2px}
.rb-route{font-size:21px;font-weight:700;color:var(--navy)}
.rb-route.mono{font-weight:600;letter-spacing:.5px}
.reslayout{display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:start}
.filters{position:sticky;top:84px}
.fbox{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--card-border)}
.fbox > summary{list-style:none;padding:16px 18px;font-weight:700;color:var(--navy);cursor:pointer;border-bottom:1px solid var(--line)}
.fbox > summary::-webkit-details-marker{display:none}
.fbody{padding:14px 18px 18px;display:flex;flex-direction:column;gap:18px}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup .seg{flex-direction:column}
.fgroup input[type=range]{padding:0;min-height:0;border:0;background:none;accent-color:var(--blue)}
.searching{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14.5px;margin-bottom:14px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--blue);animation:spin .8s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{height:132px;border-radius:var(--r);background:linear-gradient(90deg,var(--sunken) 0,var(--surface) 50%,var(--sunken) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.legsteps{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-bottom:14px;font-size:14px;color:var(--faint)}
.legsteps .on{color:var(--navy);font-weight:700}
.legsteps .done{color:var(--mint);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:20px;overflow-x:auto}
.calday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-width:128px}
.calday .cd{font-size:12.5px;color:var(--muted);white-space:nowrap}
.calday .cp{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12.5px;color:var(--navy);white-space:nowrap}
.calday.lo{border-color:var(--mint);background:var(--mint-bg)} .calday.lo .cp{color:var(--mint)}
.calday.hi .cp{color:var(--coral)}
.calday.on{border-color:var(--blue);background:var(--blue)} .calday.on .cd,.calday.on .cp{color:#fff}
.offer{display:grid;grid-template-columns:220px 1fr 190px;gap:22px;align-items:center;background:var(--surface);border:1px solid var(--card-border);
  border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.of-car{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.of-car > span{display:flex;flex-direction:column;min-width:0}
.of-car b{font-weight:600;font-size:14.5px}
.of-car small{color:var(--faint);font-size:12px}
.tag-best{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:1px;padding:3px 8px;border-radius:7px;background:var(--mint-bg);color:var(--mint)}
.of-buy{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.of-buy .solid{margin-top:8px;width:100%}
.of-price{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:21px;color:var(--navy);white-space:nowrap}
.of-meta{font-size:12.5px;color:var(--muted)}
.left{color:var(--coral)}
.cb{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12.5px;flex:none}

/* ---- маршрут ---- */
.route{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
.route .end{display:flex;flex-direction:column}
.route .end.r{text-align:right}
.route .code{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:26px;color:var(--navy);letter-spacing:.5px;line-height:1}
.route .city{font-size:13px;color:var(--muted);margin-top:4px}
.route .time{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;margin-top:2px}
.nd{color:var(--coral);font-size:11px}
.track{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.track .d{font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.track .ln{position:relative;width:100%;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px)}
.track .ln svg{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%) rotate(90deg);fill:var(--blue);background:var(--surface);border-radius:50%}
.track .s{font-size:12px;font-weight:600;white-space:nowrap}
.s-direct{color:var(--mint)} .s-stop{color:var(--coral)}

/* ---- детали, чек, оформление ---- */
.pagehead{display:flex;flex-direction:column;gap:6px;margin-bottom:20px}
.twocol{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}
.sticky{position:sticky;top:84px}
.leg{display:flex;flex-direction:column;gap:16px}
.leg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rows{display:flex;flex-direction:column}
.rows > div{display:flex;justify-content:space-between;gap:14px;padding-block:9px;font-size:14.5px}
.rows > div + div{border-top:1px solid var(--line)}
.rows .k{color:var(--muted)}
.rows .v{font-weight:600;text-align:right}
.rows .v svg{width:18px;height:18px;color:var(--mint)}
.rows .v.neg{color:var(--mint)}
.rows .tot{font-size:16px}
.rows .tot .k{color:var(--navy);font-weight:600}
.rows .tot .v{font-family:"IBM Plex Mono",monospace;color:var(--navy);font-size:21px}
.tform{display:flex;flex-direction:column;gap:12px}
.tform-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tform-h b{font-size:16px;color:var(--navy)}
.tchips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.tchip{min-height:32px;padding-inline:12px;border-radius:999px;background:var(--sky);color:var(--navy);font-weight:600;font-size:13px}
.tchip[aria-pressed="true"]{background:var(--blue);color:#fff}
.secure{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--muted)}
.secure svg{width:17px;height:17px;flex:none;color:var(--mint)}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.method{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14.5px}
.method[aria-pressed="true"]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 7%,var(--surface))}
.method .dot{width:12px;height:12px;border-radius:50%;flex:none}
.method .rad{margin-left:auto;width:19px;height:19px;border-radius:50%;border:2px solid var(--line);flex:none}
.method[aria-pressed="true"] .rad{border:6px solid var(--blue)}
.pcheck{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:13px;font-size:14px;font-weight:600}
.pcheck.wait{background:var(--sunken);color:var(--muted)}
.pcheck.good{background:var(--mint-bg);color:var(--mint)}
.pcheck svg{width:18px;height:18px}
.changed{background:var(--warn-bg);border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:10px}
.changed h3{color:var(--warn);font-size:16px}
.strike{text-decoration:line-through;color:var(--muted)}
.demo-note{font-size:12.5px;color:var(--faint);text-align:center}

/* ---- отели и туры ---- */
.hotel{display:grid;grid-template-columns:150px 1fr 200px;gap:20px;align-items:stretch;background:var(--surface);border:1px solid var(--card-border);
  border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.hart{position:relative;border-radius:14px;min-height:130px;background:linear-gradient(150deg,var(--pa),var(--pb));color:#fff;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;padding:12px}
.hart::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;border:14px solid rgba(255,255,255,.12)}
.hart-m{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:30px;letter-spacing:1px;position:relative;z-index:1}
.hart-s{display:flex;gap:2px;position:relative;z-index:1}
.hart-s svg{width:13px;height:13px;fill:#FFD66B}
.ho-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.ho-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ho-h h3{font-size:18px}
.stars{display:inline-flex;gap:1px}
.stars svg{width:15px;height:15px;fill:#E0A94B}
.ho-tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rating{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;padding:3px 8px;border-radius:8px;background:var(--navy);color:var(--paper)}
.tag-b{font-size:13px;padding:3px 9px;border-radius:8px;background:var(--sky);color:var(--navy)}
.chips-row{display:flex;flex-wrap:wrap;gap:6px}
.chip-s{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ho-buy{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:3px;text-align:right}
.ho-buy .solid{margin-top:8px;width:100%}
.save{font-size:12.5px;font-weight:600;color:var(--mint);background:var(--mint-bg);padding:3px 9px;border-radius:8px;margin-top:4px}
.incl{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.incl span{display:inline-flex;align-items:center;gap:5px}
.incl svg{width:15px;height:15px;color:var(--mint)}
.incl.big{flex-direction:column;font-size:14.5px;color:var(--ink)}
.flightstrip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;margin-bottom:18px;font-size:14px}
.flightstrip svg{width:20px;height:20px;color:var(--blue)}
.hhero{display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:center}
.hhero .hart{min-height:170px}
.roomlist{display:flex;flex-direction:column}
.room{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.room + .room{border-top:1px solid var(--line)}
.room > div:first-child{display:flex;flex-direction:column;gap:2px}
.room-buy{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.room-buy small{min-width:70px}

/* ---- частные рейсы ---- */
.clsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cls{display:flex;flex-direction:column;gap:3px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.cls b{color:var(--navy)}
.cls[aria-pressed="true"]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 7%,var(--surface))}
.cls:disabled{opacity:.4;cursor:not-allowed}
.est{display:flex;flex-direction:column;gap:12px}
.est-range{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:24px;color:var(--navy)}
.waitcard{align-items:flex-start}
.waitcard .spin{width:28px;height:28px;border-width:3px}

/* ---- заказы ---- */
.chipbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.chip{flex:none;min-height:36px;padding-inline:15px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);background:var(--surface);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.subh{font-size:18px;margin:22px 0 12px}
.ocard{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--card-border);
  border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.ocard:hover{outline:2px solid color-mix(in srgb,var(--blue) 30%,transparent)}
.ocard.past{opacity:.75}
.oc-ic{width:44px;height:44px;border-radius:13px;background:var(--sky);color:var(--blue);display:grid;place-items:center;flex:none}
.oc-ic svg{width:23px;height:23px}
.oc-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.oc-main b{color:var(--navy);font-size:16px}
.oc-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.oc-side b{color:var(--navy);white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-NEW{background:var(--sunken);color:var(--muted)}
.st-PENDING{background:var(--warn-bg);color:var(--warn)}
.st-PAID{background:var(--sky);color:var(--blue)}
.st-CONFIRMED,.st-COMPLETED{background:var(--mint-bg);color:var(--mint)}
.st-CANCELLED{background:var(--sunken);color:var(--faint)}
.st-REFUNDED{background:var(--coral-bg);color:var(--coral)}
.ohead{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;margin-bottom:22px}
.ohead h1{font-size:clamp(22px,3vw,30px);margin-top:4px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.timeline li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;font-size:14px}
.tl-dot{width:10px;height:10px;border-radius:50%;padding:0}
.reqbanner{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:var(--r);background:var(--warn-bg);font-size:14px}
.rb-h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 24px}

/* ---- документы ---- */
.docgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.pass,.voucher{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--card-border);overflow:hidden}
.pass-top,.v-top{background:#16275C;color:#fff;display:flex;align-items:center;gap:10px;padding:14px 18px}
.pass-top .n{flex:1;font-weight:600}
.pass-top .f{font-family:"IBM Plex Mono",monospace;font-size:13px;color:#9CC0FF}
.v-top{justify-content:space-between}
.v-kind{font-size:13px;font-weight:600;color:#9CC0FF}
.pass-body,.v-body{padding:18px;display:flex;flex-direction:column;gap:16px}
.pgrid,.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px}
.vgrid{grid-template-columns:repeat(2,1fr)}
.pgrid > div,.vgrid > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.pgrid b,.vgrid b{font-weight:600;font-size:14.5px}
.pgrid .wide,.vgrid .wide{grid-column:1 / -1}
.vgrid .stars svg{width:13px;height:13px}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin-inline:16px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--paper)}
.perf::before{left:-28px} .perf::after{right:-28px}
.pass-qr{display:flex;align-items:center;gap:16px;padding:16px 18px}
.qr{width:112px;height:112px;background:#fff;border-radius:12px;padding:9px;flex:none;display:grid;place-items:center;color:#16275C}
.qr svg{width:100%;height:100%;display:block}
.ref{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;letter-spacing:1.5px;color:var(--navy)}

/* ---- успех, вход, профиль ---- */
.success{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:48px 24px;max-width:620px;margin-inline:auto}
.checkmark{width:96px;height:96px;animation:pop .7s cubic-bezier(.34,1.56,.64,1) both}
.checkmark circle{fill:none;stroke:var(--blue);stroke-width:4;stroke-dasharray:283;stroke-dashoffset:283;animation:draw .7s ease-out forwards}
.checkmark path{fill:none;stroke:var(--blue);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;animation:draw .45s .55s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.refbox{display:flex;flex-direction:column;gap:2px;padding:12px 24px;border-radius:14px;background:var(--sky);margin-block:8px}
.refbox b{font-family:"IBM Plex Mono",monospace;font-size:21px;letter-spacing:1.5px;color:var(--navy)}
.authcard{max-width:440px;margin-inline:auto;padding:28px}
.otp{font-family:"IBM Plex Mono",monospace;font-size:30px;letter-spacing:14px;text-align:center}
.who{display:flex;align-items:center;gap:14px}
.who > div{flex:1;display:flex;flex-direction:column}
.avatar{width:52px;height:52px;border-radius:16px;background:linear-gradient(155deg,var(--hero-a),var(--hero-b));color:#fff;display:grid;place-items:center;flex:none}
.avatar svg{width:26px;height:26px}
.setrow{display:flex;flex-direction:column;gap:8px}
.setrow > span{font-weight:600}
.trow{display:flex;align-items:center;gap:12px;padding-block:8px}
.trow + .trow{border-top:1px solid var(--line)}
.trow b{flex:1}

/* ---- подвал ---- */
#footer{background:#16275C;color:rgba(255,255,255,.78);margin-top:40px}
.foot-in{display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:28px;padding-block:40px}
.foot-in b{color:#fff}
.footlink{color:rgba(255,255,255,.78);font-size:14px;text-align:left}
.footlink:hover{color:#fff}
.paychips{display:flex;flex-wrap:wrap;gap:6px}
.paychips span{font-size:12.5px;padding:4px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.22)}
.foot-note{grid-column:1 / -1;border-top:1px solid rgba(255,255,255,.14);padding-top:18px;color:rgba(255,255,255,.6)}

/* ---- тост и оверлей ---- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);border-radius:14px;
  padding:12px 18px;font-size:14.5px;font-weight:500;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);max-width:calc(100% - 32px);animation:rise .3s ease-out both}
.overlay{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 84%,transparent);backdrop-filter:blur(6px)}
.overlay .box{display:flex;flex-direction:column;align-items:center;gap:14px;font-weight:600}
.overlay .spin{width:42px;height:42px;border-width:3px}

/* ---- движение: брендбук, «появление карточки» ---- */
.rise{animation:rise .42s ease-out both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---- адаптив ---- */
@media (max-width:1080px){
  .sgrid-flights{grid-template-columns:1fr auto 1fr;}
  .sgrid-flights > :nth-child(4),.sgrid-flights > :nth-child(5){grid-column:span 1}
  .sgrid-flights > :nth-child(6){grid-column:span 1}
  .sgrid-hotels,.sgrid-tours,.sgrid-jet,.sgrid-heli{grid-template-columns:1fr 1fr}
  .sgo{grid-column:1 / -1;width:100%}
  .svcgrid{grid-template-columns:repeat(3,1fr)}
  .navlink span{display:none}
}
@media (max-width:900px){
  .reslayout,.twocol{grid-template-columns:1fr}
  .filters,.sticky{position:static}
  .fbox:not([open]) > summary{border-bottom:0}
  .offer{grid-template-columns:1fr;gap:14px}
  .of-buy{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;text-align:left}
  .of-buy .solid{width:auto;margin-top:0}
  .hotel{grid-template-columns:110px 1fr}
  .ho-buy{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;text-align:left}
  .ho-buy .solid{width:auto;margin-top:0}
  .destgrid{grid-template-columns:repeat(2,1fr)}
  .how,.trust{grid-template-columns:1fr}
  .foot-in{grid-template-columns:1fr}
  .nav-in{flex-wrap:wrap;gap:0 12px;padding-block:8px}
  .navmods{order:3;flex-basis:100%;padding-bottom:6px}
  .cal{grid-template-columns:repeat(7,minmax(128px,1fr))}
}
@media (max-width:600px){
  .container{padding-inline:16px}
  .hero{padding-block:30px 36px}
  .sgrid-flights{grid-template-columns:1fr auto 1fr}
  .sgrid-flights > :nth-child(n+4){grid-column:1 / -1}
  .sgrid-hotels,.sgrid-tours,.sgrid-jet,.sgrid-heli,.sgrid-2{grid-template-columns:1fr}
  .sform{padding:14px}
  .svcgrid,.destgrid{grid-template-columns:1fr}
  .methods{grid-template-columns:1fr}
  .hhero{grid-template-columns:1fr}
  .pgrid{grid-template-columns:repeat(2,1fr)}
  .vgrid{grid-template-columns:1fr}
  .ohead{grid-template-columns:auto 1fr}
  .ohead .pill{grid-column:1 / -1;justify-self:start}
  .ocard{grid-template-columns:auto 1fr}
  .oc-side{grid-column:1 / -1;flex-direction:row;justify-content:space-between;align-items:center}
  .droppanel{left:0;right:auto;min-width:0;width:min(340px,calc(100vw - 32px))}
  .cursw{display:none}
  .route .code{font-size:22px}
}

</style>
</head>
<body>
<header id="nav"></header>
<main id="app"></main>
<footer id="footer"></footer>
<div id="toast"></div>
<div id="overlay"></div>
<script>
/* ---- 00-data.js ---- */

function distanceKm(a, b){
  const [la1,lo1]=a, [la2,lo2]=b, r=Math.PI/180;
  const h=Math.sin((la2-la1)*r/2)**2 + Math.cos(la1*r)*Math.cos(la2*r)*Math.sin((lo2-lo1)*r/2)**2;
  return 2*6371*Math.asin(Math.sqrt(h));
}

"use strict";

const $  = (s, r=document) => r.querySelector(s);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---- детерминированный генератор (как в src/data/flights.ts) ---- */
function seedFrom(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function mulberry32(seed){ let a=seed; return () => { a|=0; a=(a+0x6d2b79f5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

const parseYMD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYMD(s); d.setDate(d.getDate()+n); return ymd(d); };

  if (S.lang === "ru") { const a=n%10, b=n%100; w = (a===1 && b!==11) ? f[0] : (a>=2 && a<=4 && (b<12 || b>14)) ? f[1] : f[2]; }
  else if (S.lang === "en") w = n === 1 ? f[0] : f[1];

function uzDate(d, o){
  const core = `${d.getDate()}-${(o.month === "long" ? UZ_M : UZ_MS)[d.getMonth()]}`;
  return `${o.weekday ? UZ_WD[d.getDay()] + ", " : ""}${o.year ? d.getFullYear() + "-yil " : ""}${core}`;
}
function fdate(s, o={ day:"numeric", month:"short" }){

  return S.lang === "uz" ? `${uzDate(d, {})}, ${hm}` : d.toLocaleString(LOC[S.lang], { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }); };

const NB = " ";                                    // брендбук: узкий неразрывный пробел

/* ---- маршрутизация: #/путь ---- */
function currentParts(){ return location.hash.replace(/^#\/?/, "").split("?")[0].split("/").filter(Boolean); }
function matchRoute(parts){
  for (const key of Object.keys(PAGES)) {
    const kp = key.split("/").filter(Boolean);
    if (kp.length !== parts.length) continue;
    const params = {}; let ok = true;
    kp.forEach((seg, i) => { if (seg.startsWith(":")) params[seg.slice(1)] = decodeURIComponent(parts[i]); else if (seg !== parts[i]) ok = false; });
    if (ok) return { key, params };
  }
  return { key: "", params: {} };
}
function go(path){ const h = "#/" + path; if (location.hash === h) render(true); else location.hash = h; }
function render(scrollTop = true){
  applyTheme();
  const { key, params } = matchRoute(currentParts());
  const page = PAGES[key] || PAGES[""];
  let html;
  try { html = page.render(params); }
  catch (e) { console.error(e); html = `<div class="container section"><div class="err">${esc(t("err_generic"))}</div></div>`; }
  if (html === null) return;                        // страница перенаправила
  $("#app").innerHTML = html;
  renderNav(key);
  // Новая страница открывается сверху сразу: плавная прокрутка html{scroll-behavior}
  // иначе протащила бы её через всю высоту предыдущей.
  if (scrollTop) window.scrollTo({ top: 0, behavior: "instant" });
  page.after?.(params);
}
const rerender = () => render(false);
window.addEventListener("hashchange", () => render(true));

function applyTheme(){
  const r = document.documentElement;
  if (S.theme === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme);

}

function onField(e){
  const el = e.target;
  if (el.dataset.bind) {
    let v = el.type === "checkbox" ? el.checked : el.value;
    if (el.dataset.num !== undefined) v = Number(v);
    setPath(M, el.dataset.bind, v);
    if (e.type === "change" && el.dataset.rr !== undefined) rerender();
  }
  if (el.dataset.tv !== undefined && M.checkout) {             // поля путешественника в оформлении
    const f = el.dataset.f; let v = el.value;
    if (["surname","given","passport"].includes(f)) { v = v.toUpperCase(); if (f === "passport") v = v.replace(/\s/g, ""); }
    M.checkout.travellers[Number(el.dataset.tv)][f] = v;
  }
  if (el.dataset.ct && M.checkout) M.checkout.contact[el.dataset.ct] = el.value;
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
/* <details> не всплывает событием toggle — ловим на погружении, чтобы
   выпадающие панели оставались открытыми после перерисовки. */
document.addEventListener("toggle", e => { const d = e.target; if (d.dataset?.keep) M.ui[d.dataset.keep] = d.open; }, true);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $$("details[open].drop").forEach(d => { d.open = false; if (d.dataset.keep) M.ui[d.dataset.keep] = false; });
});
document.addEventListener("click", e => {                   // клик вне выпадающей панели закрывает её
  // Если клик перерисовал страницу (степпер внутри панели), цель уже отсоединена
  // от документа — это был клик внутри, закрывать нельзя.
  if (!e.target.isConnected) return;
  $$("details[open].drop").forEach(d => { if (!d.contains(e.target)) { d.open = false; if (d.dataset.keep) M.ui[d.dataset.keep] = false; } });

/* ==========================================================================
   Модуль «Авиабилеты». Движок перенесён 1:1 из src/data/flights.ts:
   тот же маршрут и дата дают те же рейсы, что в мобильном приложении.
   ========================================================================== */
"use strict";

const PROVIDERS = ["aqua","kompas","easy","prestige"];
function addMinutes(hhmm, mins){ const [h,m] = hhmm.split(":").map(Number); const x = (h*60+m+mins+1440*3) % 1440; return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0"); }
function baseSeed(from, to){
  const key = `${from}-${to}`; if (ROUTES[key]) return ROUTES[key];
  const rnd = mulberry32(seedFrom(key));
  const eco = 180+Math.floor(rnd()*420), durationMin = 150+Math.floor(rnd()*420), depH = 5+Math.floor(rnd()*16);
  const c = CARRIERS[Math.floor(rnd()*CARRIERS.length)];
  const depTime = `${String(depH).padStart(2,"0")}:${["00","15","30","45"][Math.floor(rnd()*4)]}`;
  return { carrier:c.name, flightNo:`${c.code}-${100+Math.floor(rnd()*899)}`, plane:PLANES[Math.floor(rnd()*PLANES.length)],
    depTime, arrTime:addMinutes(depTime, durationMin), ecoPrice:eco, busPrice:eco+220+Math.floor(rnd()*260), durationMin };
}
function generateOffers({ from, to, date, cabin }){
  const seed = baseSeed(from, to), rnd = mulberry32(seedFrom(`${from}-${to}-${date}-${cabin}`));
  const count = 4+Math.floor(rnd()*4), offers = [];
  for (let i = 0; i < count; i++) {
    const isBase = i === 0;
    const carrier = isBase ? { name:seed.carrier, code:seed.flightNo.split("-")[0] } : CARRIERS[Math.floor(rnd()*CARRIERS.length)];
    const stops = isBase ? 0 : (rnd() < 0.55 ? 0 : 1);
    const extra = stops === 1 ? 120+Math.floor(rnd()*150) : 0;
    const durationMin = seed.durationMin+extra+Math.floor((rnd()-0.5)*40);
    const depTime = isBase ? seed.depTime : addMinutes(seed.depTime, Math.floor((rnd()-0.5)*600));
    const arrTime = addMinutes(depTime, durationMin);
    const rawBase = cabin === "business" ? seed.busPrice : seed.ecoPrice;
    const jitter = isBase ? 0 : Math.floor((rnd()-0.35)*(cabin === "business" ? 160 : 90));
    const stopDiscount = stops === 1 ? -Math.floor(rawBase*0.08) : 0;
    const priceUSD = Math.round(Math.max(90, rawBase+jitter+stopDiscount) * 1.1);   // +10% наценка, как на сервере
    const stopCities = ["DXB","IST","DME","SHJ","ALA"];
    offers.push({ id:`${from}${to}-${date}-${i}`, provider:PROVIDERS[Math.floor(rnd()*PROVIDERS.length)],
      carrier:carrier.name, carrierCode:carrier.code,
      flightNo:isBase ? seed.flightNo : `${carrier.code}-${100+Math.floor(rnd()*899)}`,
      aircraft:isBase ? seed.plane : PLANES[Math.floor(rnd()*PLANES.length)],
      from, to, date, depTime, arrTime, durationMin, stops,
      stopCity:stops === 1 ? stopCities[Math.floor(rnd()*stopCities.length)] : undefined,
      cabin, priceUSD, priceUZS:toUzs(priceUSD), baggageKg:cabin === "business" ? 30 : 20, seatsLeft:1+Math.floor(rnd()*9) });
  }
  return offers.sort((a, b) => a.priceUSD - b.priceUSD);
}
/* Код брони — src/app/review.tsx makeRef. */
function makeRef(seed){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  let out = ""; for (let i = 0; i < 6; i++) { out += chars[h % chars.length]; h = Math.floor(h/chars.length) + seed.charCodeAt(i % seed.length)*7; }
  return `CHR-${out}`;
}
/* Регулярный рейс маршрута из таблицы приложения, если он есть, иначе самый дешёвый. */
function baseOffer(from, to, date, cabin = "economy"){
  const list = generateOffers({ from, to, date, cabin }), r = ROUTES[`${from}-${to}`];
  return (r && list.find(o => o.flightNo === r.flightNo)) || list[0];
}
const seatFor = o => `${10 + (o.durationMin % 20)}${"ABCDEF"[o.priceUSD % 6]}`;
const gateFor = o => `${"AB"[o.priceUSD % 2]}${5 + (o.durationMin % 15)}`;

/* Цена — src/app/offer.tsx: (туда + обратно) × (взрослые + дети) + 10% × младенцы. */
function flightFare(out, back, q){
  const unit = { usd: out.priceUSD + (back ? back.priceUSD : 0), uzs: out.priceUZS + (back ? back.priceUZS : 0) };
  const inf  = { usd: Math.round(unit.usd * 0.1), uzs: Math.round(unit.uzs * 0.1) };
  const paying = q.adults + q.children;
  return { unit, inf, total: addA(mulA(unit, paying), mulA(inf, q.infants)) };
}

  const prices = days.map(d => generateOffers({ from:q.from, to:q.to, date:d, cabin:f.cabin })[0]);
  const lo = Math.min(...prices.map(p => p.priceUSD)), hi = Math.max(...prices.map(p => p.priceUSD));
  return `<div class="cal" role="group" aria-label="${esc(t("price_calendar"))}">${days.map((d, i) => {
    const p = prices[i], cls = d === q.date ? "on" : p.priceUSD === lo ? "lo" : p.priceUSD === hi && hi !== lo ? "hi" : "";

"use strict";

function hotelNightly(h, date){
  const month = parseYMD(date).getMonth() + 1;
  const season = HIGH_SEASON[h.city].includes(month) ? 1.18 : 1;
  return h.base * season * (0.94 + mulberry32(seedFrom(h.id + date))() * 0.12);
}
function hotelStay(h, checkin, nights, rooms, mult = 1){
  let sum = 0; for (let i = 0; i < nights; i++) sum += hotelNightly(h, addDays(checkin, i));
  return amt(sum * mult * rooms);
}

/* ---- 40-tours.js ---- */
/* ==========================================================================
   Модуль «Туры». Пакет = регулярный рейс туда и обратно из движка приложения
   + отель из каталога + трансфер + страховка, с пакетной скидкой 7%.
   Скидка — это то, ради чего покупают тур, а не всё по отдельности, поэтому
   экономия показывается в явном виде.
   ========================================================================== */
"use strict";

const TOUR_DISCOUNT = 0.93;
const TRANSFER_USD = 20;          // за человека, туда и обратно

function tourPackage(h, q){
  const out = baseOffer("TAS", q.to, q.depart), back = baseOffer(q.to, "TAS", addDays(q.depart, q.nights));
  const people = q.adults + q.children, rooms = Math.ceil(q.adults / 2);
  const flights = mulA({ usd: out.priceUSD + back.priceUSD, uzs: out.priceUZS + back.priceUZS }, people);
  const hotel = hotelStay(h, q.depart, q.nights, rooms);
  const transfer = mulA(amt(TRANSFER_USD), people);
  const separate = addA(flights, hotel, transfer);
  const total = pctA(separate, TOUR_DISCOUNT);
  const saving = { usd: separate.usd - total.usd, uzs: separate.uzs - total.uzs };
  const perPerson = { usd: Math.round(total.usd / people), uzs: Math.round(total.uzs / people / 1000) * 1000 };
  return { h, out, back, people, rooms, flights, hotel, transfer, separate, total, saving, perPerson };
}
/* Строки чека: их сумма ровно равна итогу — скидка идёт отрицательной строкой. */
function tourLines(p, q){
  return [
    [`${t("flight_rt")} × ${pl(p.people, "pax")}`, p.flights],
    [`${p.h.name} · ${pl(q.nights, "night")} × ${pl(p.rooms, "room")}`, p.hotel],
    [t("transfer"), p.transfer],
    [t("insurance"), null],
    [t("package_discount"), { usd: -p.saving.usd, uzs: -p.saving.uzs }]
  ];
}

/* ==========================================================================
   Модули «Частные самолёты» и «Вертолёты». Поиска с ценами нет — у чартерных
   бортов нет API, цену ставит менеджер. Это та же заявочная модель, что в
   B2B-панели и в спецификации: NEW → PENDING (цена) → PAID → CONFIRMED.
   Сайт показывает честную оценку диапазоном до отправки заявки.
   ========================================================================== */
"use strict";

const round = (x, step) => Math.round(x / step) * step;
const fitClass = (list, pax, id) => id === "auto" ? list.find(c => c.seats >= pax) : list.find(c => c.id === id && c.seats >= pax);

function jetEstimate(q){
  const cls = fitClass(JETS, q.pax, q.cls); if (!cls) return null;
  const km = distanceKm(COORDS[q.from], COORDS[q.to]);
  const hours = km / cls.speed + 0.4;                         // + руление, набор, снижение
  const base = hours * cls.rate * (q.trip === "roundtrip" ? 2 : 1);
  return { cls, km, hours, low: amt(round(base, 100)), high: amt(round(base * 1.3, 100)), final: amt(round(base * 1.12, 100)) };
}
function heliEstimate(q){
  const cls = fitClass(HELIS, q.pax, q.cls); if (!cls) return null;
  const d = HELI_DEST.find(x => x.id === q.to);
  const km = d.tour ? 0 : distanceKm(HELI_BASE, d.coord);
  const hours = d.tour ? 0.5 : km / cls.speed + 0.25;
  // В одну сторону вертолёт всё равно возвращается на базу — оплачивается частично.
  const legs = d.tour ? 1 : q.trip === "roundtrip" ? 2 : 1.6;
  const base = Math.max(hours * cls.rate * legs, cls.rate * 0.5);
  return { cls, km, hours, dest:d, low: amt(round(base, 50)), high: amt(round(base * 1.25, 50)), final: amt(round(base * 1.1, 50)) };
}
const heliName = id => HELI_DEST.find(x => x.id === id)?.name[S.lang] ?? id;
const hoursText = h => { const m = Math.round(h * 60); return m < 60 ? `${m} ${t("min")}` : dur(m); };

/* ==========================================================================
   Общее для всех модулей: оформление, оплата, заказы, документы.
   Заказ повторяет таблицу orders из спецификации: тип, статус, сумма, детали,
   история статусов (order_events). Строки чека не хранятся — они
   пересчитываются из деталей, поэтому переключение языка меняет и их.
   ========================================================================== */
"use strict";

const PAY_METHODS = [["payme","Payme","#33CCCC"],["click","Click","#0088FF"],["uzum","Uzum","#7C3AED"],["humo","Uzcard / Humo","#12996A"],["card","Visa / Mastercard","#2F6FE0"]];
const methodName = k => PAY_METHODS.find(m => m[0] === k)?.[1] ?? k;
const CITS = ["UZB","KAZ","KGZ","TJK","TKM","RUS","TUR"];
const blankTraveller = type => ({ type, surname:"", given:"", passport:"", gender:"", dob:"", expiry:"", cit:"UZB", save:false, fromId:null });

function checkLines(lines, total){
  return `<div class="rows">${lines.map(([l, a]) => `<div><span class="k">${esc(l)}</span><span class="v mono ${a && a.usd < 0 ? "neg" : ""}">${
      a == null ? esc(t("included")) : a.usd < 0 ? "−" + fmt({ usd:-a.usd, uzs:-a.uzs }) : fmt(a)}</span></div>`).join("")}
    <div class="tot"><span class="k">${esc(t("total"))}</span><span class="v">${fmt(total)}</span></div></div>`;
}

function startCheckout(spec){
  M.checkout = { ...spec, method:"payme", pstate: spec.recheck ? "checking" : "ok", pending:null,

  const f = (k, label, extra = "") => `<label class="field"><span>${esc(label)}</span><input data-tv="${i}" data-f="${k}" value="${esc(x[k])}" ${extra}></label>`;
  return `<div class="tform" id="tv${i}">
    <div class="tform-h"><b>${esc(mode === "lead" ? t("lead_guest") : `${t("passenger")} ${i+1}`)}</b><span class="muted small">${esc(t("pax_" + x.type))}</span></div>

function validateCheckout(){
  const c = M.checkout, last = c.end;
  const latin = s => /^[A-Z][A-Z' -]{0,40}$/.test(s);
  for (let i = 0; i < c.travellers.length; i++) {
    const x = c.travellers[i]; hideErr("#terr" + i);
    let e = null;
    if (!latin(x.surname) || !latin(x.given)) e = "err_name";
    else if (c.mode === "full") {
      if (!/^[A-Z0-9]{5,9}$/.test(x.passport)) e = "err_passport";
      else if (!x.gender) e = "err_gender";
      else if (!x.dob || x.dob >= TODAY) e = "err_dob";
      else if (!x.expiry || x.expiry <= last) e = "err_expiry";
    }
    if (e) { showErr("#terr" + i, t(e)); return false; }
  }
  hideErr("#cerr");
  if (!validPhone(c.contact.phone)) { showErr("#cerr", t("err_contact")); return false; }
  if (!validEmail(c.contact.email)) { showErr("#cerr", t("err_email")); return false; }
  return true;
}

function createOrder(spec, then){
  const now = Date.now();
  const o = { id:uid("o"), no:makeRef(`${spec.ref}:${now}:${Math.random()}`), type:spec.type, status:spec.status, createdAt:now,
    title:spec.title, sub:spec.sub, start:spec.start, end:spec.end, total:spec.total, method:spec.method || null,
    travellers:spec.travellers, contact:spec.contact, details:spec.details, req:null, paidAt:null,
    history: spec.status === "CONFIRMED" ? [{ s:"PAID", at:now }, { s:"CONFIRMED", at:now + 1000 }] : [{ s:"NEW", at:now }] };
  S.orders.unshift(o); save(); then?.(o.id);
  return o;
}
const hist = (o, s) => o.history.push({ s, at:Date.now() });
/* Заголовки заказа собираются из деталей при показе, а не хранятся строкой —
   иначе заказ, оформленный по-русски, остался бы русским в узбекском интерфейсе. */
function orderTitle(o){
  const d = o.details;
  if (o.type === "FLIGHT") return `${cityName(d.out.from)} → ${cityName(d.out.to)}${d.back ? " → " + cityName(d.back.to) : ""}`;
  if (o.type === "TOUR")   return `${hotelById(d.hotelId).name} · ${cityName(d.to)}`;
  if (o.type === "HOTEL")  return hotelById(d.hotelId).name;
  if (o.type === "JET")    return `${cityName(d.from)} → ${cityName(d.to)}`;
  return heliName(d.to);
}
function orderSub(o){
  const d = o.details;
  if (o.type === "FLIGHT") return `${fdateY(d.out.date)}${d.back ? " — " + fdateY(d.back.date) : ""} · ${pl(d.q.adults + d.q.children + d.q.infants, "pax")}`;
  if (o.type === "TOUR")   return `${fdateY(d.depart)} — ${fdateY(addDays(d.depart, d.nights))} · ${pl(d.nights, "night")} · ${pl(d.adults + d.children, "tourist")}`;
  if (o.type === "HOTEL")  return `${cityName(hotelById(d.hotelId).city)} · ${fdateY(d.checkin)} — ${fdateY(d.checkout)} · ${pl(d.nights, "night")}`;
  return `${fdateY(d.date)}, ${d.time} · ${pl(d.pax, "pax")} · ${d.model}`;
}
function effStatus(o){ return o.status === "CONFIRMED" && o.end < TODAY ? "COMPLETED" : o.status; }
const pill = s => `<span class="pill st-${s}">${esc(t("st_" + s))}</span>`;
function orderLines(o){
  const d = o.details;
  if (o.type === "FLIGHT") return flightLines(d.out, d.back, { ...d.q }).lines;
  if (o.type === "TOUR")  { const q = { to:d.to, depart:d.depart, nights:d.nights, adults:d.adults, children:d.children }; return tourLines(tourPackage(hotelById(d.hotelId), q), q); }
  if (o.type === "HOTEL") { const h = hotelById(d.hotelId), r = ROOM_TYPES.find(x => x.id === d.room);
    return [[`${t("room_" + r.id)} × ${pl(d.rooms, "room")} · ${pl(d.nights, "night")}`, o.total]]; }
  return [[`${d.model} · ${hoursText(d.hours)}`, o.total]];
}

/* Менеджер по чартерам — в демо отвечает за 5 секунд, подтверждает борт за 2,5.
   Таймер проверяет все заказы, поэтому переживает и переходы, и перезагрузку. */
function tickCharter(){
  const now = Date.now(); let changed = false;
  for (const o of S.orders) {
    if (o.type !== "JET" && o.type !== "HELI") continue;
    if (o.status === "NEW" && now - o.createdAt >= 5000) { o.status = "PENDING"; o.total = o.details.quote; hist(o, "PENDING"); changed = true; toast(tf("toast_priced", { no:o.no })); }
    if (o.status === "PAID" && o.paidAt && now - o.paidAt >= 2500) { o.status = "CONFIRMED"; hist(o, "CONFIRMED"); changed = true; toast(tf("toast_confirmed", { no:o.no })); }
  }
  if (changed) { save(); if (currentParts()[0] === "orders") rerender(); }
}

            ${o.contact.email ? `<div><span class="k">Email</span><span class="v">${esc(o.contact.email)}</span></div>` : ""}</div>
          <span class="lbl">${esc(t("history"))}</span>
          <ol class="timeline">${o.history.map(h => `<li><span class="tl-dot st-${h.s}"></span><b>${esc(t("st_" + h.s))}</b><span class="muted small">${esc(fdt(h.at))}</span></li>`).join("")}</ol>
        </aside></div></div>`;
  },
  after(){ renderQRs(); }
};
Object.assign(ACT, {
  ofilter:  el => { M.ui.ofilter = el.dataset.v; rerender(); },
  opm:      el => { M.ui.opm = el.dataset.v; rerender(); },
  opay:     el => {
    const o = S.orders.find(x => x.id === el.dataset.v); if (!o || o.status !== "PENDING") return;
    overlay(t("processing"));
    setTimeout(() => { overlay(""); Object.assign(o, { status:"PAID", paidAt:Date.now(), method:M.ui.opm || "payme" }); hist(o, "PAID"); save(); rerender(); }, 1400);
  },
  oreq:     el => { M.ui.reqFor = el.dataset.v || null; M.ui.reqKind = "change_date"; M.ui.reqNote = ""; rerender(); },
  oreqkind: el => { M.ui.reqKind = el.dataset.v; rerender(); },
  oreqsend: el => {
    const o = S.orders.find(x => x.id === el.dataset.v); if (!o) return;
    o.req = { kind:M.ui.reqKind || "change_date", note:(M.ui.reqNote || "").trim(), at:Date.now() };
    M.ui.reqFor = null; save(); rerender(); toast(t("req_status_new"));
  }
});

/* ---------------------------------------------------------------- успех */
PAGES["done/:id"] = {
  render({ id }){
    const o = S.orders.find(x => x.id === id); if (!o) { go("orders"); return null; }
    const to = o.contact.email || o.contact.phone;
    return `<div class="container section"><div class="card success">
      <svg class="checkmark" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45"/><path d="M30 52l13 13 27-29"/></svg>
      <h1>${esc(t("booking_confirmed"))}</h1><p class="muted">${esc(tf("doc_sent", { to }))}</p>
      <div class="refbox"><span class="lbl">${esc(t("booking_ref"))}</span><b>${o.no}</b></div>
      <div class="row center"><a class="cta" style="max-width:280px" href="#/orders/${o.id}">${esc(t(o.type === "FLIGHT" ? "view_ticket" : "view_voucher"))}</a>
        <a class="ghost" style="max-width:220px" href="#/">${esc(t("home"))}</a></div></div></div>`;
  }
};

/* ----------------------------------------------------------------- вход */
PAGES.login = {
  render(){
    const step = M.ui.loginStep || "phone";
    return `<div class="container section narrow"><div class="card stack authcard">
      <span class="wordmark dark">CHARTERI<b>.UZ</b></span>
      ${step === "phone" ? `<h1>${esc(t("login_title"))}</h1><p class="muted">${esc(t("login_sub"))}</p>
        <label class="field"><span>${esc(t("phone_label"))}</span><input id="lph" type="tel" inputmode="tel" autocomplete="tel" value="${esc(M.ui.loginPhone || "+998 90 123 45 67")}"></label>
        <div class="err" id="lerr" hidden></div>
        <button type="button" class="cta" data-act="lsend">${esc(t("login_cta"))}</button>`
      : `<h1>${esc(t("otp_title"))}</h1><p class="muted">${esc(t("otp_sub"))} <b class="mono">${esc(M.ui.loginPhone)}</b></p>
        <input id="lotp" class="otp" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="••••" aria-label="${esc(t("otp_title"))}">
        <p class="small muted center">${esc(t("otp_hint"))}</p><div class="err" id="lerr" hidden></div>
        <button type="button" class="cta" data-act="lverify">${esc(t("otp_cta"))}</button>
        <button type="button" class="link" data-act="lback">${esc(t("change_number"))}</button>`}
      <p class="demo-note">${esc(t("demo_banner"))}</p></div></div>`;
  },
  after(){ $("#lotp")?.focus(); }
};
function doVerify(){
  const v = ($("#lotp")?.value || "").trim();
  if (!/^\d{4}$/.test(v)) return showErr("#lerr", t("err_code"));
  S.user = { phone:M.ui.loginPhone }; save(); M.ui.loginStep = "phone";
  toast(t("signed_in")); go(M.returnTo || "orders"); M.returnTo = null;
}
Object.assign(ACT, {
  lsend:   () => { const v = $("#lph").value; if (!validPhone(v)) return showErr("#lerr", t("err_phone")); M.ui.loginPhone = prettyPhone(v); M.ui.loginStep = "code"; rerender(); },
  lverify: () => doVerify(),
  lback:   () => { M.ui.loginStep = "phone"; rerender(); }
});
document.addEventListener("input", e => { if (e.target.id === "lotp") { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4); if (e.target.value.length === 4) doVerify(); } });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "lph") ACT.lsend(); });

/* --------------------------------------------------------------- профиль */
PAGES.account = {
  render(){
    const who = S.user ? `<div class="card who"><span class="avatar">${IC.user}</span><div><b class="mono">${esc(S.user.phone)}</b>
        <span class="muted small">${esc(tf("orders_count", { n:S.orders.length }))}</span></div>
        <button type="button" class="link danger" data-act="signout">${esc(t("sign_out"))}</button></div>`
      : `<div class="card who"><span class="avatar">${IC.user}</span><div><b>${esc(t("profile_guest"))}</b><span class="muted small">${esc(t("guest_note"))}</span></div>
        <a class="solid" style="max-width:160px" href="#/login">${esc(t("sign_in"))}</a></div>`;
    return `<div class="container section narrow">${pageHead(t("tab_profile"))}<div class="stack">${who}
      <div class="card stack"><h3>${esc(t("settings"))}</h3>
        <div class="setrow"><span>${esc(t("language"))}</span>${seg("setlang", [["uz","O‘zbekcha"],["ru","Русский"],["en","English"]], S.lang)}</div>
        <div class="setrow"><span>${esc(t("currency"))}</span>${seg("setcur", [["UZS","UZS"],["USD","USD"]], S.cur)}</div>
        <div class="setrow"><span>${esc(t("appearance"))}</span>${seg("settheme", [["system", t("theme_system")],["light", t("theme_light")],["dark", t("theme_dark")]], S.theme)}</div></div>
      <div class="card stack"><h3>${esc(t("saved_travellers"))}</h3>
        ${S.travellers.length ? S.travellers.map(x => `<div class="trow"><b>${esc(x.given)} ${esc(x.surname)}</b>
          <span class="mono small muted">${esc(x.passport.slice(0,2))}•••${esc(x.passport.slice(-3))}</span>
          <button type="button" class="link danger" data-act="deltr" data-v="${x.id}">${esc(t("remove"))}</button></div>`).join("")
          : `<p class="muted">${esc(t("travellers_empty_body"))}</p>`}</div>
      <button type="button" class="ghost" data-act="reset">${esc(t("reset_demo"))}</button></div></div>`;
  }
};
Object.assign(ACT, {
  setlang:  el => { S.lang = el.dataset.v; save(); rerender(); },
  setcur:   el => { S.cur = el.dataset.v; save(); rerender(); },
  settheme: el => { S.theme = el.dataset.v; save(); rerender(); },
  signout:  () => { S.user = null; save(); toast(t("signed_out")); go(""); },
  deltr:    el => { if (!confirm(t("delete_traveller_title"))) return; S.travellers = S.travellers.filter(x => x.id !== el.dataset.v); save(); rerender(); },
  reset:    () => { if (!confirm(t("reset_confirm"))) return; S = freshState(); save(); go(""); }
});
document.addEventListener("change", e => { if (e.target.id === "langSel") { S.lang = e.target.value; save(); rerender(); } });

/* ---------------------------------------------------------------- навигация */
function renderNav(key){
  const active = key === "" ? M.module : key.startsWith("charter/") ? key.split("/")[1] : key.split("/")[0];
  const live = S.orders.filter(o => o.start >= TODAY && !["CANCELLED","REFUNDED"].includes(o.status)).length;
  $("#nav").innerHTML = `<div class="container nav-in">
    <a class="logo" href="#/" aria-label="Charteri"><span class="wordmark dark">CHARTERI<b>.UZ</b></span></a>
    <nav class="navmods" aria-label="${esc(t("all_services"))}">${MODULE_ORDER.map(k => `<button type="button" data-act="mod" data-v="${k}" aria-current="${active === k}">${esc(t(MODULES[k].label))}</button>`).join("")}</nav>
    <div class="navright">
      <select id="langSel" class="minisel" aria-label="${esc(t("language"))}">${[["uz","O‘z"],["ru","Рус"],["en","Eng"]].map(([k, l]) => `<option value="${k}" ${S.lang === k ? "selected" : ""}>${l}</option>`).join("")}</select>
      <div class="cursw">${seg("setcur", [["UZS","UZS"],["USD","USD"]], S.cur)}</div>
      <a class="navlink" href="#/orders" aria-current="${key.startsWith("orders")}">${IC.bag}<span>${esc(t("my_orders"))}</span>${live ? `<i class="badge">${live}</i>` : ""}</a>
      <a class="navlink" href="#/${S.user ? "account" : "login"}" aria-current="${key === "account" || key === "login"}">${IC.user}<span>${esc(S.user ? t("tab_profile") : t("sign_in"))}</span></a>
    </div></div>`;
  $("#footer").innerHTML = `<div class="container foot-in">
    <div class="stack" style="gap:8px"><span class="wordmark">CHARTERI<b>.UZ</b></span><p class="small">${esc(t("tagline"))}</p></div>
    <div class="stack" style="gap:6px"><b>${esc(t("all_services"))}</b>${MODULE_ORDER.map(k => `<button type="button" class="footlink" data-act="mod" data-v="${k}">${esc(t(MODULES[k].label))}</button>`).join("")}</div>
    <div class="stack" style="gap:6px"><b>${esc(t("we_accept"))}</b><div class="paychips">${PAY_METHODS.map(m => `<span>${m[1]}</span>`).join("")}</div></div>
    <p class="foot-note small">${esc(t("demo_footer"))}</p></div>`;
}

/* ---- 99-boot.js ---- */
/* ==========================================================================
   Запуск: начальное состояние с двумя демо-заказами и сохранённым путешественником.
   ========================================================================== */
"use strict";

const SEED_TRAVELLER = { id:"tr1", surname:"KARIMOV", given:"AZIZ", passport:"FA1234567", gender:"M", dob:"1988-04-12", expiry:"2031-06-30", cit:"UZB" };

function freshState(){
  const st = { v:1, lang:S?.lang || "ru", cur:S?.cur || "UZS", theme:S?.theme || "system", user:null, travellers:[{ ...SEED_TRAVELLER }], orders:[] };
  const traveller = ({ id, ...x }) => x;

  // Предстоящий перелёт в Стамбул — у демо сразу есть билет, который можно открыть.
  const d1 = addDays(TODAY, 9), out = baseOffer("TAS", "IST", d1), q1 = { adults:1, children:0, infants:0, cabin:"economy" };
  const t1 = Date.now() - 3 * 864e5;
  st.orders.push({ id:"o-seed-1", no:makeRef("seed-1" + d1), type:"FLIGHT", status:"CONFIRMED", createdAt:t1,
    title:`${cityName("TAS")} → ${cityName("IST")}`, sub:`${fdateY(d1)} · ${pl(1, "pax")}`, start:d1, end:d1,
    total:flightFare(out, null, q1).total, method:"payme", travellers:[traveller(SEED_TRAVELLER)],
    contact:{ phone:"+998 90 123 45 67", email:"" }, details:{ out, back:null, q:q1 }, req:null, paidAt:null,
    history:[{ s:"PAID", at:t1 }, { s:"CONFIRMED", at:t1 + 1000 }] });

  // Прошедший отдых в Анталии — показывает статус «Выполнен».
  const h = hotelById("ayt-lara"), ci = addDays(TODAY, -40), n = 7, t2 = Date.now() - 55 * 864e5;
  st.orders.push({ id:"o-seed-2", no:makeRef("seed-2" + ci), type:"HOTEL", status:"CONFIRMED", createdAt:t2,
    title:h.name, sub:`${cityName("AYT")} · ${fdateY(ci)} — ${fdateY(addDays(ci, n))} · ${pl(n, "night")}`, start:ci, end:addDays(ci, n),
    total:hotelStay(h, ci, n, 1, 1), method:"uzum", travellers:[traveller(SEED_TRAVELLER)],
    contact:{ phone:"+998 90 123 45 67", email:"" },
    details:{ hotelId:h.id, room:"standard", checkin:ci, checkout:addDays(ci, n), nights:n, adults:2, children:0, rooms:1 }, req:null, paidAt:null,
    history:[{ s:"PAID", at:t2 }, { s:"CONFIRMED", at:t2 + 1000 }] });
  return st;
}

S = loadState();
// freshState() форматирует даты и склонения через S.lang — сначала нужен язык.
if (!S) { S = { v:1, lang:"ru", cur:"UZS", theme:"system", user:null, travellers:[], orders:[] }; S = freshState(); save(); }
render(true);
tickCharter();
setInterval(tickCharter, 1000);

</script>
