.reqs .k{color:var(--muted);white-space:nowrap}
.reqs .v{text-align:right;font-weight:600}
.ltable{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:150px minmax(0,1fr) 150px 150px;gap:14px;align-items:center;padding:11px 6px;border-top:1px solid var(--line);font-size:14px}
.lhead{border-top:0;padding-block:2px 8px;font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint)}
.lhead span:nth-child(n+3){text-align:right}
.l-date{color:var(--muted);font-size:13px}
.l-op{display:flex;flex-direction:column;min-width:0}
.l-op a{color:var(--blue);font-weight:600}
.l-op .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l-amt,.l-after{text-align:right;white-space:nowrap}
.l-amt{font-weight:600}
.l-amt.plus{color:var(--mint-ink,#0B7A52)}
.l-after{color:var(--muted)}

/* ---- клиенты ---- */
.clist{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.1fr) minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 6px;border-top:1px solid var(--line);
  animation:rise .42s var(--ease-out) backwards;animation-delay:calc(min(var(--i,0),8) * 40ms)}
.clist > :first-child{border-top:0}
.crow-main{display:flex;gap:12px;align-items:center;min-width:0}
.crow-main b{color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow-main:hover b{color:var(--blue)}
.c-stat{display:flex;flex-direction:column}
.c-act{display:flex;gap:12px;align-items:center;justify-content:flex-end}
.cl-edit{margin-bottom:16px}
.clist .cl-edit{margin:8px 0;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--blue) 30%,transparent)}

/* ---- брендирование ---- */
.brandgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
.brandgrid h2{font-size:18px}
.brand-prev{display:flex;flex-direction:column;gap:10px}
.logo-row{display:flex;gap:16px;align-items:center}
.logo-prev{width:88px;height:88px;border-radius:22px;border:1px solid var(--line);font-size:26px}
.logo-prev img{padding:8px}
.filebtn{position:relative;overflow:hidden;cursor:pointer;align-self:flex-start}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0;padding:0}
.filebtn:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{position:relative;width:40px;height:40px;border-radius:12px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:box-shadow 200ms ease,transform 160ms var(--ease-out)}
.swatch:active{transform:scale(.94)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.swatch.custom{background:conic-gradient(from 0deg,#E14B4B,#E0A94B,#12996A,#2F6FE0,#7C3AED,#E14B4B);cursor:pointer}
.swatch.custom::after{content:"";position:absolute;inset:9px;border-radius:7px;background:var(--c);box-shadow:0 0 0 2px #fff}
.swatch.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0;padding:0;border:0}
.swatch.custom:focus-within{outline:2px solid var(--blue);outline-offset:2px}

/* ---- вход ---- */
body.is-auth{grid-template-columns:1fr}
body.is-auth #nav,body.is-auth #top,body.is-auth #footer{display:none}
.auth{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:100dvh}
.auth-side{position:relative;overflow:hidden;color:#fff;padding:36px clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;
  background:radial-gradient(120% 95% at 72% 28%,#22397E 0%,#172962 52%,#101C4B 100%)}
.auth-side::before{content:"";position:absolute;inset:auto -12% -30% 10%;height:70%;border-radius:50%;border:1.5px dashed rgba(169,198,255,.28);transform:rotate(-8deg);pointer-events:none}
.auth-copy{display:flex;flex-direction:column;gap:14px;max-width:30ch;position:relative}
.auth-copy h1{color:#fff;font-size:clamp(30px,3.6vw,46px);letter-spacing:-1px}
.auth-copy p{color:rgba(255,255,255,.8);font-size:16.5px;max-width:44ch}
.auth-mods{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;position:relative}
.auth-mods li{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 10px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-size:13.5px;font-weight:600}
.auth-mods svg{width:18px;height:18px;color:#A9C6FF}
.auth-main{display:grid;place-items:center;padding:32px 20px}
.auth-main .authcard{width:min(440px,100%)}
.auth-main h2{font-size:22px}
.auth-main .radar{align-self:center}

/* ---- колонка кабинета уже окна: раскладки сайта — по её ширине ---- */
@container main (max-width:1180px){
  .sgrid-flights{grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr)}
  .sgrid-flights > :nth-child(4){grid-column:1}
  .sgrid-flights > :nth-child(5){grid-column:3}
  .sgrid-flights > :nth-child(6){grid-column:1 / -1}
  .sgrid-flights .sgo{grid-column:1 / -1;width:100%}
  .dash-top{grid-template-columns:minmax(0,1fr) 300px}
}
/* Формы туров, отелей и чартеров — в две колонки раньше, чем на сайте:
   в строку им нужно около 1080 px колонки, иначе дата обрезается. */
@container main (max-width:1080px){
  .sgrid-hotels,.sgrid-tours,.sgrid-jet,.sgrid-heli{grid-template-columns:1fr 1fr}
  .sgo{grid-column:1 / -1;width:100%}
}
@container main (max-width:1020px){
  .dash-top,.dash-grid,.bal-top,.brandgrid{grid-template-columns:minmax(0,1fr)}
  .orow{grid-template-columns:40px minmax(0,2fr) minmax(0,1.2fr) minmax(0,1fr) 124px}
  .or-date{display:none}
  .ohead-row span:nth-child(4){display:none}
  .lrow{grid-template-columns:130px minmax(0,1fr) 130px 130px}
}
@container main (max-width:860px){
  .reslayout,.twocol{grid-template-columns:1fr}
  .filters,.sticky{position:static}
  .offer{grid-template-columns:1fr;gap:14px}
  .of-buy{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;text-align:left}
  .of-buy .solid{width:auto;margin-top:0}
  .hotel{grid-template-columns:180px 1fr}
  .ho-buy{grid-column:1 / -1;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;text-align:left}
  .ho-buy .solid{width:auto;margin-top:0}
  .sgrid-3{grid-template-columns:1fr 1fr}
  .crow{grid-template-columns:minmax(0,1fr) auto}
  .c-phone,.c-stat{display:none}
}
@container main (max-width:720px){
  .tripmap{grid-template-columns:1fr;min-height:0}
  .tm-frame{order:-1;min-height:210px}
  .tm-list{background:linear-gradient(180deg,rgba(12,22,60,.2) 0%,#111E50 18%);padding-top:14px}
  .tm-scrim{background:linear-gradient(180deg,rgba(12,22,60,0) 0%,rgba(12,22,60,0) 150px,rgba(12,22,60,.95) 230px)}
  .tm-attr{top:188px;bottom:auto}
  .orow{grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"ic main st" "ic client sum";row-gap:2px}
  .or-ic{grid-area:ic;align-self:start}.or-main{grid-area:main}.or-st{grid-area:st}.or-client{grid-area:client;font-size:13px;color:var(--muted)}.or-sum{grid-area:sum}
  .ohead-row{display:none}
  .orow + .orow,.otable.has-head .orow:nth-child(2){box-shadow:0 -1px 0 var(--line)}
  .otable.has-head .orow:nth-child(2){box-shadow:none}
  .lrow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
  .l-op{grid-column:1;grid-row:1}.l-date{grid-column:1;grid-row:2;font-size:12px}
  .l-amt{grid-column:2;grid-row:1}.l-after{grid-column:2;grid-row:2;font-size:12px}
  .lhead{display:none}
  .otools{flex-direction:column;align-items:stretch}
  .ofind{flex-wrap:nowrap}.ofind .search{flex:1;min-width:0}
}
@container main (max-width:560px){
  .sgrid-flights{grid-template-columns:minmax(0,1fr) 44px}
  .sgrid-flights > :nth-child(1){grid-column:1;grid-row:1}
  .sgrid-flights > :nth-child(2){grid-column:2;grid-row:1 / span 2;align-self:center}
  .sgrid-flights > :nth-child(3){grid-column:1;grid-row:2}
  .sgrid-flights > :nth-child(n+4){grid-column:1 / -1}
  .sgrid-hotels,.sgrid-tours,.sgrid-jet,.sgrid-heli,.sgrid-2,.sgrid-3{grid-template-columns:1fr}
  .methods,.balhero .bal-stats{grid-template-columns:1fr}
  .quick{width:100%}
  .qbtn{flex:1 1 calc(50% - 4px);justify-content:flex-start}
  .c-act .ghost{display:none}
  .logo-row{align-items:flex-start}
}

/* ---- телефон и планшет: меню выезжает слева ---- */
@media (max-width:1024px){
  body.b2b{grid-template-columns:1fr}
  body.b2b #nav{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);height:100dvh;transform:translateX(-102%);transition:transform 320ms var(--ease-drawer);z-index:50;
    box-shadow:24px 0 60px -30px rgba(3,8,26,.7)}
  body.nav-open #nav{transform:none}
  .scrim{display:block;position:fixed;inset:0;z-index:45;background:rgba(8,14,40,.5);opacity:0;pointer-events:none;transition:opacity 240ms ease}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  .iconbtn.only-m{display:grid}
  .top-in{gap:6px}
}
@media (max-width:600px){
  :root{--pagepad:16px}
  .page{padding-top:20px}
  .balchip-l{display:none}
  .balchip{padding-inline:8px}
  .balchip b{font-size:14px}
  .topup-btn{width:38px;padding:0}
  .topup-btn span{display:none}
  #langSel{display:none}
  .top-title{font-size:15px}
  .auth{grid-template-columns:1fr}
  .auth-side{padding:26px 20px 30px;gap:22px}
  .auth-side::before{display:none}
  .auth-mods{display:none}
}
@media (prefers-reduced-motion:reduce){ body.b2b #nav{transition:none} }

/* ---- печать документа: только сам документ ---- */
@media print{
  body.b2b{display:block;background:#fff}
  #nav,#top,#footer,.scrim,#toast,#overlay,.backlink,.ohead,.twocol > aside,.doc-actions,.cancelbox{display:none!important}
  .page{padding:0;max-width:none}
  .twocol{display:block}
  .pass,.voucher,.bdoc > *{box-shadow:none;break-inside:avoid}
  .bd-top,.pass-top,.v-top{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ==========================================================================
   Админка поверх каркаса кабинета (b2b/panel.css), в фирменном дизайне
   Charteri: то же синее меню, шрифты и цвета, что у сайта и кабинета. От
   кабинета её отличают подпись «Админка Charteri» и сотрудник внизу меню.
   Таблицы — одна сетка .atable, колонки задаются переменной --cols.
   ========================================================================== */
:root{--chart:#2F6FE0;--chart-hi:#255FC9;--mint-ink:#0B7A52}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--chart:#5E8EEB;--chart-hi:#7AA2EF;--mint-ink:var(--mint)}}
:root[data-theme="dark"]{--chart:#5E8EEB;--chart-hi:#7AA2EF;--mint-ink:var(--mint)}
body.adm .card h2{font-size:18px;letter-spacing:-.2px}
.arow.ahead > *{font-size:11px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---- меню и верхняя панель ---- */
.side-me{margin-top:auto;display:flex;align-items:center;gap:11px;padding:12px;border-radius:16px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.side-me b{color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-role{font-size:12px;color:#A9C6FF}
.live-pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--mint-ink);padding:5px 10px;border-radius:999px;background:var(--mint-bg);white-space:nowrap}
.live-pill i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent)}
.taskchip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:12px;font-weight:600;font-size:14px;color:var(--muted);
  background:var(--sunken);white-space:nowrap;transition:background-color 200ms ease,color 200ms ease}
.taskchip svg{width:18px;height:18px}
.taskchip.has{background:var(--warn-bg);color:var(--warn)}
.taskchip:hover{color:var(--ink)}
.whosel .minisel{max-width:230px}

/* ---- обзор ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--card-border);
  transition:transform 160ms var(--ease-out)}
a.kpi:hover{box-shadow:var(--lift-shadow)}
a.kpi:active{transform:scale(.985)}
.kpi-l{font-size:13px;color:var(--muted);font-weight:500}
.kpi-v{font-size:clamp(20px,2vw,24px);color:var(--navy);font-weight:600;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-s{font-size:12.5px;color:var(--faint)}

/* График: столбцы одного цвета, скруглён только верх; сетка — волосяные линии. */
.fchart{position:relative}
.fchart svg{display:block;width:100%;height:auto;overflow:visible}
.fc-grid{stroke:var(--line);stroke-width:1}
.fc-y,.fc-x{fill:var(--muted);font:500 11px "IBM Plex Sans",system-ui,sans-serif}
.fc-bar path{fill:var(--chart);transition:fill 160ms ease}
.fc-bar .fc-hit{fill:transparent}
.fc-bar:hover path,.fc-bar:focus path{fill:var(--chart-hi)}
.fc-bar:focus{outline:none}
.fc-bar:focus-visible .fc-hit{stroke:var(--blue);stroke-width:2}
.fc-tip{position:absolute;transform:translate(-50%,-100%);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 11px;border-radius:10px;
  background:var(--ink);color:var(--paper);font-size:12px;white-space:nowrap;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.fc-tip b{font-size:14px;font-family:"IBM Plex Mono",monospace}

/* ---- очередь задач ---- */
.note-live{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--warn);background:var(--warn-bg);padding:10px 12px;border-radius:12px;margin-bottom:14px}
.note-live svg{width:18px;height:18px;flex:none}
.tasks{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;gap:12px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.tasks > .task:first-child{border-top:0}
.task-ic{width:40px;height:40px;border-radius:12px;background:var(--sky);color:var(--blue);display:grid;place-items:center}

/* Кнопка без права: заметно выключена и подписана словами, не только подсказкой. */
button:disabled{cursor:not-allowed}

.matrix-wrap{max-width:100%;min-width:0}

/* ---- таблицы ---- */
.atable{display:flex;flex-direction:column}
.arow{display:grid;grid-template-columns:var(--cols);gap:14px;align-items:center;padding:11px 10px;border-radius:14px;transition:background-color 160ms ease}
.arow + .arow{box-shadow:0 -1px 0 var(--line)}
a.arow:hover{background:var(--sunken);box-shadow:none}
a.arow:hover + .arow{box-shadow:none}
.arow.ahead{padding-block:4px 8px;font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint)}
.arow.total{font-size:15px;color:var(--navy)}
.arow.past{opacity:.7}
.a-main{display:flex;flex-direction:column;min-width:0}
.a-main b{color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-main .mono{font-size:12px;color:var(--faint)}
.a-with-mark{flex-direction:row;align-items:center;gap:12px}
.a-cell{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-num{text-align:right;white-space:nowrap;font-size:14px}
.a-num.plus{color:var(--mint-ink)}
.a-end{text-align:right;justify-self:end}
.warn-t{color:var(--warn)}
.src-site{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sky);color:var(--navy)}
.bmark-wrap{display:inline-grid;flex:none}
.bmark-wrap .bmark{box-shadow:inset 0 0 0 1px var(--line)}
.bmark-wrap.big .bmark{width:52px;height:52px;border-radius:16px;font-size:18px}
.blockbar.inline{border-radius:14px;margin-bottom:18px;border:0}
.rev-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* ---- направления ---- */
.dir-pc{width:44px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font:600 12px "IBM Plex Mono",monospace;letter-spacing:.5px;flex:none}
.dir-hotel{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 90px minmax(0,1.3fr) 110px auto;align-items:end}
.dir-est{align-self:center}
.dir-hotels > .ghost{align-self:flex-start}
.dir-hotel-set{border:0;margin:0;padding:10px 0 0;min-width:0;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:8px}
.dir-hotel-more{align-items:end;gap:14px}
.dir-hotel-more .field{min-width:200px}
.arow select.minisel{max-width:100%}
@container main (max-width:560px){ .dir-hotel-more .field{min-width:0;flex:1 1 100%} }
.a-cell.wrap{white-space:normal}
@container main (max-width:860px){ .dir-hotel{grid-template-columns:1fr 1fr} }

/* ---- цены ---- */
.pr-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pct-in{position:relative;display:block}
.pct-in input{width:120px;padding-right:32px;font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600}
.pct-in i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--faint);font-weight:600}

/* ---- права ролей ---- */
.matrix-wrap{overflow-x:auto;position:relative}
.matrix{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
.matrix th,.matrix td{padding:9px 10px;border-top:1px solid var(--line);text-align:center}
.matrix thead th{border-top:0;font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint)}
.matrix tbody th{text-align:left;font-weight:500}
.matrix .yes{display:inline-grid;color:var(--mint)}
.matrix .yes svg{width:18px;height:18px}
.matrix .no{color:var(--faint)}

/* ---- роли: список слева, таблица прав справа ---- */
.roles-grid{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:20px;align-items:start}
.role-list{display:flex;flex-direction:column;gap:4px;padding:8px;min-width:0;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--card-border)}
.role-item{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:10px 12px;border-radius:12px;background:transparent;border:0;
  color:var(--ink);font:inherit;cursor:pointer;transition:background-color 160ms ease}
.role-item b{color:var(--navy);font-weight:600;font-size:14.5px}
.role-item:hover{background:var(--sunken)}
.role-item[aria-current="true"]{background:var(--sky);box-shadow:inset 3px 0 0 var(--blue)}
.role-item .pill{flex:none}
.matrix.pm{min-width:760px}
.matrix.pm thead th{letter-spacing:.5px;font-size:10.5px;padding-inline:6px}
/* На узком экране таблица листается вбок — название раздела остаётся слева. */
.matrix.pm tbody th[scope="row"]{position:sticky;left:0;z-index:1;background:var(--surface)}
.matrix.pm th[scope="col"]:first-child{text-align:left}
.pm-cell{position:relative;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;cursor:pointer}
.pm-cell:hover{background:var(--sunken)}
.pm-cell input{width:18px;height:18px;margin:0;accent-color:var(--blue);cursor:pointer}
.pm-cell input:disabled{cursor:not-allowed}
.pm-legend summary{cursor:pointer;font-weight:600;color:var(--blue);font-size:14px}
.pm-legend dl{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 16px;margin:12px 0 0;font-size:13.5px}
.pm-legend dt{font-weight:600;color:var(--navy)}
.pm-legend dd{margin:0;color:var(--muted)}

/* ---- подтверждения ---- */
.ap-diff{list-style:none;margin:4px 0 2px;padding:0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.ap-diff s{color:var(--faint);text-decoration-thickness:1px}
.ap-diff b{color:var(--navy);font-weight:600}
.rules{display:flex;flex-direction:column}
.rule-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.rules > .rule-row:first-child{border-top:0}
.rule-min{display:flex;align-items:center;gap:8px}
.rule-amt input{width:150px;min-height:36px;padding:6px 10px;font-family:"IBM Plex Mono",monospace;font-size:14px;text-align:right}

/* ---- сотрудники и журнал ---- */
.st-acts{gap:4px 12px;flex-wrap:wrap;justify-content:flex-end}
.st-table .a-end{justify-self:stretch}
.au-find{flex-wrap:wrap}
.au-find .minisel{max-width:220px}
.au-table .a-key{display:flex;flex-direction:column;gap:2px}

/* ---- CRM ----
   Этапы воронки: холодные — нейтральные, в работе — синие, итог — зелёный
   или приглушённый красный. Цвет всегда вместе с подписью этапа. */
.ls-new{background:var(--sunken);color:var(--muted)}
.ls-contacted,.ls-progress,.ls-interested{background:var(--sky);color:var(--navy)}
.ls-confirmed,.ls-completed{background:var(--mint-bg);color:var(--mint-ink)}
.ls-lost{background:var(--warn-bg);color:var(--warn)}
.seg-new{background:var(--sunken);color:var(--muted)}
.seg-active{background:var(--sky);color:var(--navy)}
.seg-vip{background:var(--navy);color:#fff}
.seg-inactive{background:var(--sunken);color:var(--faint)}
.seg-blocked{background:var(--warn-bg);color:var(--warn)}
.avatar.xs{width:24px;height:24px;border-radius:8px;font-size:10px;flex:none}
.who-chip{display:inline-flex;align-items:center;gap:8px;min-width:0}
.lboard{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity;position:relative}
.lboard:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:12px}
.bcol{display:flex;flex-direction:column;gap:10px;min-width:0;padding:12px;border-radius:18px;background:var(--sunken);scroll-snap-align:start}
.bcol-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bcol-h h3{font-size:14px;margin:0;color:var(--navy)}
.bcol-h .count{margin-left:0}
.bcol-h .mono{margin-left:auto}
.bcards{display:flex;flex-direction:column;gap:8px}
.lcard{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--card-border)}
.lcard-main{display:flex;flex-direction:column;gap:2px;min-width:0;color:inherit}
.lcard-main b{color:var(--navy)}
.lcard-main:hover b{color:var(--blue)}
.lcard-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lcard-foot .avatar{margin-left:auto}
.lcard-foot svg{width:16px;height:16px;vertical-align:-3px}
.lcard > .link{align-self:flex-start}
.lstepper{display:flex;flex-wrap:wrap;gap:6px}
.lstep{border:0;font:inherit;font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--sunken);color:var(--muted);cursor:pointer;transition:background-color 160ms ease,color 160ms ease}
.lstep.past{background:var(--sky);color:var(--navy)}
.lstep[aria-pressed="true"]{box-shadow:inset 0 0 0 2px currentColor}
.lstep[aria-pressed="true"].ls-new{background:var(--sunken);color:var(--ink)}
.lstep[aria-pressed="true"].ls-contacted,.lstep[aria-pressed="true"].ls-progress,.lstep[aria-pressed="true"].ls-interested{background:var(--sky);color:var(--navy)}
.lstep[aria-pressed="true"].ls-confirmed,.lstep[aria-pressed="true"].ls-completed{background:var(--mint-bg);color:var(--mint-ink)}
.lstep[aria-pressed="true"].ls-lost{background:var(--warn-bg);color:var(--warn)}
.lstep:disabled{cursor:default}
.note-form{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:start}

.feed-dot.nk-call{background:var(--blue)}

.crm-tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.crm-tasks > .crm-task:first-child{border-top:0}
.crm-task-meta{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding-left:28px}

.task-form{border-top:1px dashed var(--line);padding-top:12px}

/* ---- вход ---- */

/* ---- узкая колонка ---- */
@container main (max-width:1020px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}

}
/* Таблице прав нужна вся ширина: список ролей уходит наверх лентой. */
@container main (max-width:1260px){
  .roles-grid{grid-template-columns:minmax(0,1fr)}
  .role-list{flex-direction:row;overflow-x:auto;scroll-snap-type:x proximity;min-width:0}

}
@container main (max-width:760px){
  .task,.task-wide{grid-template-columns:40px minmax(0,1fr)}
  .task-amt{grid-column:2}
  .task-act{grid-column:1 / -1;justify-content:flex-start}
  /* Строка таблицы — в две колонки: слева главное (a-main/a-key) и строка
     под ним (a-sub), справа ключевая сумма (a-keep) и статус. */
  .arow{grid-template-columns:minmax(0,1fr) auto!important;grid-auto-flow:row dense;row-gap:2px}
  .arow > *{grid-column:1}
  .arow > .a-keep,.arow > .a-end{grid-column:2;text-align:right;justify-self:end}
  .arow > .or-ic,.arow > .a-cell:not(.a-key):not(.a-sub),.arow > .a-num:not(.a-keep){display:none}

  .arow.ahead{display:none}
  .note-form{grid-template-columns:1fr}

  .st-table .arow > .a-end{grid-column:1 / -1;justify-self:start;justify-content:flex-start;text-align:left;margin-top:6px}
}
@container main (max-width:720px){
  .ofind{flex-wrap:wrap}
  .ofind .search{flex:1 1 100%}
}
@container main (max-width:560px){
  .kpis{grid-template-columns:1fr;gap:10px}
  .kpi{flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:12px;padding:12px 16px}

  .au-find .minisel{max-width:none;flex:1 1 45%}
  .pm-legend dl{grid-template-columns:1fr}
  .rule-amt input{width:100%}
}
@media (max-width:600px){
  .live-pill{display:none}
  body.adm .top-title{display:none}
  .whosel .minisel{max-width:150px}
  .taskchip .tc-l{display:none}
}

function distanceKm(a, b){
  const [la1,lo1]=a, [la2,lo2]=b, r=Math.PI/180;
  const h=Math.sin((la2-la1)*r/2)**2 + Math.cos(la1*r)*Math.cos(la2*r)*Math.sin((lo2-lo1)*r/2)**2;
  return 2*6371*Math.asin(Math.sqrt(h));
}

/* ==========================================================================
   Фотографии направлений, отелей и воздушных судов.
   Снимки — Unsplash (бесплатная лицензия) и Wikimedia Commons (с подписью
   автора и лицензии прямо на фото). Грузятся по ссылке нужной ширины.
   Под каждым снимком — фирменный градиент направления: пока фото грузится
   или если оно не загрузилось, карточка не пустая.
   Данные — PH в 04-photos.js.
   ========================================================================== */
"use strict";

/* Wikimedia отдаёт превью только стандартных ширин. */
const WIKI_STEPS = [330, 500, 960, 1280, 1920];
const wikiStep = w => WIKI_STEPS.find(s => s >= w) || WIKI_STEPS[WIKI_STEPS.length - 1];
/* ar — соотношение сторон кадра: Unsplash сам кадрирует, и полоса-баннер не
   тянет полный снимок 3:2. */
function phUrl(p, w, ar){
  if (p.src === "unsplash") return `${p.u}?auto=format&fit=crop&w=${w}${ar ? `&h=${Math.round(w / ar)}&crop=focalpoint&fp-x=.5&fp-y=${p.fy}` : ""}&q=${w > 1000 ? 58 : 66}`;
  return p.u.replace(/\/\d+px-/, `/${wikiStep(w)}px-`);
}
/* Кандидаты srcset с настоящими ширинами файлов. */
function phSet(p, w, ar){
  const ws = p.src === "unsplash" ? [Math.round(w / 2), w, Math.round(w * 1.6)] : [...new Set([w / 2, w, w * 1.6].map(wikiStep))];
  return [...new Set(ws)].map(x => `${phUrl(p, x, ar)} ${x}w`).join(", ");
}
/* Уже загруженные снимки при перерисовке показываются сразу, без проявления. */
const PH_SEEN = new Set();
function phLoaded(img){ PH_SEEN.add(img.dataset.k); img.classList.add("in"); }
/* Не загрузилось — убираем снимок с подписью; рамка, которая была только
   ради фото, сворачивается (класс ph-failed), остальные остаются с градиентом. */
function phFailed(img){ const box = img.parentElement; box?.querySelector(".ph-credit")?.remove(); box?.classList.add("ph-failed"); img.remove(); }
/* deco — снимок внутри кнопки или ссылки: подпись у них уже есть, описание
   фото только мешало бы экранному диктору. */
function photo(key, { w = 640, sizes = "100vw", cls = "", eager = false, deco = false, ar = 0 } = {}){
  const p = PH[key]; if (!p) return "";
  const credit = p.src === "unsplash" ? "" : `<span class="ph-credit" ${deco ? 'aria-hidden="true"' : ""}>${esc(p.by)} · ${esc(p.lic)}</span>`;
  const alt = deco ? "" : S.lang === "ru" ? p.ru : p.en, lang = !deco && S.lang === "uz" ? ' lang="en"' : "";
  return `<img class="ph ${PH_SEEN.has(key) ? "in" : ""} ${cls}" data-k="${key}" src="${phUrl(p, w, ar)}" srcset="${phSet(p, w, ar)}" sizes="${sizes}"
    alt="${esc(alt)}"${lang} loading="${eager ? "eager" : "lazy"}" decoding="async" style="object-position:50% ${Math.round(p.fy * 100)}%"
    onload="phLoaded(this)" onerror="phFailed(this)">${credit}`;
}
const hasPhoto = key => !!PH[key];

/* ==========================================================================
   Ядро сайта: состояние, язык, деньги, даты, маршрутизация, общие элементы.
   ========================================================================== */
"use strict";

/* ---- DOM и мелочи ---- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const uid = p => p + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36);

/* ---- детерминированный генератор (как в src/data/flights.ts) ---- */
function seedFrom(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function mulberry32(seed){ let a=seed; return () => { a|=0; a=(a+0x6d2b79f5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }

/* ---- даты: только локальный календарь. toISOString() в Ташкенте (UTC+5)
        сдвинул бы полночь на предыдущий день. ---- */
const ymd = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseYMD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYMD(s); d.setDate(d.getDate()+n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYMD(b) - parseYMD(a)) / 864e5);
const TODAY = ymd(new Date());

/* ---- сохраняемое состояние ---- */
/* APP подставляет build.py: "b2c" — сайт для пассажиров, "b2b" — кабинет агентства,
   "admin" — админка Charteri. Демо живут на одном домене и видят данные друг
   друга: админка работает с данными кабинета (S) и читает данные сайта. */
const CAB_KEY = "charteri.panel.demo.v2", SITE_KEY = "charteri.site.demo.v1";
const LS_KEY = APP === "b2c" ? SITE_KEY : CAB_KEY;
/* Где форма поиска: на сайте — главная, в кабинете — страница «Бронирование». */
const SEARCH_PATH = APP === "b2c" ? "" : "book";
let S;
/* rev растёт с каждой записью: другая вкладка видит, что данные новые. */
function save(){ try { S.rev = (S.rev || 0) + 1; localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {} }
function loadState(){
  try { const r = JSON.parse(localStorage.getItem(LS_KEY)); if (r && r.v === 1) return r; } catch(e) {}
  return null;
}
/* Перед любым изменением денег — свежие данные из хранилища: другая вкладка
   (кабинет ↔ админка) могла записать их только что, а событие storage ещё в пути. */
function refresh(){ const f = loadState(); if (f) S = f; return S; }
/* Другая вкладка записала данные — берём их и перерисовываем. Сброс демо
   (ключ удалён) — перезагружаемся, чтобы не записать старые данные обратно. */
window.addEventListener("storage", e => {
  if (e.key !== LS_KEY) return;
  if (e.newValue === null) { location.reload(); return; }
  let next; try { next = JSON.parse(e.newValue); } catch(err) { return; }
  if (!next || next.v !== 1) return;
  S = next; onExternalChange();
});
/* Если человек печатает — перерисовываем только меню, чтобы не сбить ввод;
   иначе перерисовываем страницу и возвращаем фокус на тот же элемент. */
function onExternalChange(){
  const f = document.activeElement;
  if (f && f.matches?.("input, textarea, select") && $("#app")?.contains(f)) { renderNav(matchRoute(currentParts()).key); return; }
  const key = focusKey(f); rerender(); refocus(key);
}
/* Как найти «тот же» элемент после перерисовки: по id, действию или ссылке. */
function focusKey(el){
  if (!el || el === document.body || !el.isConnected) return null;
  if (el.id) return "#" + CSS.escape(el.id);
  if (el.dataset?.act) return ["act", "v", "k", "src", "ag", "s"].filter(k => el.dataset[k] != null)
    .map(k => `[data-${k}="${CSS.escape(el.dataset[k])}"]`).join("");
  if (el.matches?.("a[href]")) return `a[href="${CSS.escape(el.getAttribute("href"))}"]`;
  return null;
}
function refocus(key){ if (key) $(key)?.focus({ preventScroll:true }); }

/* ---- общие настройки Charteri из админки ----
   Сбор и наценку меняет админка; сайт и кабинет берут их отсюда.
   Пока админка открыта, она раз в несколько секунд отмечается в OPS_HB —
   тогда демо не отвечает за оператора само (цена чартера, пополнения, возвраты). */
const PRICES_KEY = "charteri.ops.prices", OPS_HB = "charteri.ops.hb", APPS_KEY = "charteri.ops.apps";
/* Номера, для которых Charteri закрыл бронирование: список ведёт админка. */
const BLOCK_KEY = "charteri.ops.blocked";
const phoneBlocked = p => { const d = String(p ?? "").replace(/\D/g, ""), l = readJSON(BLOCK_KEY, []); return !!d && Array.isArray(l) && l.includes(d); };
const readJSON = (k, fallback) => { try { return JSON.parse(localStorage.getItem(k)) ?? fallback; } catch(e) { return fallback; } };
const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const PRICE_DEFAULTS = { feeBps:300, flightMarkupBps:1000 };
const OPS_LIVE_MS = 90000;               // фоновую вкладку браузер будит редко — окно с запасом
let PRICES = null;
function prices(){
  if (PRICES) return PRICES;
  let saved = {}; try { saved = JSON.parse(localStorage.getItem(PRICES_KEY) || "{}") || {}; } catch(e) {}
  const ok = v => Number.isInteger(v) && v >= 0 && v <= 5000;
  PRICES = { feeBps: ok(saved.feeBps) ? saved.feeBps : PRICE_DEFAULTS.feeBps, flightMarkupBps: ok(saved.flightMarkupBps) ? saved.flightMarkupBps : PRICE_DEFAULTS.flightMarkupBps };
  return PRICES;
}

    const params = {}; let ok = true;
    kp.forEach((seg, i) => { if (seg.startsWith(":")) params[seg.slice(1)] = safeDecode(parts[i]); else if (seg !== parts[i]) ok = false; });
    if (ok) return { key, params };

  const { key, params } = guard != null ? { key:guard, params:{} } : m;

  try { html = page.render(params); }
  catch (e) { console.error(e); html = `<div class="container section"><div class="err">${esc(t("err_generic"))}</div></div>`; }

/* ---- 12-directions.js ---- */
/* ==========================================================================
   Направления, добавленные в админке. Каталог сайта (AIRPORTS, COORDS,
   ROUTES, RESORTS, HOTELS) собран при сборке; админка дописывает к нему свои
   направления в DIRS_KEY, а сайт, кабинет и админка вливают их при загрузке и
   при изменении в другой вкладке. Встроенные направления не трогаются.

   Направление: { iata, city:{ru,uz,en}, country:{ru,uz,en}, lat, lon, eco,
     popular, resort, hotels:[…], color:[a,b], hidden }
   eco — тариф эконом из Ташкента в одну сторону, USD, до наценки.
   ========================================================================== */
"use strict";

const DIRS_KEY = "charteri.ops.dirs";
const CRUISE_KMH = 780, TAXI_MIN = 35;           // оценка времени полёта по расстоянию
let DIRS_APPLIED = [];                           // коды, которые уже влиты: их можно убрать перед новым вливанием

function loadDirections(){ const d = readJSON(DIRS_KEY, []); return Array.isArray(d) ? d.filter(validDirection) : []; }
/* Данные из хранилища — чужие: берём только то, что прошло проверку формы. */
function validDirection(d){
  return d && /^[A-Z]{3}$/.test(d.iata) && ["ru", "uz", "en"].every(l => typeof d.city?.[l] === "string" && d.city[l].trim() && typeof d.country?.[l] === "string")
    && Number.isFinite(d.lat) && Math.abs(d.lat) <= 90 && Number.isFinite(d.lon) && Math.abs(d.lon) <= 180 && Number.isFinite(d.eco) && d.eco >= 50 && d.eco <= 5000;
}
/* Маршрут в обе стороны: время — по расстоянию, вылет утром, обратно — днём. */
function routesFor(d){
  const km = distanceKm(COORDS.TAS, [d.lat, d.lon]), dur = Math.round((km / CRUISE_KMH) * 60 + TAXI_MIN);
  const n = 100 + (seedFrom(d.iata) % 800), plane = km > 3500 ? "Boeing 787-8" : "Airbus A321neo";
  const mk = (from, to, dep, no, eco) => ({ carrier:"Uzbekistan Airways", flightNo:`HY-${no}`, plane, depTime:dep, arrTime:addMinutes(dep, dur), ecoPrice:eco, busPrice:Math.round(eco * 1.85), durationMin:dur });
  return { [`TAS-${d.iata}`]:mk("TAS", d.iata, "09:30", n * 2 + 1, Math.round(d.eco)), [`${d.iata}-TAS`]:mk(d.iata, "TAS", "15:10", n * 2 + 2, Math.round(d.eco * 0.93)) };
}
/* Отель направления — в формате каталога; незаполненное — по умолчанию. */
const BEACH_M = { beach:0, near:400, city:null };
const dirHotel = (d, h, i) => ({ id:`${d.iata.toLowerCase()}-${i + 1}`, city:d.iata, name:h.name, stars:clamp(Math.round(h.stars) || 4, 3, 5), area:h.area || "",
  board:BOARDS.includes(h.board) ? h.board : "BB", base:clamp(Math.round(h.base) || 120, 20, 5000), rating:null,
  beach:h.beach in BEACH_M ? BEACH_M[h.beach] : null, am:[...(h.beach === "beach" ? ["beach"] : []), ...(h.pool ? ["pool"] : []), "wifi"], custom:true });

function unapplyDirections(){
  const codes = new Set(DIRS_APPLIED); if (!codes.size) return;
  const drop = (arr, test) => { for (let i = arr.length - 1; i >= 0; i--) if (test(arr[i])) arr.splice(i, 1); };
  drop(AIRPORTS, a => a.custom && codes.has(a.iata)); drop(RESORTS, c => codes.has(c)); drop(HOTELS, h => h.custom && codes.has(h.city));
  drop(WORLD_BG, c => codes.has(c)); drop(BOARD_DEST, c => codes.has(c));
  for (const c of codes) { delete COORDS[c]; delete PALETTE[c]; delete ROUTES[`TAS-${c}`]; delete ROUTES[`${c}-TAS`]; }
  DIRS_APPLIED = [];
}
/* Скрытое направление пропадает из поиска и витрин, но его город и отели
   остаются в каталоге: по ним уже могут быть заказы. Вызывается при запуске
   каждого приложения — после того как объявлены все списки. */
function applyDirections(){
  unapplyDirections();
  for (const d of loadDirections()) {
    if (AIRPORTS.some(a => a.iata === d.iata)) continue;                  // встроенный код не перекрываем
    AIRPORTS.push({ iata:d.iata, city:{ ...d.city }, country:{ ...d.country }, popular:d.popular ? 90 : 40, custom:true, hidden:!!d.hidden });
    COORDS[d.iata] = [d.lat, d.lon];
    Object.assign(ROUTES, routesFor(d));
    PALETTE[d.iata] = Array.isArray(d.color) && d.color.every(c => /^#[0-9a-f]{6}$/i.test(c)) ? d.color : ["#2F6FE0", "#16275C"];
    const hotels = (d.hotels || []).filter(h => h && typeof h.name === "string" && h.name.trim());
    hotels.forEach((h, i) => HOTELS.push(dirHotel(d, h, i)));
    if (!d.hidden && d.resort && hotels.length) RESORTS.push(d.iata);
    if (!d.hidden && d.popular) { WORLD_BG.push(d.iata); BOARD_DEST.push(d.iata); }
    DIRS_APPLIED.push(d.iata);
  }
}
/* ---- доступно ли направление сейчас ---- */
const destShown = c => AIRPORTS.some(a => a.iata === c && !a.hidden);
const hotelShown = id => { const h = HOTELS.find(x => x.id === id); return !!h && RESORTS.includes(h.city); };
/* Детали брони: все её города видны, отель есть в каталоге. Вертолёт летает
   по своим площадкам (HELI_DEST), не по аэропортам. */
function detailsShown(d){
  if (!d) return true;
  if (d.hotelId && !hotelShown(d.hotelId)) return false;
  if (d.kind === "heli") return true;
  return [d.from, d.to, d.out?.from, d.out?.to, d.back?.from, d.back?.to].filter(Boolean).every(destShown);
}
/* Карта: код без координат (направление удалили) — рисуем маршрут по умолчанию. */
const safeRoute = st => st.local || (COORDS[st.from] && COORDS[st.to]) ? st : { local:false, from:"TAS", to:"IST" };

/* Выбор в формах поиска, который указывает на скрытое или удалённое
   направление, возвращается к направлению по умолчанию. Возвращает, было ли что менять. */
function sanitizeSelections(){
  let changed = false;
  const fix = (q, k, ok, def) => { if (q && q[k] && !ok(q[k])) { q[k] = def; q.searched = false; changed = true; } };
  fix(M.flights, "from", destShown, "TAS"); fix(M.flights, "to", destShown, M.flights?.from === "IST" ? "DXB" : "IST");
  fix(M.tours, "to", c => RESORTS.includes(c), "AYT"); fix(M.hotels, "city", c => RESORTS.includes(c), "AYT");
  fix(M.jet, "from", destShown, "TAS"); fix(M.jet, "to", destShown, M.jet?.from === "DXB" ? "IST" : "DXB");
  const sel = M.flights?.sel;
  if (sel?.out && !detailsShown({ out:sel.out, back:sel.back })) { M.flights.sel = { out:null, back:null }; M.flights.searched = false; changed = true; }
  if (M.checkout && !detailsShown(M.checkout.details)) { M.checkout = null; changed = true; }
  return changed;
}
/* Админка изменила направления в другой вкладке. Если человек смотрит выдачу,
   оформление или заявку по направлению, которого больше нет, — возвращаем к
   поиску с объяснением, даже если он печатает: иначе он отправил бы заявку
   не туда, куда выбирал. */
const DIR_PAGES = ["flights", "hotels", "tours", "charter", "checkout"];
window.addEventListener("storage", e => {
  if (e.key !== DIRS_KEY) return;
  applyDirections();
  if (typeof GL !== "undefined") GL.key = null;                     // карта заново расставит точки
  const changed = sanitizeSelections();
  if (!S) return;
  if (changed && DIR_PAGES.includes(currentParts()[0])) { toast(t("dir_gone")); go(SEARCH_PATH); return; }
  onExternalChange();
});

/* ---- 15-motion.js ---- */
/* ==========================================================================
   Движение. Язык задан брендбуком Charteri:
     появление карточек   — подъём на 14 px, каскад 55 мс, 420 мс, ease-out
     детали рейса         — самолёт по дуге к вершине, 900 мс, cubic
     смена темы           — затухание всей страницы, 260 мс
     сортировка           — карточки переезжают на новые места, 260 мс
     оплата               — синяя галочка на пружине
     пустые поездки       — самолёт по кругу, 4,2 с
   Анимируются только transform и opacity. При «уменьшить движение» всё
   показывается сразу в конечном состоянии.
   ========================================================================== */
"use strict";

const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const EASE_OUT = "cubic-bezier(0.23, 1, 0.32, 1)";
const EASE_IN_OUT = "cubic-bezier(0.77, 0, 0.175, 1)";
const canVT = () => !REDUCED && typeof document.startViewTransition === "function";

/* ---- переход между страницами (View Transitions) ---- */
function withTransition(update, kind = "nav"){
  if (!canVT()) return update();
  const root = document.documentElement;
  root.dataset.vt = kind;
  const vt = document.startViewTransition(update);
  // Страница сама перенаправила (например, оформление без выбранного рейса) —
  // новый переход отменяет этот; отмена — не ошибка.
  vt.ready.catch(() => {});
  vt.finished.finally(() => { delete root.dataset.vt; });
}

/* ---- FLIP: карточки переезжают, а не прыгают (сортировка, фильтры) ----
   Сначала все чтения, потом все записи: чередование вызвало бы
   пересчёт раскладки на каждой карточке. */
function flip(update){
  if (REDUCED) return update();
  const first = new Map($$("[data-flip]").map(el => [el.dataset.flip, el.getBoundingClientRect()]));
  update();
  const last = $$("[data-flip]").map(el => [el, el.getBoundingClientRect()]);
  for (const [el, r] of last) {
    const f = first.get(el.dataset.flip);
    if (!f) { el.animate([{ opacity:0, transform:"translateY(8px)" }, { opacity:1, transform:"none" }], { duration:260, easing:EASE_OUT }); continue; }
    const dx = f.left - r.left, dy = f.top - r.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
    el.animate([{ transform:`translate(${dx}px, ${dy}px)` }, { transform:"none" }], { duration:260, easing:EASE_IN_OUT });
  }
}
/* Каскад появления — только когда список пришёл впервые (новый поиск,
   переход на страницу). При сортировке и фильтрах работает FLIP, а не каскад. */
function listEnter(key){ const fresh = M.ui.listKey !== key; M.ui.listKey = key; return fresh ? "rise" : ""; }

/* ---- скользящий индикатор вкладок и сегментов ---- */
const IND = new Map();
function slideIndicators(animate = true){
  const route = currentParts().join("/") || "home", counts = {};
  const reads = $$("[data-ind]").map(g => {
    const k = (g.closest("#nav") ? "nav:" : route + ":") + g.dataset.ind;
    counts[k] = (counts[k] || 0) + 1;
    const on = g.querySelector('[aria-selected="true"],[aria-pressed="true"],[aria-current="page"]');
    return { key: k + ":" + counts[k], ind: g.querySelector(":scope > .ind"), line: "indLine" in g.dataset,
      r: on && on.offsetWidth ? { x:on.offsetLeft, y:on.offsetTop, w:on.offsetWidth, h:on.offsetHeight } : null };
  });
  for (const { key, ind, line, r } of reads) {
    if (!ind) continue;
    if (!r) { ind.style.opacity = "0"; continue; }
    const to = `translate(${r.x}px, ${line ? 0 : r.y}px)`;
    Object.assign(ind.style, { opacity:"1", width:r.w + "px", height: line ? "" : r.h + "px", transform:to });
    const prev = IND.get(key); IND.set(key, r);
    if (animate && prev && !REDUCED && (prev.x !== r.x || prev.y !== r.y || prev.w !== r.w))
      ind.animate([{ transform:`translate(${prev.x}px, ${line ? 0 : prev.y}px) scaleX(${prev.w / r.w})` }, { transform:to }],
        { duration:240, easing:EASE_OUT });
  }
}

/* ---- счётчик суммы: только при изменении, не при первом показе ----
   Первый показ — сразу конечная цифра: сумму нельзя заставлять ждать. */
const COUNTS = new Map();
const fmtVal = v => S.cur === "USD" ? "$" + grp(v) : grp(v) + NB + t("cur_uzs");
function countUps(){
  for (const el of $$("[data-count]")) {
    const key = el.dataset.count, target = Number(S.cur === "USD" ? el.dataset.usd : el.dataset.uzs), prev = COUNTS.get(key);
    COUNTS.set(key, { cur:S.cur, v:target });
    if (REDUCED || !prev || prev.cur !== S.cur || prev.v === target) continue;
    const from = prev.v, t0 = performance.now(), D = 420;
    const tick = now => {
      if (!el.isConnected) return;                          // страницу перерисовали — останавливаемся
      const p = Math.min(1, (now - t0) / D), e = 1 - (1 - p) ** 3;
      el.textContent = fmtVal(Math.round(from + (target - from) * e));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
}
const countAttr = (key, a) => `data-count="${key}" data-usd="${a.usd}" data-uzs="${a.uzs}"`;

/* ---- степпер: цифра проезжает вверх или вниз ---- */
function rollStepper(){
  const s = M.ui.stepAnim; M.ui.stepAnim = null;
  if (!s || REDUCED) return;
  const btn = $(`[data-act="step"][data-bind="${s.bind}"]`), num = btn?.parentElement.querySelector("span");
  num?.animate([{ transform:`translateY(${s.d > 0 ? 9 : -9}px)`, opacity:0 }, { transform:"none", opacity:1 }], { duration:200, easing:EASE_OUT });
}

/* ---- ошибка: короткое покачивание, чтобы взгляд нашёл сообщение ---- */
function shake(el){ if (REDUCED || !el) return; el.animate(
  [{ transform:"none" }, { transform:"translateX(-6px)" }, { transform:"translateX(5px)" }, { transform:"translateX(-3px)" }, { transform:"translateX(2px)" }, { transform:"none" }],
  { duration:360, easing:"ease-out" }); }

/* ---- самолёты на дугах: SMIL animateMotion, запуск после отрисовки ---- */
function launchFlights(){
  if (REDUCED) return;
  $$("animateMotion[data-go]").forEach(a => setTimeout(() => a.beginElement?.(), Number(a.dataset.go)));
}

/* ---- высота плавающей шапки: герой заходит под неё ---- */
new ResizeObserver(([e]) => document.documentElement.style.setProperty("--navh", Math.round(e.borderBoxSize?.[0]?.blockSize ?? e.target.offsetHeight) + "px"))
  .observe(document.getElementById("nav"));

/* ---- 16-routemap.js ---- */
/* ==========================================================================
   Маршрут из формы поиска на карте в шапке главной. Основная карта —
   настоящая (18-glmap.js). Здесь — общее состояние маршрута и запасная
   SVG-схема на случай, если WebGL или картографический сервис недоступны.
   Самолёт — фирменный силуэт, нос по направлению полёта (брендбук).
   ========================================================================== */
"use strict";

const MAP_W = 600, MAP_H = 340;
const WORLD = { lat0:4, lat1:58, lon0:24, lon1:114 };
const LOCAL = { lat0:39.25, lat1:42.15, lon0:66.3, lon1:70.9 };
const WORLD_BG = ["IST","AYT","DXB","SSH","JED","SHJ","CXR","HKT","DME"];

function mapState(){
  if (M.module === "heli") return { local:true, from:"TAS", to:M.heli.to };
  const r = { flights:[M.flights.from, M.flights.to], tours:["TAS", M.tours.to], hotels:["TAS", M.hotels.city], jet:[M.jet.from, M.jet.to] }[M.module];
  return safeRoute({ local:false, from:r[0], to:r[1] });
}
function mapAria(){
  const st = mapState();
  if (!st.local) return tf("map_aria", { a:cityName(st.from), b:cityName(st.to) });
  return HELI_DEST.find(d => d.id === st.to)?.tour ? heliName(st.to) : tf("map_aria", { a:t("heli_base").split(",")[0], b:heliName(st.to) });
}
/* Рамка карты растягивается, чтобы вместить любой выбранный аэропорт. */
function mapBounds(points, base){
  const b = { ...base };
  for (const [la, lo] of points) {
    b.lat0 = Math.min(b.lat0, la - 3); b.lat1 = Math.max(b.lat1, la + 3);
    b.lon0 = Math.min(b.lon0, lo - 5); b.lon1 = Math.max(b.lon1, lo + 5);
  }
  return b;
}
const project = (b, [la, lo]) => [(lo - b.lon0) / (b.lon1 - b.lon0) * MAP_W, (b.lat1 - la) / (b.lat1 - b.lat0) * MAP_H];
/* Дуга выгибается к северу — так выглядят маршруты по большому кругу. */
function arc([x1, y1], [x2, y2]){
  const d = Math.hypot(x2 - x1, y2 - y1) || 1;
  let nx = -(y2 - y1) / d, ny = (x2 - x1) / d;
  if (ny > 0) { nx = -nx; ny = -ny; }
  const k = Math.min(95, d * 0.3), cx = (x1 + x2) / 2 + nx * k, cy = (y1 + y2) / 2 + ny * k;
  return { d:`M${x1.toFixed(1)} ${y1.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`,
    end:[x2, y2], angle: Math.atan2(y2 - cy, x2 - cx) * 180 / Math.PI };
}
/* Обзорный полёт — петля над городом с возвращением на площадку. */
function loop([x, y]){
  return { d:`M${x} ${y} C${x + 70} ${y - 90} ${x + 190} ${y - 40} ${x + 120} ${y + 24} S${x + 10} ${y + 40} ${x} ${y}`,
    end:[x, y], angle:-150 };
}
function mapLabel([x, y], text, cls){
  const right = x > MAP_W - 130;
  return `<text class="${cls}" x="${(x + (right ? -12 : 12)).toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="${right ? "end" : "start"}">${esc(text)}</text>`;
}

/* Запасная схема: без подложки, только дуги и точки. */
function routeSvg(){
  const st = mapState(), key = `${M.module}:${st.from}-${st.to}`;
  const animate = !REDUCED && M.ui.mapKey !== key, first = !REDUCED && M.ui.mapKey == null;
  M.ui.mapKey = key;

  let b, pts, route, labels;
  if (st.local) {
    const dests = HELI_DEST.filter(d => d.coord);
    b = LOCAL; const home = project(b, HELI_BASE);
    const sel = HELI_DEST.find(d => d.id === st.to);
    pts = dests.map(d => ({ id:d.id, p:project(b, d.coord), name:d.name[S.lang] }));
    route = sel.tour ? loop(home) : arc(home, project(b, sel.coord));
    labels = mapLabel(home, t("heli_base").split(",")[0], "m-lbl m-lbl-home")
      + pts.filter(x => x.id === st.to).map(x => mapLabel(x.p, x.name, "m-lbl")).join("");
    pts = [{ id:"home", p:home }, ...pts];
  } else {
    const from = COORDS[st.from], to = COORDS[st.to];
    b = mapBounds([from, to], WORLD);
    const bg = [...new Set([...WORLD_BG, st.from, st.to])];
    pts = bg.map(c => ({ id:c, p:project(b, COORDS[c]) }));
    route = arc(project(b, from), project(b, to));
    labels = mapLabel(project(b, from), cityName(st.from), "m-lbl m-lbl-home") + mapLabel(route.end, cityName(st.to), "m-lbl");
  }
  const hub = st.local ? project(b, HELI_BASE) : project(b, COORDS["TAS"]);
  const bgArcs = pts.filter(x => x.id !== "home" && x.id !== "TAS").map((x, i) =>
    `<path class="m-bg" style="--i:${i}" d="${arc(hub, x.p).d}"/>`).join("");
  const dots = pts.map(x => { const sel = x.id === st.to || x.id === st.from || x.id === "home";
    return `<circle class="m-dot ${sel ? "m-dot-on" : ""}" cx="${x.p[0].toFixed(1)}" cy="${x.p[1].toFixed(1)}" r="${sel ? 4.5 : 3}"/>`; }).join("");
  const [ex, ey] = route.end;
  return `<svg class="rmap ${animate ? "anim" : ""} ${first ? "first" : ""}" viewBox="0 0 ${MAP_W} ${MAP_H}" aria-hidden="true">
    <defs>
      <pattern id="mdots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff"/></pattern>
      <radialGradient id="mfade" cx="55%" cy="45%" r="62%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <mask id="mmask"><rect width="${MAP_W}" height="${MAP_H}" fill="url(#mfade)"/></mask>
    </defs>
    <rect width="${MAP_W}" height="${MAP_H}" fill="url(#mdots)" opacity=".15" mask="url(#mmask)"/>
    <g>${bgArcs}</g>
    <path class="m-glow" d="${route.d}" pathLength="1"/>
    <path id="mroute" class="m-route" d="${route.d}" pathLength="1"/>
    ${dots}
    <circle class="m-ping" cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="6"/>
    ${labels}
    <g class="m-plane" ${animate ? 'opacity="0"' : `transform="translate(${ex.toFixed(1)} ${ey.toFixed(1)}) rotate(${route.angle.toFixed(1)})"`}>
      <g transform="rotate(90) scale(.95) translate(-12 -12)"><path d="${PLANE_PATH}"/></g>
      ${animate ? `<animateMotion id="mfly" data-go="330" dur="0.9s" begin="indefinite" fill="freeze" rotate="auto" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.65 0 0.35 1"><mpath href="#mroute"/></animateMotion>
        <set attributeName="opacity" to="1" begin="mfly.begin" fill="freeze"/>` : ""}
    </g>
  </svg>`;
}

/* Дуга в деталях рейса: самолёт летит к вершине и остаётся там (брендбук).
   Время SMIL у встроенного SVG идёт от загрузки документа, поэтому видимость
   привязана к началу полёта (id.begin), а не к абсолютной задержке. */
let arcSeq = 0;
function arcTrack(animate, delay = 0){

        <set attributeName="opacity" to="1" begin="${id}.begin" fill="freeze"/>` : ""}

/* ---- 17-board.js ---- */
/* ==========================================================================
   Табло вылетов на главной — как в аэропорту Ташкента (брендбук: «Board»,
   IBM Plex Mono). Табло живое: часы идут по ташкентскому времени, статус
   каждого рейса считается от текущей минуты — по расписанию, регистрация,
   посадка, выход закрыт, вылетел. Раз в минуту перещёлкиваются только те
   ячейки, где поменялся текст. Рейсы — базовые рейсы маршрутов из движка
   приложения, выход на посадку — тот же, что в посадочном талоне.
   ========================================================================== */
"use strict";

const BOARD_DEST = ["IST","DXB","AYT","JED","SSH","CXR","HKT","DME"];
const FLAP_POOL = {
  lat:"ABCDEFGHIJKLMNOPQRSTUVWXYZ", cyr:"АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ", dig:"0123456789"
};
/* Статус по минутам до вылета; вылетевший рейс висит на табло ещё полчаса. */
const FIDS = [["departed", 0], ["closed", 20], ["boarding", 50], ["checkin", 180], ["sched", Infinity]];
const DEPARTED_KEEP = 30;
const fidsStatus = m => FIDS.find(([, max]) => m <= max)[0];
const poolFor = ch => /\d/.test(ch) ? FLAP_POOL.dig : /[А-ЯЁ]/.test(ch) ? FLAP_POOL.cyr : FLAP_POOL.lat;
const flaps = (s, row, col0) => [...s].map((ch, i) =>
  `<span class="fl${ch === " " ? " fl-sp" : ""}" data-r="${row}" data-c="${col0 + i}">${ch === " " ? "&nbsp;" : esc(ch)}</span>`).join("");
const hhmm = min => `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;

/* Ташкентское время: рейсы вылетают отсюда, где бы ни был посетитель. */
function tashNow(){
  const p = new Intl.DateTimeFormat("en-GB", { timeZone:"Asia/Tashkent", year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", hourCycle:"h23" }).formatToParts(new Date());
  const g = type => p.find(x => x.type === type).value;
  return { date:`${g("year")}-${g("month")}-${g("day")}`, min:Number(g("hour")) * 60 + Number(g("minute")) };
}
function boardRows(now){
  return BOARD_DEST.map(c => {
    const today = baseOffer("TAS", c, now.date), [h, mm] = today.depTime.split(":").map(Number);
    let m = h * 60 + mm - now.min, day = 0;
    if (m < -DEPARTED_KEEP) { m += 1440; day = 1; }
    const date = addDays(now.date, day), o = day ? baseOffer("TAS", c, date) : today;
    return { c, o, m, day, date, st:fidsStatus(m), code:o.flightNo.split("-")[0] };
  }).sort((a, b) => a.m - b.m);
}

/* Строка — кнопка. Экранному диктору — одна фраза целиком, а не буквы табло. */
const rowLabel = r => [r.o.depTime, `${r.o.flightNo} ${r.o.carrier}`, cityName(r.c), `${t("gate")} ${gateFor(r.o)}`, t("fs_" + r.st),
  priceFrom(fmt({ usd:r.o.priceUSD, uzs:r.o.priceUZS })), t("board_sub")].join(", ");
function boardRow(r, i, w){
  const name = cityName(r.c).toLocaleUpperCase(LOC[S.lang]);
  return `<button type="button" class="brd-row st-${r.st}" data-act="boardgo" data-v="${r.c}" data-d="${r.date}" data-st="${r.st}" aria-label="${esc(rowLabel(r))}">
    <span class="brd-cell brd-t" aria-hidden="true">${flaps(r.o.depTime, i, 0)}</span>
    <span class="brd-fl" aria-hidden="true">${carrierBadge(r.code, "cb-sm")}<span class="brd-cell brd-fn">${flaps(r.o.flightNo.padEnd(7, " "), i, 6)}</span></span>
    <span class="brd-cell brd-to" aria-hidden="true">${flaps(name.padEnd(w, " "), i, 14)}</span>
    <span class="brd-cell brd-gt" aria-hidden="true">${flaps(gateFor(r.o).padEnd(3, " "), i, 14 + w)}</span>
    <span class="brd-st" aria-hidden="true"><i></i><span>${esc(t("fs_" + r.st))}</span></span>
    <span class="brd-pr" aria-hidden="true"><span>${priceFrom(fmt({ usd:r.o.priceUSD, uzs:r.o.priceUZS }))}</span>${IC.chev}</span>
  </button>`;
}
const BOARD = { sig:"", timer:0 };
function boardHTML(){
  const now = tashNow(), rows = boardRows(now);
  const w = Math.max(...rows.map(r => cityName(r.c).length));
  BOARD.sig = rows.map(r => r.c + r.day).join();
  return `<div class="board" id="board" style="--w:${w}">
    <div class="brd-top">
      <span class="brd-kind"><span class="brd-kind-ic">${IC.flights}</span>${esc(t("board_dep"))}</span>
      <span class="brd-port">TAS · ${esc(cityName("TAS"))}</span>
      <span class="brd-clock" role="timer" aria-label="${esc(t("board_now"))}: ${hhmm(now.min)}"><span aria-hidden="true">${flaps(hhmm(now.min), "k", 0)}</span></span>
    </div>
    <div>
      <div class="brd-h" aria-hidden="true"><span>${esc(t("board_time"))}</span><span class="brd-fl">${esc(t("board_flight"))}</span>
        <span>${esc(t("board_to"))}</span><span class="brd-gt">${esc(t("gate"))}</span>
        <span class="brd-st">${esc(t("board_status"))}</span><span class="brd-pr">${esc(t("board_price"))}</span></div>
      ${rows.map((r, i) => (r.day && !rows[i - 1]?.day ? daySep(r.date) : "") + boardRow(r, i, w)).join("")}
    </div></div>`;
}
/* Рейсы, чей сегодняшний вылет уже прошёл, идут следом — под строкой с датой. */
const daySep = date => `<div class="brd-sep"><span>${esc(t("fs_tomorrow"))}, ${esc(fdate(date, { day:"numeric", month:"long" }))}</span></div>`;
function departureBoard(){
  return `<section class="container section">
    <div class="sec-h"><h2>${esc(t("board_title"))}</h2><p class="muted">${esc(t("board_sub"))}</p></div>
    ${boardHTML()}</section>`;
}

/* Перещёлкивание: один цикл requestAnimationFrame на все ячейки, с условием
   остановки. jobs — [{ el, final, pool, end }]. */
function flapRun(jobs, root){
  if (!jobs.length) return;
  let last = 0;
  const tick = now => {
    if (!root.isConnected) return;
    if (now - last >= 50) {
      last = now; let busy = false;
      for (const j of jobs) {
        if (j.done) continue;
        if (now >= j.end) { j.el.textContent = j.final; j.done = true; }
        else { busy = true; j.el.textContent = j.pool[Math.floor(Math.random() * j.pool.length)]; }
      }
      if (!busy) return;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
const flapJob = (el, final, delay) => ({ el, final, pool:poolFor(final), end:performance.now() + delay });
/* Первое появление табло: щёлкают все буквы, каскадом по строкам и столбцам. */
function flapBoard(board){
  if (REDUCED || !board) return;
  flapRun($$(".brd-row .fl:not(.fl-sp)", board).map(el =>
    flapJob(el, el.textContent, 180 + Number(el.dataset.c) * 26 + Number(el.dataset.r) * 55 + Math.random() * 140)), board);
}
/* Точечная замена текста: щёлкают только изменившиеся буквы. */
function flapTo(cells, text, board){
  const jobs = [];
  [...text].forEach((ch, i) => {
    const el = cells[i]; if (!el || el.textContent === ch) return;
    if (REDUCED) el.textContent = ch; else jobs.push(flapJob(el, ch, 160 + i * 70));
  });
  flapRun(jobs, board);
}

/* На смене минуты: часы и статусы. Если порядок рейсов поменялся (рейс
   улетел и ушёл на завтра) — табло собирается заново. */
function boardTick(){
  const board = $("#board"); if (!board) return;
  const now = tashNow(), rows = boardRows(now);
  if (rows.map(r => r.c + r.day).join() !== BOARD.sig) {
    board.outerHTML = boardHTML();
    return flapBoard($("#board"));
  }
  const clock = $(".brd-clock", board);
  flapTo($$(".fl", clock), hhmm(now.min), board);
  clock.setAttribute("aria-label", `${t("board_now")}: ${hhmm(now.min)}`);
  for (const r of rows) {
    const row = $(`.brd-row[data-v="${r.c}"]`, board);
    if (!row || row.dataset.st === r.st) continue;
    row.classList.replace(`st-${row.dataset.st}`, `st-${r.st}`); row.dataset.st = r.st;
    const label = $(".brd-st span", row); label.textContent = t("fs_" + r.st);
    row.setAttribute("aria-label", rowLabel(r));
    if (!REDUCED) label.animate([{ opacity:0, transform:"translateY(-6px)" }, { opacity:1, transform:"none" }], { duration:320, easing:EASE_OUT });
  }
}
function scheduleBoardTick(){
  clearTimeout(BOARD.timer);
  BOARD.timer = setTimeout(() => { if (!$("#board")) return; boardTick(); scheduleBoardTick(); }, 60000 - Date.now() % 60000 + 40);
}
/* Табло щёлкает, когда его видно, и один раз за посещение главной. */
function armBoard(){
  const board = $("#board"); if (!board) return;
  scheduleBoardTick();
  if (M.ui.boardDone || REDUCED) return;
  const io = new IntersectionObserver(([e]) => {
    if (!e.isIntersecting) return;
    io.disconnect(); M.ui.boardDone = true; flapBoard(board);
  }, { threshold:0.35 });
  io.observe(board);
}
/* Нажали на рейс: ищем его дату, а если регистрация уже идёт — следующий день. */
ACT.boardgo = el => {
  const d = el.dataset.st === "sched" ? el.dataset.d : addDays(el.dataset.d, 1);
  Object.assign(M.flights, { from:"TAS", to:el.dataset.v, type:"oneway", depart:d < TODAY ? TODAY : d });
  M.module = "flights"; ACT.fsearch();
};

/* ---- 18-glmap.js ---- */
/* ==========================================================================
   Настоящая карта в шапке главной: MapLibre GL + векторные тайлы OpenFreeMap
   (данные OpenStreetMap) и рельеф Natural Earth, в фирменном тёмно-синем.

   Карта одна на всё время жизни страницы. Сайт перерисовывает страницу через
   innerHTML, поэтому узел карты живёт отдельно и после каждой отрисовки
   переставляется в новую «док»-обёртку героя — WebGL-контекст и загруженные
   тайлы при этом сохраняются.

   Смена маршрута: камера перелетает к новому маршруту, затем линия
   прорисовывается, и по ней летит самолёт (дуга большого круга — так летают
   настоящие рейсы). Для вертолётов камера опускается к Ташкентской области.
   Если WebGL или сервис карт недоступны — показывается схема из 16-routemap.js.
   ========================================================================== */
"use strict";

const GL_BASE = CONFIG.map.lib;                                          // адреса карты — в 00-config.js
const GL_TIMEOUT = 15000;                 // библиотека не загрузилась за это время — запасная схема
const TILES_WAIT = 8000;                  // тайлы медленные — показываем карту и маршрут, подложка догрузится
const FLY_MS = 1150;                      // полёт самолёта по линии
const MAPC = {
  land:"#1C2F6E", water:"#122254", border:"rgba(150,182,255,.42)", cover:"#26418A",
  road:"rgba(200,218,255,.13)", glow:"rgba(140,182,255,.5)", halo:"rgba(14,26,72,.75)",
  country:"rgba(196,212,250,.4)", sea:"rgba(128,162,236,.62)", city:"rgba(228,236,255,.74)", port:"rgba(226,234,255,.68)"
};
const EMPTY = { type:"FeatureCollection", features:[] };
/* Маркеры смотрят носом вверх — как PLANE_PATH; поворот задаёт MapLibre.
   Вертолёт — вид сверху, несущий винт вращается, пока он в полёте. */
const PLANE_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${PLANE_PATH}"/></svg>`;
const HELI_ICON = `<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="9.5" rx="3.1" ry="4.6"/><rect x="11.25" y="12.5" width="1.5" height="8" rx=".75"/>
  <rect x="9.2" y="19.4" width="5.6" height="1.5" rx=".75"/><g class="rotor"><rect x="1.5" y="8.8" width="21" height="1.4" rx=".7"/><rect x="11.3" y="-1" width="1.4" height="21" rx=".7"/></g></svg>`;
/* state: idle → loading → script → ready; при ошибке — failed */
const GL = { state:"idle", map:null, el:null, key:null, lang:null, geo:null, seq:0, raf:0, pills:[], plane:null, ping:null };

/* ---- геометрия маршрута ---- */
const R = Math.PI / 180;
const mercY = lat => Math.log(Math.tan(Math.PI / 4 + lat * R / 2));
const ll = ([lat, lon]) => [lon, lat];                           // COORDS хранит [широта, долгота]
/* Дуга большого круга, точками [долгота, широта]. */
function gcLine(a, b, n = 96){
  const [p1, l1, p2, l2] = [a[0] * R, a[1] * R, b[0] * R, b[1] * R];
  const d = 2 * Math.asin(Math.sqrt(Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin((l2 - l1) / 2) ** 2));
  if (d < 1e-6) return [ll(a), ll(b)];
  return Array.from({ length:n + 1 }, (_, i) => {
    const f = i / n, A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
    const x = A * Math.cos(p1) * Math.cos(l1) + B * Math.cos(p2) * Math.cos(l2);
    const y = A * Math.cos(p1) * Math.sin(l1) + B * Math.cos(p2) * Math.sin(l2);
    const z = A * Math.sin(p1) + B * Math.sin(p2);
    return [Math.atan2(y, x) / R, Math.atan2(z, Math.hypot(x, y)) / R];
  });
}
/* Короткий вертолётный перелёт: мягкая дуга, выгнутая к северу. */
function bowLine(a, b, n = 48){
  const [x1, y1, x2, y2] = [a[1], a[0], b[1], b[0]], k = Math.cos(y1 * R);
  let nx = -(y2 - y1), ny = (x2 - x1) * k;                         // нормаль в «квадратных» координатах
  const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
  if (ny < 0) { nx = -nx; ny = -ny; }
  const d = Math.hypot((x2 - x1) * k, y2 - y1) * 0.22, cx = (x1 + x2) / 2 + nx * d / k, cy = (y1 + y2) / 2 + ny * d;
  return Array.from({ length:n + 1 }, (_, i) => { const f = i / n, g = 1 - f;
    return [g * g * x1 + 2 * g * f * cx + f * f * x2, g * g * y1 + 2 * g * f * cy + f * f * y2]; });
}
/* Обзорный полёт: круг над городом с возвращением на площадку. */
function loopLine([lat, lon], n = 72){
  const r = 0.075, k = Math.cos(lat * R), c = [lon + r * 0.7 / k, lat + r * 0.7];
  const a0 = Math.atan2(lat - c[1], (lon - c[0]) * k);
  return Array.from({ length:n + 1 }, (_, i) => { const a = a0 - (i / n) * Math.PI * 2;
    return [c[0] + Math.cos(a) * r / k, c[1] + Math.sin(a) * r]; });
}
/* Положение на линии по доле пути. Расстояния — в проекции Меркатора,
   как у line-progress, чтобы самолёт шёл ровно по кромке прорисовки. */
function pathAt(line){
  const acc = [0];
  for (let i = 1; i < line.length; i++)
    acc.push(acc[i - 1] + Math.hypot((line[i][0] - line[i - 1][0]) * R, mercY(line[i][1]) - mercY(line[i - 1][1])));
  const L = acc[acc.length - 1] || 1;
  return p => {
    const d = clamp(p, 0, 1) * L; let i = 1;
    while (i < acc.length - 1 && acc[i] < d) i++;
    const f = (d - acc[i - 1]) / ((acc[i] - acc[i - 1]) || 1), a = line[i - 1], b = line[i];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  };
}
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2;

/* Что показать для текущего модуля и формы. */
function glGeo(){
  const st = mapState();
  if (st.local) {
    const sel = HELI_DEST.find(d => d.id === st.to), home = { ll:ll(HELI_BASE), code:"", name:t("heli_base").split(",")[0] };
    return { key:`heli:${st.to}`, local:true, home,
      line: sel.tour ? loopLine(HELI_BASE) : bowLine(HELI_BASE, sel.coord),
      dest: sel.tour ? null : { ll:ll(sel.coord), code:"", name:heliName(st.to) },
      ports: HELI_DEST.filter(d => d.coord && d.id !== st.to).map(d => ({ id:d.id, ll:ll(d.coord), n:d.name[S.lang] })),
      maxZoom: sel.tour ? 10.6 : 9.6, minSpan: 0.35 };
  }
  /* Туры и отели — точки только курортов: на карте выбирают из того же списка, что в форме. */
  const bg = (["tours", "hotels"].includes(M.module) ? RESORTS : WORLD_BG).filter(c => c !== st.from && c !== st.to);
  return { key:`${M.module}:${st.from}-${st.to}`, local:false,
    home:{ ll:ll(COORDS[st.from]), code:st.from, name:cityName(st.from) },
    dest:{ ll:ll(COORDS[st.to]), code:st.to, name:cityName(st.to) },
    line: gcLine(COORDS[st.from], COORDS[st.to]),
    ports: bg.map(c => ({ id:c, ll:ll(COORDS[c]), n:cityName(c) })), maxZoom: 5.4, minSpan: 7 };
}
/* Рамка маршрута с полями — чтобы вокруг была узнаваемая география. */
function glBounds(g){
  let [x0, y0, x1, y1] = [180, 90, -180, -90];
  for (const [x, y] of g.line) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const mx = Math.max((x1 - x0) * 0.12, (g.minSpan - (x1 - x0)) / 2, 0), my = Math.max((y1 - y0) * 0.12, (g.minSpan * 0.6 - (y1 - y0)) / 2, 0);
  return [[x0 - mx, y0 - my], [x1 + mx, y1 + my]];
}
/* Где на карте свободно от текста: правая колонка героя на широком
   экране, полоса над заголовком на узком. Остальное закрыто текстом. */
function glPadding(){
  const box = GL.el?.isConnected ? GL.el : $(".hero"), frame = $("#mapframe");
  if (!box || !frame) return 40;
  const H = box.getBoundingClientRect(), F = frame.getBoundingClientRect();
  const p = { top:F.top - H.top, left:F.left - H.left, right:H.right - F.right, bottom:H.bottom - F.bottom };
  for (const k in p) p[k] = Math.max(18, Math.round(p[k]) + 18);
  return p;
}

/* Свободное поле в координатах карты — туда можно ставить подписи. */
function glFrameBox(){
  const frame = $("#mapframe");
  if (!frame || !GL.el?.isConnected) return { x0:0, y0:0, x1:GL.el?.clientWidth || 0, y1:GL.el?.clientHeight || 0 };
  const H = GL.el.getBoundingClientRect(), F = frame.getBoundingClientRect();
  return { x0:F.left - H.left, y0:F.top - H.top, x1:F.right - H.left, y1:F.bottom - H.top };
