/* ---- загрузка ---- */
function loadGL(){
  GL.state = "loading";
  const probe = document.createElement("canvas");
  if (!(probe.getContext("webgl2") || probe.getContext("webgl"))) return glFail();
  const css = Object.assign(document.createElement("link"), { rel:"stylesheet", href:GL_BASE + "maplibre-gl.css" });
  const js = Object.assign(document.createElement("script"), { src:GL_BASE + "maplibre-gl.js", async:true });
  js.onload = () => {
    if (GL.state !== "loading") return;          // уже показали запасную схему — не рисуем вторую карту поверх
    GL.state = "script"; const dock = $("#mapdock"); if (dock) glCreate(dock);
  };
  js.onerror = glFail;
  document.head.append(css, js);
  setTimeout(() => { if (GL.state === "loading") glFail(); }, GL_TIMEOUT);
}
function glFail(){
  if (GL.state === "failed") return;
  GL.state = "failed";
  try { GL.map?.remove(); } catch (e) {}
  GL.el?.remove(); GL.map = GL.el = null;
  if (!currentParts().length) rerender();
}
function glCreate(dock){
  GL.el = Object.assign(document.createElement("div"), { className:"glmap" });
  dock.append(GL.el);
  const g = glGeo();
  let map;
  try {
    map = new maplibregl.Map({ container:GL.el, style:glStyle(), attributionControl:false,
      dragPan:false, scrollZoom:false, boxZoom:false, dragRotate:false, keyboard:false, doubleClickZoom:false, touchZoomRotate:false, touchPitch:false,
      bounds:glBounds(g), fitBoundsOptions:{ padding:glPadding(), maxZoom:g.maxZoom }, renderWorldCopies:false,
      fadeDuration:180, pixelRatio:Math.min(window.devicePixelRatio || 1, 2) });
  } catch (e) { return glFail(); }
  GL.map = map;
  map.on("error", () => {});              // отдельный недогруженный тайл — не повод шуметь в консоли
  /* Карта в герое — картинка, а не виджет: с клавиатуры до неё доходить не нужно,
     направление выбирается в форме поиска. */
  const cv = map.getCanvas();
  cv.tabIndex = -1; cv.removeAttribute("role"); cv.removeAttribute("aria-label");
  for (const id of ["ports-hit", "ports-lbl"]) {
    map.on("click", id, e => glPick(e.features[0]?.properties.id));
    map.on("mouseenter", id, () => { map.getCanvas().style.cursor = "pointer"; });
    map.on("mouseleave", id, () => { map.getCanvas().style.cursor = ""; });
  }
  const ready = () => {
    if (GL.state === "ready" || GL.map !== map || !map.getSource("route")) return;
    /* Сервис карт недоступен или так медленен, что за TILES_WAIT не пришло ни
       одного тайла подложки, — показываем запасную схему, а не пустой синий фон. */
    const hasBase = ["water", "boundary", "place"].some(l => map.querySourceFeatures("omt", { sourceLayer:l }).length);
    if (!hasBase) return glFail();
    GL.state = "ready";
    GL.el.classList.add("on");
    $("#mapframe")?.classList.add("gl-on");
    glUpdate(true);
  };
  map.once("load", ready);
  setTimeout(ready, TILES_WAIT);
}

/* ---- маркеры: подписи точек, самолёт, круг прибытия ----
   Подпись ставится с той стороны точки, куда не уходит линия, и не
   вылезает за край карты. Ставится после того, как камера встала. */
const PILL_OFFSET = { left:[13, 0], right:[-13, 0], top:[0, 11], bottom:[0, -11] };
const EDGE = 10;                                                              // отступ подписи от края свободного поля
const pillWidth = p => 22 + (p.code ? 34 : 0) + p.name.length * 8.2;         // оценка до вставки в DOM
/* Сторона — прочь от линии; не помещается в свободное поле — на другую сторону
   или над/под точкой, а центрированную подпись сдвигаем внутрь поля. */
function pillPlace(p, next){
  const ox = -(next[0] - p[0]) * Math.cos(p[1] * R), oy = next[1] - p[1];     // y экрана — вниз
  const vert = oy > 0 ? "top" : "bottom", f = glFrameBox(), x = GL.map.project(p.ll).x, w = pillWidth(p);
  const fitsR = x + 13 + w <= f.x1 - EDGE, fitsL = x - 13 - w >= f.x0 + EDGE;
  let a = Math.abs(ox) > Math.abs(oy) ? (ox > 0 ? "left" : "right") : vert;
  if (a === "left" && !fitsR) a = fitsL && Math.abs(ox) > Math.abs(oy) * 2 ? "right" : vert;
  else if (a === "right" && !fitsL) a = fitsR && Math.abs(ox) > Math.abs(oy) * 2 ? "left" : vert;
  const off = [...PILL_OFFSET[a]];
  if (a === "top" || a === "bottom") off[0] = clamp(0, f.x0 + EDGE - (x - w / 2), f.x1 - EDGE - (x + w / 2));
  return { a, off };
}
function glPill(p, place, home){
  const el = document.createElement("div");
  el.className = "gl-pill" + (home ? " gl-home" : "");
  el.innerHTML = `${p.code ? `<b class="mono">${esc(p.code)}</b>` : ""}<span>${esc(p.name)}</span>`;
  return new maplibregl.Marker({ element:el, anchor:place.a, offset:place.off }).setLngLat(p.ll).addTo(GL.map);
}
const BLOCK_OFFSET = { left:[1.2, 0], right:[-1.2, 0], top:[0, .95], bottom:[0, -.95] };
function glMarkers(g){
  GL.pills.forEach(m => m.remove());
  const n = g.line.length, ends = [[g.home, g.line[Math.min(6, n - 1)]], ...(g.dest ? [[g.dest, g.line[Math.max(0, n - 7)]]] : [])];
  const places = ends.map(([p, next]) => pillPlace(p, next));
  GL.pills = ends.map(([p], i) => glPill(p, places[i], i === 0));
  GL.map.getSource("ends").setData({ type:"FeatureCollection", features:ends.map(([p], i) => { const { a, off } = places[i];
    const o = [BLOCK_OFFSET[a][0] + off[0] / 14 - PILL_OFFSET[a][0] / 14, BLOCK_OFFSET[a][1]];
    return { type:"Feature", geometry:{ type:"Point", coordinates:p.ll }, properties:{ t:`${p.code} ${p.name}`.trim(), a, o } }; }) });
  glPorts(g);
  if (GL.plane) { const el = GL.plane.getElement(); el.innerHTML = g.local ? HELI_ICON : PLANE_ICON; el.classList.toggle("is-heli", g.local); return; }
  const pe = Object.assign(document.createElement("div"), { className:"gl-plane" + (g.local ? " is-heli" : ""), innerHTML:g.local ? HELI_ICON : PLANE_ICON });
  GL.plane = new maplibregl.Marker({ element:pe, rotationAlignment:"viewport" }).setLngLat(g.home.ll).addTo(GL.map);
  GL.ping = new maplibregl.Marker({ element:Object.assign(document.createElement("div"), { className:"gl-ping" }) }).setLngLat(g.home.ll).addTo(GL.map);
}
/* Точки-города — только в свободном поле: под текстом и формой их не нажать. */
function glPorts(g){
  const f = glFrameBox(), pad = 24;
  const feats = g.ports.map(p => ({ p, ...GL.map.project(p.ll) }))
    .filter(({ x, y }) => x > f.x0 - pad && x < f.x1 + pad && y > f.y0 - pad && y < f.y1 + pad)
    .map(({ p, x }) => { const right = x + 14 + p.n.length * 7.2 > f.x1;       // подпись не влезает справа — ставим слева от точки
      return { type:"Feature", properties:{ n:p.n, id:p.id, a:right ? "right" : "left", o:right ? [-.75, 0] : [.75, 0] }, geometry:{ type:"Point", coordinates:p.ll } }; });
  GL.map.getSource("ports").setData({ type:"FeatureCollection", features:feats });
}
function glClearMarkers(){ GL.pills.forEach(m => m.remove()); GL.pills = []; GL.plane?.getElement().classList.remove("on"); }
function glSources(g){
  const pt = (c, props = {}) => ({ type:"Feature", properties:props, geometry:{ type:"Point", coordinates:c } });
  GL.map.getSource("ports").setData(EMPTY);                                // точки ставит glPorts, когда камера встанет
  GL.map.getSource("ends").setData({ type:"FeatureCollection", features:[pt(g.home.ll), ...(g.dest ? [pt(g.dest.ll)] : [])] });
  GL.map.getSource("route").setData({ type:"Feature", properties:{}, geometry:{ type:"LineString", coordinates:g.line } });
}
/* Кадр полёта: линия прорисована до p, самолёт — на её кромке, нос по курсу. */
function glFrame(g, at, p){
  GL.map.setPaintProperty("route-line", "line-gradient", grad(p, "#fff"));
  GL.map.setPaintProperty("route-glow", "line-gradient", grad(p, MAPC.glow));
  const a = GL.map.project(at(Math.min(p, .996))), b = GL.map.project(at(Math.min(p, .996) + .004));
  GL.plane.setLngLat(at(p)).setRotation(Math.atan2(b.y - a.y, b.x - a.x) / R + 90);
}
function glFly(g){
  cancelAnimationFrame(GL.raf);
  const at = pathAt(g.line), seq = GL.seq;
  GL.plane.getElement().classList.add("on");
  if (REDUCED) { glFrame(g, at, 1); return; }
  const t0 = performance.now(), pe = GL.plane.getElement();
  pe.classList.add("flying"); GL.flying = true;
  const tick = now => {
    if (seq !== GL.seq || !GL.map) { GL.flying = false; return; }
    const x = Math.min(1, (now - t0) / FLY_MS);
    glFrame(g, at, easeInOut(x));
    if (x < 1) { GL.raf = requestAnimationFrame(tick); return; }
    pe.classList.remove("flying"); GL.flying = false;
    const ring = GL.ping.getElement();
    GL.ping.setLngLat(g.dest ? g.dest.ll : g.home.ll);
    ring.classList.remove("go"); void ring.offsetWidth; ring.classList.add("go");
  };
  GL.raf = requestAnimationFrame(tick);
}

/* Нажали на город на карте — он становится направлением в форме,
   и камера перелетает к новому маршруту. */
function glPick(id){
  if (!id) return;
  if (M.module === "heli") M.heli.to = id;
  else if (M.module === "tours") M.tours.to = id;
  else if (M.module === "hotels") M.hotels.city = id;
  else if (M.module === "jet") M.jet.to = id;
  else M.flights.to = id;
  rerender();
}

/* ---- обновление после каждой отрисовки героя ---- */
function glUpdate(first = false){
  if (!GL.el.isConnected) { GL.stale = true; return; }         // ушли с главной, пока карта грузилась
  const g = glGeo(), moved = g.key !== GL.key, relang = S.lang !== GL.lang;
  if (!moved && !relang && !first) return;
  GL.key = g.key; GL.lang = S.lang; GL.geo = g;
  if (relang) for (const id of LABEL_LAYERS) GL.map.setLayoutProperty(id, "text-field", glName());
  glSources(g);
  if (!moved && !first) { glRefit(true); return; }                     // сменился только язык: герой мог перестроиться

  const seq = ++GL.seq;
  cancelAnimationFrame(GL.raf);
  glClearMarkers();
  glFrame0();
  const cam = GL.map.cameraForBounds(glBounds(g), { padding:glPadding(), maxZoom:g.maxZoom });
  let started = false;
  /* GL.geo, а не g: если за время перелёта сменили язык, подписи — на новом. */
  const land = () => { if (started || seq !== GL.seq) return; started = true; glMarkers(GL.geo); glFly(GL.geo); GL.fit = glFitKey(); };
  if (first || !cam || REDUCED) { if (cam) GL.map.jumpTo(cam); setTimeout(land, first ? 350 : 0); return; }
  GL.map.flyTo({ ...cam, duration:1500, curve:1.35 });
  GL.map.once("moveend", land);
  setTimeout(land, 1750);                  // страховка, если moveend не придёт
}
/* Размер карты и свободного поля, под которые ставилась камера. */
const glFitKey = () => `${GL.el.clientWidth}x${GL.el.clientHeight}:${JSON.stringify(glPadding())}`;
/* Поле поменялось (поворот телефона, другая ширина окна, язык перестроил
   герой) — та же камера в новых полях, без анимации. Не поменялось — ничего:
   на телефоне resize приходит и при сворачивании адресной строки. */
function glRefit(force = false){
  if (GL.state !== "ready" || !GL.el?.isConnected || !GL.geo) return;
  const key = glFitKey();
  if (!force && key === GL.fit) return;
  GL.fit = key;
  const cam = GL.map.cameraForBounds(glBounds(GL.geo), { padding:glPadding(), maxZoom:GL.geo.maxZoom });
  if (cam) GL.map.jumpTo(cam);
  glMarkers(GL.geo);
  if (!GL.flying) glFrame(GL.geo, pathAt(GL.geo.line), 1);
}
/* Линия спрятана — перед перелётом камеры. */
function glFrame0(){
  GL.map.setPaintProperty("route-line", "line-gradient", grad(0, "#fff"));
  GL.map.setPaintProperty("route-glow", "line-gradient", grad(0, MAPC.glow));
}
/* Каждая отрисовка главной переставляет карту в новый герой. */
function dockMap(){
  const dock = $("#mapdock"); if (!dock) return;
  if (GL.state === "idle") return loadGL();
  if (GL.state === "script" && !GL.map) return glCreate(dock);
  if (!GL.el || GL.state === "failed") return;
  dock.append(GL.el);
  if (GL.state !== "ready") return;
  $("#mapframe")?.classList.add("gl-on");
  GL.map.resize();
  if (GL.stale) { GL.stale = false; GL.key = null; return glUpdate(true); }
  const before = GL.key;
  glUpdate();
  if (GL.key === before) glRefit();                                     // вернулись на главную после поворота экрана
}
/* Ширина окна изменилась — та же камера в новых полях, без анимации. */
let glResizeT = 0;
window.addEventListener("resize", () => { clearTimeout(glResizeT); glResizeT = setTimeout(() => glRefit(), 160); });

/* ==========================================================================
   Модуль «Авиабилеты». Движок перенесён 1:1 из src/data/flights.ts:
   тот же маршрут и дата дают те же рейсы, что в мобильном приложении.

"use strict";

const PROVIDERS = ["aqua","kompas","easy","prestige"];
function addMinutes(hhmm, mins){ const [h,m] = hhmm.split(":").map(Number); const x = (h*60+m+mins+1440*3) % 1440; return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0"); }
function baseSeed(from, to){
  const key = `${from}-${to}`; if (ROUTES[key]) return ROUTES[key];
  const rnd = mulberry32(seedFrom(key));
  const eco = 180+Math.floor(rnd()*420), durationMin = 150+Math.floor(rnd()*420), depH = 5+Math.floor(rnd()*16);
  const c = CARRIERS[Math.floor(rnd()*CARRIERS.length)];
  const depTime = `${String(depH).padStart(2,"0")}:${["00","15","30","45"][Math.floor(rnd()*4)]}`;
  return { carrier:c.name, flightNo:`${c.code}-${100+Math.floor(rnd()*899)}`, plane:PLANES[Math.floor(rnd()*PLANES.length)],
    depTime, arrTime:addMinutes(depTime, durationMin), ecoPrice:eco, busPrice:eco+220+Math.floor(rnd()*260), durationMin };
}
function generateOffers({ from, to, date, cabin }){
  const seed = baseSeed(from, to), rnd = mulberry32(seedFrom(`${from}-${to}-${date}-${cabin}`));
  const count = 4+Math.floor(rnd()*4), offers = [];
  for (let i = 0; i < count; i++) {
    const isBase = i === 0;
    const carrier = isBase ? { name:seed.carrier, code:seed.flightNo.split("-")[0] } : CARRIERS[Math.floor(rnd()*CARRIERS.length)];
    const stops = isBase ? 0 : (rnd() < 0.55 ? 0 : 1);
    const extra = stops === 1 ? 120+Math.floor(rnd()*150) : 0;
    const durationMin = seed.durationMin+extra+Math.floor((rnd()-0.5)*40);
    const depTime = isBase ? seed.depTime : addMinutes(seed.depTime, Math.floor((rnd()-0.5)*600));
    const arrTime = addMinutes(depTime, durationMin);
    const rawBase = cabin === "business" ? seed.busPrice : seed.ecoPrice;
    const jitter = isBase ? 0 : Math.floor((rnd()-0.35)*(cabin === "business" ? 160 : 90));
    const stopDiscount = stops === 1 ? -Math.floor(rawBase*0.08) : 0;
    const priceUSD = Math.round(Math.max(90, rawBase+jitter+stopDiscount) * (1 + prices().flightMarkupBps / 10000));   // наценка (10%, меняется в админке), как на сервере
    const stopCities = ["DXB","IST","DME","SHJ","ALA"];
    offers.push({ id:`${from}${to}-${date}-${i}`, provider:PROVIDERS[Math.floor(rnd()*PROVIDERS.length)],
      carrier:carrier.name, carrierCode:carrier.code,
      flightNo:isBase ? seed.flightNo : `${carrier.code}-${100+Math.floor(rnd()*899)}`,
      aircraft:isBase ? seed.plane : PLANES[Math.floor(rnd()*PLANES.length)],
      from, to, date, depTime, arrTime, durationMin, stops,
      stopCity:stops === 1 ? stopCities[Math.floor(rnd()*stopCities.length)] : undefined,
      cabin, priceUSD, priceUZS:toUzs(priceUSD), baggageKg:cabin === "business" ? 30 : 20, seatsLeft:1+Math.floor(rnd()*9) });
  }
  return offers.sort((a, b) => a.priceUSD - b.priceUSD);
}
/* Код брони — src/app/review.tsx makeRef. */
function makeRef(seed){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  let out = ""; for (let i = 0; i < 6; i++) { out += chars[h % chars.length]; h = Math.floor(h/chars.length) + seed.charCodeAt(i % seed.length)*7; }
  return `CHR-${out}`;
}
/* Регулярный рейс маршрута из таблицы приложения, если он есть, иначе самый дешёвый. */
function baseOffer(from, to, date, cabin = "economy"){
  const list = generateOffers({ from, to, date, cabin }), r = ROUTES[`${from}-${to}`];
  return (r && list.find(o => o.flightNo === r.flightNo)) || list[0];
}
const seatFor = o => `${10 + (o.durationMin % 20)}${"ABCDEF"[o.priceUSD % 6]}`;
const gateFor = o => `${"AB"[o.priceUSD % 2]}${5 + (o.durationMin % 15)}`;

/* Цена — src/app/offer.tsx: (туда + обратно) × (взрослые + дети) + 10% × младенцы. */
function flightFare(out, back, q){
  const unit = { usd: out.priceUSD + (back ? back.priceUSD : 0), uzs: out.priceUZS + (back ? back.priceUZS : 0) };
  const inf  = { usd: Math.round(unit.usd * 0.1), uzs: Math.round(unit.uzs * 0.1) };
  const paying = q.adults + q.children;
  return { unit, inf, total: addA(mulA(unit, paying), mulA(inf, q.infants)) };
}

function flightDetailsOf(out, back, q){ return { out, back, q:{ adults:q.adults, children:q.children, infants:q.infants, cabin:q.cabin } }; }
function startFlightCheckout(){
  const f = M.flights, out = f.sel.out, back = f.sel.back;
  const { lines, total } = flightLines(out, back, f);
  const types = [...Array(f.adults).fill("adult"), ...Array(f.children).fill("child"), ...Array(f.infants).fill("infant")];
  startCheckout({
    type: "FLIGHT",
    title: `${cityName(out.from)} → ${cityName(out.to)}${back ? " → " + cityName(back.to) : ""}`,
    sub: `${fdateY(out.date)}${back ? " — " + fdateY(back.date) : ""} · ${pl(types.length, "pax")}`,
    start: out.date, end: back ? back.date : out.date,
    travellers: { mode:"full", types },
    lines, total, recheck: true,
    details: flightDetailsOf(out, back, f),
    ref: makeRef(out.id + out.date),
    /* Перепроверка цены: рейс берётся заново по текущей наценке (её могли
       сменить в админке после выбора). Демонстрация «Цена изменилась» на рейсах
       в Анталию — чтобы экран можно было показать по заказу, а не случайно. */
    priceChange: () => {
      const fresh = x => x && (generateOffers({ from:x.from, to:x.to, date:x.date, cabin:x.cabin }).find(y => y.id === x.id) || x);
      let newOut = fresh(out); const newBack = fresh(back);
      if (out.to === "AYT") { const usd = Math.round(newOut.priceUSD * 1.045); newOut = { ...newOut, priceUSD:usd, priceUZS:toUzs(usd) }; }
      if (newOut.priceUSD === out.priceUSD && (!back || newBack.priceUSD === back.priceUSD)) return null;
      const r = flightLines(newOut, newBack, f);
      return { total:r.total, lines:r.lines, details:flightDetailsOf(newOut, newBack, f) };
    }
  });
}

/* ==========================================================================
   Модуль «Отели». Тестовый каталог на курортных направлениях чартеров.

"use strict";

function hotelNightly(h, date){
  const month = parseYMD(date).getMonth() + 1;
  // У направлений из админки сезона нет — цена ровная весь год.
  const season = (HIGH_SEASON[h.city] || []).includes(month) ? 1.18 : 1;
  return h.base * season * (0.94 + mulberry32(seedFrom(h.id + date))() * 0.12);
}
function hotelStay(h, checkin, nights, rooms, mult = 1){
  let sum = 0; for (let i = 0; i < nights; i++) sum += hotelNightly(h, addDays(checkin, i));
  return amt(sum * mult * rooms);
}

/* ---- 40-tours.js ---- */
/* ==========================================================================
   Модуль «Туры». Пакет = регулярный рейс туда и обратно из движка приложения
   + отель из каталога + трансфер + страховка, с пакетной скидкой 7%.
   Скидка — это то, ради чего покупают тур, а не всё по отдельности, поэтому
   экономия показывается в явном виде.
   ========================================================================== */
"use strict";

const TOUR_DISCOUNT = 0.93;
const TRANSFER_USD = 20;          // за человека, туда и обратно

/* legs — рейсы из сохранённого заказа: чек старого заказа не должен зависеть
   от сегодняшней наценки. Без них — рейсы по текущим ценам. */
function tourPackage(h, q, legs = null){
  const out = legs?.out || baseOffer("TAS", q.to, q.depart), back = legs?.back || baseOffer(q.to, "TAS", addDays(q.depart, q.nights));
  const people = q.adults + q.children, rooms = Math.ceil(q.adults / 2);
  const flights = mulA({ usd: out.priceUSD + back.priceUSD, uzs: out.priceUZS + back.priceUZS }, people);
  const hotel = hotelStay(h, q.depart, q.nights, rooms);
  const transfer = mulA(amt(TRANSFER_USD), people);
  const separate = addA(flights, hotel, transfer);
  const total = pctA(separate, TOUR_DISCOUNT);
  const saving = { usd: separate.usd - total.usd, uzs: separate.uzs - total.uzs };
  const perPerson = { usd: Math.round(total.usd / people), uzs: Math.round(total.uzs / people / 1000) * 1000 };
  return { h, out, back, people, rooms, flights, hotel, transfer, separate, total, saving, perPerson };
}
/* Строки чека: их сумма ровно равна итогу — скидка идёт отрицательной строкой. */
function tourLines(p, q){
  return [
    [`${t("flight_rt")} × ${pl(p.people, "pax")}`, p.flights],
    [`${p.h.name} · ${pl(q.nights, "night")} × ${pl(p.rooms, "room")}`, p.hotel],
    [t("transfer"), p.transfer],
    [t("insurance"), null],
    [t("package_discount"), { usd: -p.saving.usd, uzs: -p.saving.uzs }]
  ];
}

/* ==========================================================================
   Модули «Частные самолёты» и «Вертолёты». Поиска с ценами нет — у чартерных
   бортов нет API, цену ставит менеджер. Это та же заявочная модель, что в
   B2B-панели и в спецификации: NEW → PENDING (цена) → PAID → CONFIRMED.
   Сайт показывает честную оценку диапазоном до отправки заявки.
   ========================================================================== */
"use strict";

const round = (x, step) => Math.round(x / step) * step;
const fitClass = (list, pax, id) => id === "auto" ? list.find(c => c.seats >= pax) : list.find(c => c.id === id && c.seats >= pax);

function jetEstimate(q){
  const cls = fitClass(JETS, q.pax, q.cls); if (!cls) return null;
  const km = distanceKm(COORDS[q.from], COORDS[q.to]);
  const hours = km / cls.speed + 0.4;                         // + руление, набор, снижение
  const base = hours * cls.rate * (q.trip === "roundtrip" ? 2 : 1);
  return { cls, km, hours, low: amt(round(base, 100)), high: amt(round(base * 1.3, 100)), final: amt(round(base * 1.12, 100)) };
}
function heliEstimate(q){
  const cls = fitClass(HELIS, q.pax, q.cls); if (!cls) return null;
  const d = HELI_DEST.find(x => x.id === q.to);
  const km = d.tour ? 0 : distanceKm(HELI_BASE, d.coord);
  const hours = d.tour ? 0.5 : km / cls.speed + 0.25;
  // В одну сторону вертолёт всё равно возвращается на базу — оплачивается частично.
  const legs = d.tour ? 1 : q.trip === "roundtrip" ? 2 : 1.6;
  const base = Math.max(hours * cls.rate * legs, cls.rate * 0.5);
  return { cls, km, hours, dest:d, low: amt(round(base, 50)), high: amt(round(base * 1.25, 50)), final: amt(round(base * 1.1, 50)) };
}

const hoursText = h => { const m = Math.round(h * 60); return m < 60 ? `${m} ${t("min")}` : dur(m); };

function validateCheckout(){
  const c = M.checkout, last = c.end;
  const latin = s => /^[A-Z][A-Z' -]{0,40}$/.test(s);
  for (let i = 0; i < c.travellers.length; i++) {
    const x = c.travellers[i]; hideErr("#terr" + i);
    let e = null;
    if (!latin(x.surname) || !latin(x.given)) e = "err_name";
    else if (c.mode === "full") {
      if (!/^[A-Z0-9]{5,9}$/.test(x.passport)) e = "err_passport";
      else if (!x.gender) e = "err_gender";
      else if (!x.dob || x.dob >= TODAY) e = "err_dob";
      else if (!x.expiry || x.expiry <= last) e = "err_expiry";
    }
    if (e) { showErr("#terr" + i, t(e)); return false; }
  }
  hideErr("#cerr");
  if (!validPhone(c.contact.phone)) { showErr("#cerr", t("err_contact")); return false; }
  if (phoneBlocked(c.contact.phone)) { showErr("#cerr", t("err_blocked")); return false; }
  if (!validEmail(c.contact.email)) { showErr("#cerr", t("err_email")); return false; }
  return true;
}

function createOrder(spec, then){
  const now = Date.now();
  const o = { id:uid("o"), no:makeRef(`${spec.ref}:${now}:${Math.random()}`), type:spec.type, status:spec.status, createdAt:now,
    title:spec.title, sub:spec.sub, start:spec.start, end:spec.end, total:spec.total, method:spec.method || null,
    travellers:spec.travellers, contact:spec.contact, details:spec.details, req:null, paidAt:null,
    history: spec.status === "CONFIRMED" ? [{ s:"PAID", at:now }, { s:"CONFIRMED", at:now + 1000 }] : [{ s:"NEW", at:now }] };
  S.orders.unshift(o); save(); then?.(o.id);
  return o;
}
const hist = (o, s) => o.history.push({ s, at:Date.now() });
/* Заголовки заказа собираются из деталей при показе, а не хранятся строкой —
   иначе заказ, оформленный по-русски, остался бы русским в узбекском интерфейсе. */
function orderTitle(o){
  const d = o.details;
  if (o.type === "FLIGHT") return `${cityName(d.out.from)} → ${cityName(d.out.to)}${d.back ? " → " + cityName(d.back.to) : ""}`;
  if (o.type === "TOUR")   return hotelById(d.hotelId) ? `${hotelById(d.hotelId).name} · ${cityName(d.to)}` : o.title || cityName(d.to);
  if (o.type === "HOTEL")  return hotelById(d.hotelId)?.name || o.title || d.hotelId;
  if (o.type === "JET")    return `${cityName(d.from)} → ${cityName(d.to)}`;
  return heliName(d.to);
}
function orderSub(o){
  const d = o.details;
  if (o.type === "FLIGHT") return `${fdateY(d.out.date)}${d.back ? " — " + fdateY(d.back.date) : ""} · ${pl(d.q.adults + d.q.children + d.q.infants, "pax")}`;
  if (o.type === "TOUR")   return `${fdateY(d.depart)} — ${fdateY(addDays(d.depart, d.nights))} · ${pl(d.nights, "night")} · ${pl(d.adults + d.children, "tourist")}`;
  if (o.type === "HOTEL")  return `${cityName(hotelById(d.hotelId)?.city || "")} · ${fdateY(d.checkin)} — ${fdateY(d.checkout)} · ${pl(d.nights, "night")}`;
  return `${fdateY(d.date)}, ${d.time} · ${pl(d.pax, "pax")} · ${d.model}`;
}
function effStatus(o){ return o.status === "CONFIRMED" && o.end < TODAY ? "COMPLETED" : o.status; }
const pill = s => `<span class="pill st-${s}">${esc(t("st_" + s))}</span>`;
function orderLines(o){
  const d = o.details;
  if (o.type === "FLIGHT") return flightLines(d.out, d.back, { ...d.q }).lines;
  // Отеля уже нет в каталоге — одна строка на всю сумму заказа.
  if ((o.type === "TOUR" || o.type === "HOTEL") && !hotelById(d.hotelId)) return [[o.title || t("doc_" + o.type), o.total]];
  if (o.type === "TOUR")  { const q = { to:d.to, depart:d.depart, nights:d.nights, adults:d.adults, children:d.children }; return tourLines(tourPackage(hotelById(d.hotelId), q, { out:d.out, back:d.back }), q); }
  if (o.type === "HOTEL") { const h = hotelById(d.hotelId), r = ROOM_TYPES.find(x => x.id === d.room);
    return [[`${t("room_" + r.id)} × ${pl(d.rooms, "room")} · ${pl(d.nights, "night")}`, o.total]]; }
  return [[`${d.model} · ${hoursText(d.hours)}`, o.total]];
}

/* Менеджер по чартерам — в демо отвечает за 5 секунд, подтверждает борт за 2,5.
   Таймер проверяет все заказы, поэтому переживает и переходы, и перезагрузку. */
function tickCharter(){
  const now = Date.now(); let changed = false;
  for (const o of S.orders) {
    if (o.type !== "JET" && o.type !== "HELI") continue;
    // Пока открыта админка, цену ставит оператор, а не таймер.
    if (o.status === "NEW" && now - o.createdAt >= 5000 && !opsLive()) { o.status = "PENDING"; o.total = o.details.quote; hist(o, "PENDING"); changed = true; toast(tf("toast_priced", { no:o.no })); }
    if (o.status === "PAID" && o.paidAt && now - o.paidAt >= 2500) { o.status = "CONFIRMED"; hist(o, "CONFIRMED"); changed = true; toast(tf("toast_confirmed", { no:o.no })); }
  }
  if (changed) { save(); if (currentParts()[0] === "orders") rerender(); }
}

/* ==========================================================================
   Кабинет агентства: состояние, деньги, лента событий, жизнь заказов.

   Агентство платит за услуги с баланса в сумах. К стоимости услуги Charteri
   добавляет сервисный сбор (3%, ставку меняет админка — prices()), который
   виден до оплаты и не возвращается при отмене (спецификация, §4). Заказ хранит стоимость услуги (total) и сбор (fee)
   отдельно: строки чека собираются из деталей, как на сайте, а сбор — своей строкой.
   ========================================================================== */
"use strict";

/* Сбор округляется вверх до целого: в сумах — до сума, в долларах — до доллара. */
const feeOf = (a, bps = prices().feeBps) => ({ usd: Math.ceil(a.usd * bps / 10000), uzs: Math.ceil(a.uzs * bps / 10000) });
const withFee = a => addA(a, feeOf(a));
/* Баланс агентства — всегда в сумах, в какой бы валюте ни смотрели цены. */
const fmtUZS = n => (n < 0 ? "−" : "") + grp(Math.abs(n)) + NB + t("cur_uzs");
const PAID_TO_CONFIRMED_MS = 2500;       // поставщик подтверждает бронь
/* Эти три шага — работа оператора Charteri. Пока открыта админка (opsLive),
   их делает человек, а не таймер. */
const PRICE_READY_MS = 5000;             // оператор Charteri выставляет цену чартера
const REFUND_MS = 3000;                  // возврат зачисляют после ответа поставщика
const TOPUP_CLEAR_MS = 8000;             // банк или касса подтверждают пополнение

/* ---- баланс и проводки ----
   Каждое движение денег — проводка с остатком после неё: так выписка
   сходится с балансом без пересчёта. st — состояние агентства: в кабинете это
   S, в админке — любое из агентств. */
function post(kind, amount, extra = {}, st = S){
  st.balance += amount;
  st.ledger.unshift({ id:uid("l"), at:Date.now(), kind, amount, after:st.balance, ...extra });
}
/* ---- лента событий ---- */
function note(kind, extra = {}, st = S){
  st.notes.unshift({ id:uid("n"), at:Date.now(), kind, read:false, ...extra });
  st.notes = st.notes.slice(0, 40);
}
/* Заблокированное агентство не платит и не пополняет баланс: решение Charteri в админке. */
const agencyActive = () => S.agency.status !== "blocked";
const unread = () => S.notes.filter(n => !n.read).length;
function noteText(n){
  const o = n.orderId && S.orders.find(x => x.id === n.orderId);
  return tf("n_" + n.kind, { no: o ? o.no : "", title: o ? orderTitle(o) : "", amount: n.amount != null ? fmtUZS(n.amount) : "", reason: n.reason || "" });
}

/* ---- жизнь заказов и пополнений: раз в секунду ----
   Заменяет таймер сайта: здесь подтверждаются все типы заказов, а не только чартеры. */
function tickCharter(){
  // Свежие данные: админка могла записать их между тиками.
  refresh();
  const now = Date.now(), auto = !opsLive(); let changed = false;
  for (const o of S.orders) {
    const charter = o.type === "JET" || o.type === "HELI";
    if (auto && charter && o.status === "NEW" && now - o.createdAt >= PRICE_READY_MS) {
      o.status = "PENDING"; o.total = o.details.quote; o.feeBps = prices().feeBps; o.fee = feeOf(o.total, o.feeBps); hist(o, "PENDING"); changed = true;
      note("price_ready", { orderId:o.id }); toast(tf("toast_priced", { no:o.no }));
    }
    if (o.status === "PAID" && o.paidAt && now - o.paidAt >= PAID_TO_CONFIRMED_MS) {
      o.status = "CONFIRMED"; hist(o, "CONFIRMED"); changed = true;
      note("confirmed", { orderId:o.id }); toast(tf("n_confirmed", { no:o.no, title:orderTitle(o) }));
    }
    if (auto && o.status === "CANCELLED" && o.refund && !o.refund.done && now - o.refund.at >= REFUND_MS) {
      o.refund.done = true; o.status = "REFUNDED"; hist(o, "REFUNDED"); changed = true;
      if (o.refund.uzs > 0) post("refund", o.refund.uzs, { orderId:o.id });
      note("refunded", { orderId:o.id, amount:o.refund.uzs });
    }
  }
  for (const p of S.topups) {
    if (auto && p.status === "pending" && now - p.at >= TOPUP_CLEAR_MS) {
      p.status = "done"; post("topup", p.amount, { method:p.method }); changed = true;
      note("topup_ok", { amount:p.amount }); toast(tf("n_topup_ok", { amount:fmtUZS(p.amount) }));
    }
  }
  if (!changed) return;
  save();
  const page = currentParts()[0] || "";
  if (["", "orders", "balance"].includes(page)) rerender(); else renderNav(matchRoute(currentParts()).key);
}

/* ---- отмена: штраф поставщика по правилам услуги ----
   Возвращается стоимость услуги за вычетом штрафа. Сбор Charteri не возвращается. */
function penaltyOf(o, when = TODAY){
  const days = daysBetween(when, o.start);
  const rate = o.type === "HOTEL" ? (days >= 7 ? 0 : 0.5)
    : o.type === "FLIGHT" ? (days >= 14 ? 0.1 : days >= 3 ? 0.25 : 0.5)
    : o.type === "TOUR" ? (days >= 14 ? 0.15 : 0.4)
    : days >= 7 ? 0.2 : 0.5;
  const penalty = Math.ceil(o.total.uzs * rate), refund = Math.max(0, o.total.uzs - penalty);
  return { days, rate, penalty, refund };
}

const monogram = name => (name || "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "A";
/* Логотип — только PNG, который кабинет сам сделал из загруженного файла. */
const brandMark = (cls = "", b = S.brand) => /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(b.logo || "")
  ? `<span class="bmark ${cls}"><img src="${b.logo}" alt=""></span>`
  : `<span class="bmark mono-mark ${cls}">${esc(monogram(b.name))}</span>`;

/* ---- документы с брендом агентства ---- */
/* Текст на фирменной плашке — белый или тёмный, смотря по яркости цвета. */
function inkOn(hex){
  if (!/^#[0-9a-f]{6}$/i.test(hex)) return "#fff";
  const n = parseInt(hex.slice(1), 16);
  const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  const L = 0.2126 * lin(n >> 16 & 255) + 0.7152 * lin(n >> 8 & 255) + 0.0722 * lin(n & 255);
  return L > 0.42 ? "#16181D" : "#fff";
}
const brandColor = (b = S.brand) => /^#[0-9a-f]{6}$/i.test(b.color || "") ? b.color : "#16275C";
const brandStyle = (b = S.brand) => `--bc:${brandColor(b)};--bi:${inkOn(brandColor(b))}`;
const brandContacts = (b = S.brand) => [b.phone, b.email, b.telegram].filter(Boolean).map(esc).join(" · ");
function brandTop(kind, b = S.brand){
  return `<div class="bd-top" style="${brandStyle(b)}">${brandMark("bd-mark", b)}<span class="bd-name">${esc(b.name)}</span><span class="v-kind">${esc(kind)}</span></div>`;
}
function brandFoot(b = S.brand){
  return `<div class="bd-foot"><div class="stack" style="gap:2px"><b>${esc(b.name)}</b><span>${brandContacts(b)}</span>${b.address ? `<span>${esc(b.address)}</span>` : ""}</div>
    <span class="bd-pw">${esc(t("powered_by"))} <span class="wordmark dark">CHARTERI<b>.UZ</b></span></span></div>`;
}
/* b = бренд агентства; null — документ Charteri для пассажира сайта. */
function orderDocument(o, b = S.brand){
  if (o.type === "FLIGHT") return b ? `<div class="bdoc">${brandTop(t("doc_FLIGHT"), b)}${flightDocument(o)}${brandFoot(b)}</div>` : flightDocument(o);
  const body = { TOUR:tourVoucherBody, HOTEL:hotelVoucherBody, JET:charterVoucherBody, HELI:charterVoucherBody }[o.type](o);
  const top = b ? brandTop(t("doc_" + o.type), b) : `<div class="v-top"><span class="wordmark">CHARTERI<b>.UZ</b></span><span class="v-kind">${esc(t("doc_" + o.type))}</span></div>`;
  return `<article class="voucher ${b ? "bdoc-v" : ""} rise">${top}<div class="v-body">${body}</div><div class="perf"></div>${qrStub(o)}${b ? brandFoot(b) : ""}</article>`;
}

/* ---- сбор Charteri ----
   Ставка фиксируется в заказе (feeBps), как курс: смена сбора в админке
   меняет только новые заказы. */
const pctText = bps => String(bps / 100).replace(".", S.lang === "en" ? "." : ",");
const orderFeeBps = o => o.feeBps ?? (o.fee && o.total?.uzs ? Math.round(o.fee.uzs / o.total.uzs * 10000) : prices().feeBps);
/* Строки чека услуги и сбор отдельной строкой. */
const feeLines = (lines, total, fee, bps) => [...lines, [tf("service_fee", { p:pctText(bps) }), fee]];

/* ---- CSV для Excel ----
   Число — как есть. Строка, начинающаяся с = + - @, получает апостроф, иначе
   Excel выполнит её как формулу (название агентства из заявки — чужие данные). */
const csvCell = v => typeof v === "number" ? String(v) : `"${String(v ?? "").replace(/^([=+\-@\t\r])/, "'$1").replace(/"/g, '""')}"`;
const csvText = rows => "\ufeff" + rows.map(r => r.map(csvCell).join(";")).join("\r\n");

/* ---- на телефоне меню — выезжающая панель ----
   Закрытая, она уезжает за край и выключается целиком (inert): Tab и
   экранный диктор её не видят. */
const DRAWER_MQ = window.matchMedia("(max-width: 1024px)");
function syncDrawer(){
  const nav = $("#nav"), open = document.body.classList.contains("nav-open");
  if (nav) nav.inert = DRAWER_MQ.matches && !open;
  $('[data-act="navopen"]')?.setAttribute("aria-expanded", String(open && DRAWER_MQ.matches));
}
DRAWER_MQ.addEventListener("change", () => { document.body.classList.remove("nav-open"); syncDrawer(); });
function closeDrawer(){
  if (!document.body.classList.contains("nav-open")) return;
  document.body.classList.remove("nav-open"); syncDrawer();
  $('[data-act="navopen"]')?.focus({ preventScroll:true });
}
Object.assign(ACT, {
  navopen: () => { document.body.classList.add("nav-open"); syncDrawer(); $("#nav .side-link")?.focus({ preventScroll:true }); },
  navclose: () => closeDrawer()
});
document.addEventListener("click", e => { if (e.target.closest(".side-link, .side-sublink, .side-agency")) { document.body.classList.remove("nav-open"); syncDrawer(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") return closeDrawer();
  // Открытое меню на телефоне держит Tab внутри себя, как диалог.
  if (e.key !== "Tab" || !document.body.classList.contains("nav-open") || !DRAWER_MQ.matches) return;
  const f = $$("#nav a[href], #nav button:not([disabled]), #nav select"); if (!f.length) return;
  const first = f[0], last = f.at(-1);
  if (e.shiftKey && (document.activeElement === first || !$("#nav").contains(document.activeElement))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (document.activeElement === last || !$("#nav").contains(document.activeElement))) { e.preventDefault(); first.focus(); }
});

/* ==========================================================================
   Админка Charteri: состояние, роли, журнал действий, агентства.

   Данные трёх демо лежат в одном браузере:
     S     — кабинет живого агентства (CAB_KEY), его же видит кабинет;
     SITE  — сайт для пассажиров (SITE_KEY), если его открывали;
     O     — сама админка (OPS_KEY): сотрудники, журнал, другие агентства;
     APPS_KEY — заявки на подключение, их пишет форма регистрации кабинета.
   Каждое изменение: перечитать свежие данные → изменить → сохранить →
   записать в журнал. Так вкладка кабинета и админка не затирают друг друга.
   ========================================================================== */
"use strict";

const OPS_KEY = "charteri.ops.demo.v1";
const HB_EVERY_MS = 5000;
let O = null, SITE = null;

/* ---- кто вошёл ----
   Роли и права — в 11-roles.js. Вошедший сотрудник — только активный:
   отключённый теряет доступ сразу. */
const me = () => O?.staff.find(s => s.id === O.session?.staffId && s.active !== false) || null;
const activeStaff = () => O.staff.filter(s => s.active !== false).sort(byRank);
/* Кнопка без права не прячется: она выключена и подписана «нет прав». */
const guard = p => can(p) ? "" : `disabled aria-disabled="true" title="${esc(t("no_rights"))}" data-nr="${esc(t("no_rights_short"))}"`;
const denied = p => { if (can(p)) return false; toast(t("no_rights")); return true; };

/* Короткое объявление для экранного диктора без всплывающего сообщения:
   живая область в каркасе страницы, её не пересоздаёт перерисовка. */
function announce(msg){ const e = $("#adm-live"); if (!e) return; e.textContent = ""; setTimeout(() => { e.textContent = msg; }, 60); }

/* ---- хранилища ---- */
function loadOps(){ const r = readJSON(OPS_KEY, null); return r && r.v === 1 && Array.isArray(r.agencies) && Array.isArray(r.staff) ? migrateCrm(migrateRoles(migrateStaff(r))) : null; }
function saveOps(){ delete O._migrated; O.rev = (O.rev || 0) + 1; writeJSON(OPS_KEY, O); }
function loadSite(){ const r = readJSON(SITE_KEY, null); return r && r.v === 1 && Array.isArray(r.orders) ? r : null; }
const loadApps = () => { const a = readJSON(APPS_KEY, []); return Array.isArray(a) ? a : []; };

/* ---- журнал ----
   Запись: кто (и в какой роли на тот момент), что, когда, откуда (IP,
   устройство), в каком разделе и что было → что стало (diff). Значения
   хранятся без языка — текст собирается при показе. f:2 — записи этой версии. */
const AUDIT_MAX = 2000;
function audit(action, vars = {}, extra = {}){
  O.audit.unshift({ id:uid("a"), f:2, at:Date.now(), staffId:O.session?.staffId || null, role:me()?.role || null, action, vars, ip:DEMO_IP, dev:DEVICE,
    ...(extra.module ? { module:extra.module } : {}), ...(extra.diff?.length ? { diff:extra.diff } : {}) });
  O.audit = O.audit.slice(0, AUDIT_MAX);
}
/* Значение без языка → текст на языке экрана. Служебные значения — объекты
   с меткой: {role}, {t} (строка интерфейса), {acts} (действия), {uzs} (сумма,
   sign — со знаком «+»), {pct} (проценты в сотых), {ruleFrom} (порог правила),
   {ru,uz,en} — название на трёх языках. Строка — всегда то, что ввёл человек:
   её никогда не разбираем, поэтому причина «t: ...» остаётся текстом. */
const loc = v => v && typeof v === "object" ? v[S.lang] || v.ru || "" : v ?? "";
function auditVal(v){
  if (v == null) return "";
  if (typeof v !== "object") return String(v);
  if ("role" in v) return roleName(v.role);
  if ("t" in v) return t(v.t);
  if ("acts" in v) return v.acts.length ? v.acts.map(x => t("act_" + x)).join(", ") : "—";
  if ("uzs" in v) return (v.sign && v.uzs > 0 ? "+" : "") + fmtUZS(v.uzs);
  if ("pct" in v) return pctText(v.pct) + "%";
  if ("ruleFrom" in v) return tf("rule_from", { amount:fmtUZS(v.ruleFrom) });
  if ("dest" in v) return v.dest.heli ? heliName(v.dest.code) : cityName(v.dest.code);
  return loc(v);
}
/* Записи прошлой версии хранили роль строкой "role:operator". */
const legacyVal = v => typeof v === "string" && /^role:[a-z]+$/.test(v) ? roleName(v.slice(5)) : auditVal(v);
const auditVars = (vars, dec = auditVal) => Object.fromEntries(Object.entries(vars || {}).map(([k, v]) => [k, dec(v)]));
/* Запись о запросе на подтверждение хранит вид (apk) и его значения (w). */
function auditText(e){
  const dec = e.f === 2 ? auditVal : legacyVal;
  return e.vars?.apk ? tf("a_" + e.action, { ...auditVars(e.vars, dec), what:tf("apk_" + e.vars.apk, auditVars(e.vars.w)) }) : tf("a_" + e.action, auditVars(e.vars, dec));
}
/* Строка «что было → что стало»: k — ключ строки с названием поля. */
const diffText = d => `${t(d.k)}: ${auditVal(d.from) || "—"} → ${auditVal(d.to) || "—"}`;
/* Служебные значения для журнала: роль, строка интерфейса, сумма. */
const roleRef = id => ({ role:id }), strRef = key => ({ t:key }), uzsRef = (uzs, sign = false) => sign ? { uzs, sign:true } : { uzs };
const staffName = id => O.staff.find(s => s.id === id)?.name || "—";

/* ---- изменения ----
   Кабинет живого агентства: перечитать S, изменить, сохранить (кабинет в
   другой вкладке получит событие storage). Остальные агентства — внутри O. */
function change(fn){
  O = loadOps() || O;
  fn();

}
function withAgency(id, fn){
  if (id === LIVE_ID) {
    // Свежие данные кабинета: язык и тема в них — кабинета, их не трогаем.
    const fresh = loadState() || S, r = fn(fresh);
    fresh.rev = (fresh.rev || 0) + 1; writeJSON(CAB_KEY, fresh);
    S = fresh; adminPrefs();
    return r;
  }
  const a = O.agencies.find(x => x.id === id); return a ? fn(a) : undefined;
}
/* S — данные кабинета, но язык, тема и валюта на экране — админки.
   Поэтому core save() в админке не вызывается: он записал бы их в кабинет. */
function adminPrefs(){ if (!S || !O) return; S.lang = O.lang; S.theme = O.theme; S.cur = "UZS"; }

/* ---- агентства в одном виде ----
   Живое агентство — это кабинет демо (S). У остальных те же поля: баланс,
   проводки, заказы, пополнения, события, клиенты, бренд. */
const LIVE_ID = "ag-live";
function agencies(){

/* Все заказы: агентств и сайта. src — откуда: id агентства или "site". */
function allOrders(){
  const rows = agencies().flatMap(a => a.st.orders.map(o => ({ o, a, src:a.id })));
  for (const o of SITE?.orders || []) rows.push({ o, a:null, src:"site" });

const findOrder = (src, id) => allOrders().find(r => r.src === src && r.o.id === id) || null;
const orderClient = r => r.a ? clientOf(r.o) : (r.o.travellers[0] ? `${r.o.travellers[0].given} ${r.o.travellers[0].surname}`.trim() : r.o.contact.phone);

/* Сколько стоит заказ с учётом сбора: у пассажира сайта сбора нет. */

/* ---- задачи оператора, кассира ---- */
function tasks(){
  const rows = allOrders();
  return {
    price:   rows.filter(r => isCharter(r.o) && r.o.status === "NEW"),
    topups:  agencies().flatMap(a => a.st.topups.filter(p => p.status === "pending").map(p => ({ p, a }))),
    apps:    loadApps().filter(x => x.status === "pending"),
    reqs:    rows.filter(r => r.src === "site" && r.o.req && !r.o.req.status),
    refunds: rows.filter(r => r.o.status === "CANCELLED" && r.o.refund && !r.o.refund.done && !pendingAp(refundKey(r)))
  };
}
/* Сколько задач видит текущая роль: очереди её разделов и запросы коллег,

}

/* ---- перенос сохранённой админки на новые роли ----
   Вызывается при каждом чтении O: должен быть дешёвым и не менять уже
   перенесённое. */
function migrateRoles(o){
  o.roles = (Array.isArray(o.roles) ? o.roles : []).filter(r => r && typeof r.id === "string")
    .map(r => ({ ...r, sys:SYS_ORDER.includes(r.id), perms:r.id === "founder" ? ALL_PERMS() : cleanPerms(r.perms) }));
  for (const id of SYS_ORDER) if (!o.roles.some(r => r.id === id)) o.roles.push({ id, sys:true, perms:id === "founder" ? ALL_PERMS() : cleanPerms(SYS_ROLES[id]) });
  for (let v = (o.permsV || 1) + 1; v <= PERMS_V; v++) for (const r of o.roles) if (r.sys && r.id !== "founder") {
    const def = SYS_ROLES[r.id] || {}, next = Object.fromEntries(Object.entries(r.perms).map(([m, a]) => [m, [...a]]));
    // Новое действие добавляем, только если раздел у роли остался: раздел,
    // который основатель у роли снял, не возвращаем. Новый раздел — целиком.
    for (const p of PERMS_ADDED[v] || []) { const [m, a] = p.split("."), fresh = PERMS_NEW_MODS[v]?.includes(m);
      if (def[m]?.includes(a) && (fresh || next[m]?.includes("view"))) next[m] = [...new Set([...(next[m] || []), "view", a])]; }
    r.perms = cleanPerms(next); o._migrated = true;
  }

  o.roles.sort((a, b) => (a.sys ? roleRank(a.id) : SYS_ORDER.length) - (b.sys ? roleRank(b.id) : SYS_ORDER.length) || (a.at || 0) - (b.at || 0));

  // действующий владелец (бывший главный администратор), иначе — первый
  // действующий сотрудник. Отключённых не включаем; запись — в журнал.
  if (!o.staff.some(s => s.role === "founder" && s.active !== false)) {

        diff:[{ k:"staff_role", from:{ role:from }, to:{ role:"founder" } }] });

   для исполнителей задач: задачу нельзя поручить тому, кто её цель не видит. */
const crmAll = () => can("crm.manage");
const canSeeLeadAs = (l, s) => !!s && canAs(s, "crm.view") && (canAs(s, "crm.manage") || !l.manager || l.manager === s.id);
const canSeeLead = l => canSeeLeadAs(l, me());
function canSeeTarget(target, s = me()){
  const id = target.slice(2);
  if (target.startsWith("l:")) { const l = leadById(id); return !!l && canSeeLeadAs(l, s); }
  if (target.startsWith("a:")) return canAs(s, "b2b.view");
  return canAs(s, "b2c.view") || canAs(s, "crm.view");
}
const canEditLead = l => can("crm.edit") && canSeeLead(l);
const visibleLeads = () => O.crm.leads.filter(canSeeLead);
/* Кому можно назначить лид или задачу: действующие сотрудники, которые ведут лиды. */
const crmStaff = () => activeStaff().filter(s => s.role === "founder" || hasPerm(permsOf(s.role), "crm.edit"));

/* ---- лид: события ---- */
const leadEvent = (l, e) => { l.events.unshift({ at:Date.now(), by:e.sys ? null : me()?.id || null, ...e }); l.updatedAt = Date.now(); };
function newLead(o, spec){
  const l = { id:uid("ld"), no:leadNo(o), name:"", phone:"", email:"", country:"", source:"other", service:null, dest:"", budget:null,
    status:"new", manager:null, lostReason:"", links:[], origin:null, createdAt:Date.now(), updatedAt:Date.now(), by:null, events:[], ...spec };
  l.events = [{ at:l.createdAt, by:l.by, type:"created" }, ...(l.events || [])];
  o.crm.leads.unshift(l);
  return l;
}
/* Направление лида: код аэропорта или площадки — по языку экрана; текст — как ввели. */
const leadDest = l => !l.dest ? "" : typeof l.dest === "object" && l.dest.code ? (l.dest.heli ? heliName(l.dest.code) : cityName(l.dest.code)) : loc(l.dest);
const leadWhat = l => l.kind === "b2b" ? t("crm_b2b_interest") : [l.service ? t("type_" + l.service) : "", leadDest(l)].filter(Boolean).join(" · ");

/* ---- заказы: оплачен ли, в силе ли, закончилась ли поездка ---- */
const orderPaid = o => !!o.paidAt || !!o.history?.some(h => h.s === "PAID") || ["PAID", "CONFIRMED", "COMPLETED"].includes(o.status);
const orderGone = o => ["CANCELLED", "REFUNDED"].includes(o.status);
const orderWon = o => orderPaid(o) && !orderGone(o);
const orderEnded = o => ["CONFIRMED", "COMPLETED"].includes(o.status) && o.end && o.end < TODAY;
const siteOrder = id => SITE?.orders.find(o => o.id === id) || null;
const linkedOrders = l => l.links.map(x => x.src === "site" ? siteOrder(x.id) : null).filter(Boolean);

/* ---- синхронизация с сайтом и заявками агентств ----
   dry — только посчитать, есть ли что менять (без записи). Вызывается при
   запуске и при изменениях сайта или заявок; запись — внутри change(). */
const CHARTER_STAGE = { NEW:"new", PENDING:"progress", PAID:"confirmed", CONFIRMED:"confirmed", COMPLETED:"completed", CANCELLED:"lost", REFUNDED:"lost" };
const APP_STAGE = { pending:"new", approved:"completed", rejected:"lost" };
function syncCrm(dry){
  let n = 0;
  const hit = () => { n++; return !dry; };
  const leads = O.crm.leads, seen = new Set(O.crm.seen), see = k => { seen.add(k); O.crm.seen.push(k); };
  const linked = new Set(leads.flatMap(l => l.links.map(x => x.src + ":" + x.id)));
  const samePhone = ph => digits(ph) && leads.find(l => l.kind !== "b2b" && LEAD_OPEN.includes(l.status) && digits(l.phone) === digits(ph));
  // 1. Заявка на чартер с сайта → лид. Если у номера уже есть открытый лид —
  //    заявка ложится в него, второй лид не заводится.
  for (const o of SITE?.orders || []) {
    const k = "site:" + o.id;
    if (!["JET", "HELI"].includes(o.type) || seen.has(k) || !hit()) continue;
    see(k); if (linked.has(k)) continue;
    const same = samePhone(o.contact?.phone); linked.add(k);
    if (same) { same.links.push({ src:"site", id:o.id }); leadEvent(same, { type:"link", no:o.no || "", sys:true }); continue; }
    const st = CHARTER_STAGE[o.status] || "new", d = o.details || {};
    newLead(O, { name:o.travellers?.[0]?.given || "", phone:o.contact?.phone || "", source:"site_charter", service:o.type,
      dest:d.to ? { code:d.to, heli:o.type === "HELI" } : "", budget:d.quote?.usd || null, status:st, createdAt:o.createdAt,
      lostReason:st === "lost" ? strRef("lost_order_cancelled") : "", links:[{ src:"site", id:o.id }], origin:{ src:"site", id:o.id } });
  }
  // 2. Заявка агентства на подключение → лид B2B; решение по заявке двигает лид один раз.
  for (const a of loadApps()) {
    const k = "app:" + a.id, l = leads.find(x => x.origin?.app === a.id), st = APP_STAGE[a.status] || "new";
    if (!seen.has(k)) { if (!hit()) continue; see(k);
      if (!l) newLead(O, { name:a.company, contact:a.person, phone:a.phone, email:a.email, source:"b2b_app", kind:"b2b", status:st,
        createdAt:a.at, lostReason:st === "lost" ? a.reason || "" : "", origin:{ app:a.id }, autoDone:a.status === "pending" ? [] : [k + ":" + a.status] });
      continue; }
    const key = k + ":" + a.status;
    if (!l || a.status === "pending" || (l.autoDone || []).includes(key) || !hit()) continue;
    (l.autoDone ||= []).push(key);
    if (LEAD_OPEN.includes(l.status)) { leadEvent(l, { type:"status", from:l.status, to:st, sys:true }); l.status = st; l.lostReason = st === "lost" ? a.reason || "" : ""; }
  }
  // 3. Заказ сайта с номера лида, сделанный после лида, — в его карточку.
  //    Заказ принадлежит одному лиду; заявки на чартер разбирает шаг 1.
  for (const l of leads) {
    if (l.kind === "b2b" || !digits(l.phone) || !["confirmed", ...LEAD_OPEN].includes(l.status)) continue;
    for (const o of SITE?.orders || []) {
      const k = "site:" + o.id;
      if (digits(o.contact?.phone) !== digits(l.phone) || o.createdAt < l.createdAt || linked.has(k) || ["JET", "HELI"].includes(o.type) || !hit()) continue;
      l.links.push({ src:"site", id:o.id }); linked.add(k); leadEvent(l, { type:"link", no:o.no || "", sys:true });
    }
  }
  // 4. События заказов двигают лид — каждое один раз (autoDone), поэтому
  //    этап, который потом поменял менеджер, не перетирается:
  //    оплачен → «Подтверждён», поездка прошла → «Завершён»,
  //    отменён и других оплаченных нет → «Потерян».
  for (const l of leads) {
    const os = linkedOrders(l); if (!os.length) continue;
    for (const o of os) for (const tr of orderWon(o) ? (orderEnded(o) ? ["won", "ended"] : ["won"]) : orderGone(o) ? ["gone"] : []) {
      const key = o.id + ":" + tr;
      if ((l.autoDone || []).includes(key) || !hit()) continue;
      (l.autoDone ||= []).push(key);
      const to = tr === "won" && [...LEAD_OPEN, "lost"].includes(l.status) ? "confirmed" : tr === "ended" && l.status === "confirmed" ? "completed"
        : tr === "gone" && [...LEAD_OPEN, "confirmed"].includes(l.status) && !os.some(orderWon) ? "lost" : null;
      if (to) { leadEvent(l, { type:"status", from:l.status, to, sys:true }); l.status = to; l.lostReason = to === "lost" ? strRef("lost_order_cancelled") : ""; }
    }
  }
  return n;
}

/* Сотрудник печатает — данные сохраняем без перерисовки страницы (как при

/* ---- клиенты B2C ----
   Клиент — номер телефона. Собирается из заказов сайта, вошедшего на сайте,
   лидов и клиентов, заведённых вручную; поверх — данные CRM. */
function b2cClients(){
  const map = new Map();
  const add = (phone, name, at) => {
    const key = digits(phone); if (!key || key.length < 9) return null;
    if (!map.has(key)) map.set(key, { key, phone:prettyPhone(phone), name:"", orders:[], leads:[], spent:0, paid:0, last:0, first:at || Date.now() });
    const c = map.get(key); if (!c.name && name) c.name = name; if (at) { c.last = Math.max(c.last, at); c.first = Math.min(c.first, at); }
    return c;
  };
  // Имя — из лида (его вводит менеджер), затем из заказа (латиницей, как в паспорте).
  // Лиды — только те, что сотруднику видны: чужие лиды не раскрываются через карточку клиента.
  for (const l of O.crm.leads) if (l.kind !== "b2b" && canSeeLead(l)) { const c = add(l.phone, l.name, l.createdAt); if (c) c.leads.push(l); }
  if (SITE?.user?.phone) add(SITE.user.phone, "", 0);
  for (const o of SITE?.orders || []) {
    const c = add(o.contact?.phone, o.travellers?.[0] ? `${o.travellers[0].given} ${o.travellers[0].surname}`.trim() : "", o.createdAt); if (!c) continue;
    c.orders.push(o);
    if (o.total && orderPaid(o) && !["CANCELLED", "REFUNDED"].includes(o.status)) { c.spent += o.total.uzs; c.paid++; c.lastPaid = Math.max(c.lastPaid || 0, o.createdAt); }
  }
  for (const [k, v] of Object.entries(O.crm.clients)) if (k.startsWith("c:") && v.phone) add(v.phone, v.name, v.at);
  return [...map.values()].map(c => {
    const d = clientData("c:" + c.key) || {};
    const src = d.source || [...c.leads].sort((a, b) => a.createdAt - b.createdAt)[0]?.source || (c.orders.length ? "site" : "other");
    // Данные CRM главнее: пустое значение, которое сотрудник поставил сам, не подменяется данными из лида.
    return { ...c, name:d.name || c.name, email:d.email !== undefined ? d.email : c.orders.find(o => o.contact?.email)?.contact.email || c.leads.find(l => l.email)?.email || "",
      country:d.country !== undefined ? d.country : c.leads.find(l => l.country)?.country || "", source:src, manager:"manager" in d ? d.manager : c.leads.find(l => l.manager)?.manager || null,
      blocked:!!d.blocked, blockReason:d.blockReason || "", segment:segmentOf({ ...c, blocked:!!d.blocked }) };
  }).sort((a, b) => b.last - a.last);
}
function segmentOf(c){
  if (c.blocked) return "blocked";
  if (c.spent >= VIP_MIN) return "vip";
  if (c.lastPaid && Date.now() - c.lastPaid < ACTIVE_DAYS * DAY_MS) return "active";
  if (c.lastPaid) return "inactive";
  return "new";
}
const clientByKey = key => b2cClients().find(c => c.key === key) || null;

/* ==========================================================================
   Действия сотрудников. Каждое: проверить право → перечитать свежие данные →
   изменить → сохранить → записать в журнал. Деньги агентств двигаются теми
   же проводками, что в кабинете (post), события агентства — теми же note.
   ========================================================================== */
"use strict";

/* Заказ из строки allOrders(): свежая копия внутри своего хранилища. */
function mutOrder(r, fn){
  if (r.src === "site") return withSite(site => { const o = site.orders.find(x => x.id === r.o.id); return o ? fn(o, null) : undefined; });
  return withAgency(r.src, st => { const o = st.orders.find(x => x.id === r.o.id); return o ? fn(o, st) : undefined; });
}
/* Поле ввода в строке очереди: значение живёт в M.ui.inp, чтобы пережить перерисовку. */
const inp = (key, fallback = "") => M.ui.inp?.[key] ?? fallback;
const inpField = (key, attrs) => `<input data-inp="${esc(key)}" value="${esc(inp(key, attrs.value ?? ""))}" ${attrs.extra || ""} aria-label="${esc(attrs.label)}" placeholder="${esc(attrs.ph || "")}">`;
document.addEventListener("input", e => { const k = e.target.dataset?.inp; if (k != null) (M.ui.inp ||= {})[k] = e.target.value; });
const takeInp = key => { const v = (M.ui.inp?.[key] ?? $(`[data-inp="${CSS.escape(key)}"]`)?.value ?? "").trim(); if (M.ui.inp) delete M.ui.inp[key]; return v; };

/* ---- заказы ---- */
function priceOrder(r, usd){
  if (denied("orders.edit")) return false;
  if (!(usd > 0 && usd < 5_000_000)) { toast(t("err_price")); return false; }
  let done = false;
  change(() => mutOrder(r, (o, st) => {
    if (o.status !== "NEW") return;
    o.total = amt(usd); o.status = "PENDING"; hist(o, "PENDING"); done = true;
    if (st) { o.feeBps = prices().feeBps; o.fee = feeOf(o.total, o.feeBps); note("price_ready", { orderId:o.id }, st); }
    audit("price", { no:o.no, amount:uzsRef(o.total.uzs), src:srcVal(r) }, { diff:[{ k:"col_status", from:strRef("st_NEW"), to:strRef("st_PENDING") }] });
  }));
  if (done) toast(tf("t_priced", { no:r.o.no }));
  return done;
}
function confirmOrder(r){
  if (denied("orders.approve")) return;
  change(() => mutOrder(r, (o, st) => {
    if (o.status !== "PAID") return;
    o.status = "CONFIRMED"; hist(o, "CONFIRMED");
    if (st) note("confirmed", { orderId:o.id }, st);
    audit("confirm", { no:o.no, src:srcVal(r) }, { diff:[{ k:"col_status", from:strRef("st_PAID"), to:strRef("st_CONFIRMED") }] });
  }));
}
/* Оплаченный заказ: штраф поставщика по правилам услуги, сбор не возвращается,
   остаток ждёт зачисления (кассир). Неоплаченная заявка закрывается без денег. */
function cancelOrder(r){
  if (denied("orders.cancel")) return;
  change(() => mutOrder(r, (o, st) => {
    if (!["NEW", "PENDING", "PAID", "CONFIRMED"].includes(o.status)) return;
    const was = o.status;
    if (["PAID", "CONFIRMED"].includes(o.status) && o.total) {
      const p = penaltyOf(o); o.refund = { rate:p.rate, penalty:p.penalty, uzs:p.refund, at:Date.now(), done:false };
    }
    o.status = "CANCELLED"; hist(o, "CANCELLED");
    if (st) note("cancelled", { orderId:o.id }, st);
    audit("cancel", { no:o.no, src:srcVal(r), amount:o.refund ? uzsRef(o.refund.uzs) : "—" }, { diff:[{ k:"col_status", from:strRef("st_" + was), to:strRef("st_CANCELLED") }] });
  }));
  M.ui.cancelFor = null;
}
/* Возврат к зачислению. Крупный (по правилу подтверждения) ждёт второго
   сотрудника; решение и само зачисление — в execRefund. */
function creditRefund(r){
  if (denied("finance.refund")) return;
  const amount = r.o.refund?.uzs || 0;
  if (needsApproval("refund", amount)) return requestApproval("refund", { key:refundKey(r), payload:{ src:r.src, id:r.o.id }, amount,
    vars:{ no:r.o.no, amount:uzsRef(amount), src:srcVal(r) } });
  let err = null;
  change(() => { err = execRefund({ src:r.src, id:r.o.id }); });
  if (err) toast(t(err));
}
function execRefund({ src, id }){
  const r = findOrder(src, id); if (!r) return "ap_err_gone";
  let err = "ap_err_state";
  mutOrder(r, (o, st) => {
    if (o.status !== "CANCELLED" || !o.refund || o.refund.done) return;
    o.refund.done = true; o.status = "REFUNDED"; hist(o, "REFUNDED"); err = null;
    if (st) { if (o.refund.uzs > 0) post("refund", o.refund.uzs, { orderId:o.id }, st); note("refunded", { orderId:o.id, amount:o.refund.uzs }, st); }
    audit("refund", { no:o.no, amount:uzsRef(o.refund.uzs), src:srcVal(r) }, { diff:[{ k:"col_status", from:strRef("st_CANCELLED"), to:strRef("st_REFUNDED") }] });
  });
  return err;
}
function resolveReq(r, status, reply){

  if (status === "declined" && !reply) { toast(t("err_reply")); return false; }
  const done = withSite(site => { const o = site.orders.find(x => x.id === r.o.id); if (!o?.req || o.req.status) return false;
    Object.assign(o.req, { status, reply, doneAt:Date.now(), by:me().name }); return true; });

  change(() => audit(status === "done" ? "req_done" : "req_declined", { no:r.o.no }, { diff:reply ? [{ k:"reply", from:"", to:reply }] : [] }));

}

/* Ручная корректировка: только с причиной и не ниже нуля — как любое движение
   денег. По правилу подтверждения ждёт второго сотрудника. */
const ADJUST_MAX = 10_000_000_000;
function adjustBalance(aid, amount, reason){
  if (denied("finance.manage")) return false;
  if (!amount || !Number.isFinite(amount) || Math.abs(amount) > ADJUST_MAX) { toast(t("err_amount")); return false; }
  if (!reason) { toast(t("err_reason")); return false; }
  const a = agencyById(aid); if (!a) return false;
  if (a.st.balance + amount < 0) { toast(t("err_negative")); return false; }
  if (needsApproval("adjust", amount)) return requestApproval("adjust", { key:uid("adj"), payload:{ aid, amount, reason }, amount,
    vars:{ agency:a.name, amount:uzsRef(amount, true), reason } });
  let err = null;
  change(() => { err = execAdjust({ aid, amount, reason }); });
  toast(err ? t(err) : t("t_adjusted"));
  return !err;
}
/* ap — запрос на подтверждение, если операция выполняется по нему: тогда в
   выписке автор — тот, кто просил. */
function execAdjust({ aid, amount, reason }, ap){
  let err = "ap_err_gone";
  withAgency(aid, st => {
    if (st.balance + amount < 0) { err = "err_negative"; return; }
    const before = st.balance;
    post("adjust", amount, { reason, by:ap ? staffName(ap.by) : me().name }, st); note("adjust", { amount, reason }, st); err = null;
    audit("adjust", { agency:st.agency.name, amount:uzsRef(amount, true), reason }, { diff:[{ k:"col_balance", from:uzsRef(before), to:uzsRef(st.balance) }] });
  });
  return err;
}

/* ---- 17-approvals.js ---- */
/* ==========================================================================
   Подтверждения («четыре глаза»). Критичную операцию система выполняет,
   только когда её подтвердит другой сотрудник с правом «подтверждать» в этом
   разделе. Запрос хранит всё, чтобы выполнить операцию позже; перед
   выполнением данные проверяются заново — за время ожидания они могли
   измениться. Основатель — последняя инстанция: его действия выполняются сразу.

   Статусы запроса: pending → executed | rejected | failed | withdrawn.
   ========================================================================== */
"use strict";

/* Вид запроса: правило, которое его включает, право, нужное для решения,
   раздел журнала и значок. */
const AP_KINDS = {
  refund:     { rule:"refund",  perm:"finance.approve",  module:"finance",  icon:"back" },
  adjust:     { rule:"adjust",  perm:"finance.approve",  module:"finance",  icon:"wallet" },
  pricing:    { rule:"pricing", perm:"pricing.approve",  module:"pricing",  icon:"tag" },
  role_new:   { rule:"access",  perm:"roles.approve",    module:"roles",    icon:"key" },
  role_edit:  { rule:"access",  perm:"roles.approve",    module:"roles",    icon:"key" },
  role_del:   { rule:"access",  perm:"roles.approve",    module:"roles",    icon:"key" },
  staff_add:  { rule:"access",  perm:"roles.approve",    module:"staff",    icon:"badge" },
  staff_role: { rule:"access",  perm:"roles.approve",    module:"staff",    icon:"badge" },
  dir_del:    { rule:"delete",  perm:"services.approve", module:"services", icon:"globe" }
};
/* Правила: какие операции ждут второго сотрудника. У денежных — порог в сумах. */
const AP_RULES = ["refund", "adjust", "pricing", "access", "delete"];
const DEFAULT_RULES = { refund:{ on:true, min:5_000_000 }, adjust:{ on:true, min:0 }, pricing:{ on:true }, access:{ on:true }, delete:{ on:true } };
const RULE_MIN_MAX = 10_000_000_000;
function cleanRules(r){
  const out = {};
  for (const k of AP_RULES) {
    const d = DEFAULT_RULES[k], x = r?.[k];
    out[k] = { on:typeof x?.on === "boolean" ? x.on : d.on };
    if ("min" in d) out[k].min = Number.isInteger(x?.min) && x.min >= 0 && x.min <= RULE_MIN_MAX ? x.min : d.min;
  }
  return out;
}
/* Решённые запросы храним ограниченно, ждущие — все. */
const AP_KEEP = 300;

function needsApproval(kind, amount = 0){
  if (isFounder()) return false;
  const r = O.rules[AP_KINDS[kind].rule];
  return !!r?.on && (r.min == null || Math.abs(amount) >= r.min);
}
const pendingAp = key => O?.approvals?.find(a => a.status === "pending" && a.key === key) || null;
const refundKey = r => `refund:${r.src}:${r.o.id}`;
const apText = a => tf("apk_" + a.kind, auditVars(a.vars));

/* Запрос. key — что именно меняется: второй такой же, пока первый ждёт, не
   создаётся. vars — значения для текста, diff — что было → что станет.
   Возвращает, создан ли запрос. */
function requestApproval(kind, { key, payload, vars = {}, diff = [], amount = null }){
  let dup = false;
  change(() => {
    if (pendingAp(key)) { dup = true; return; }
    O.approvals.unshift({ id:uid("ap"), kind, key, payload, vars, diff, amount, status:"pending", by:me().id, at:Date.now() });
    const done = O.approvals.filter(a => a.status !== "pending");
    if (done.length > AP_KEEP) { const drop = new Set(done.slice(AP_KEEP).map(a => a.id)); O.approvals = O.approvals.filter(a => !drop.has(a.id)); }
    audit("ap_request", { apk:kind, w:vars }, { module:AP_KINDS[kind].module, diff });
  });
  toast(t(dup ? "ap_dup" : "ap_sent"));
  return !dup;
}

/* Почему текущий сотрудник не может решить запрос (ключ строки) или null.
   Свой запрос подтверждает другой; изменение своих прав — тоже другой. */
function apBlock(a){
  const u = me(); if (!u) return "no_rights";
  if (a.by === u.id) return "ap_err_self";
  if (!can(AP_KINDS[a.kind].perm)) return "no_rights";
  const p = a.payload || {};
  if ((a.kind === "staff_role" && p.staffId === u.id) || (["role_edit", "role_del"].includes(a.kind) && p.roleId === u.role)) return "ap_err_own";
  return null;
}
const myDecisions = () => (O?.approvals || []).filter(a => a.status === "pending" && !apBlock(a));
const canDecideAny = () => Object.values(AP_KINDS).some(k => can(k.perm));
/* Запрос видят его автор и те, у кого есть право его решать. */
const canSeeAp = a => a.by === me()?.id || can(AP_KINDS[a.kind].perm);

/* Исполнители: работают внутри change() — O уже свежий, change() не вызывают.
   Возвращают ключ ошибки или null. Сами операции — рядом с их разделами. */
const AP_EXEC = {
  refund:     (p, a) => execRefund(p, a),
  adjust:     (p, a) => execAdjust(p, a),
  pricing:    (p, a) => execPricing(p, a),
  role_new:   (p, a) => execRoleNew(p, a),
  role_edit:  (p, a) => execRoleEdit(p, a),
  role_del:   (p, a) => execRoleDel(p, a),
  staff_add:  (p, a) => execStaffAdd(p, a),
  staff_role: (p, a) => execStaffRole(p, a),
  dir_del:    (p, a) => execDirDel(p, a)
};
/* Право, с которым запрос создавали. К моменту решения автор должен быть
   действующим сотрудником и сохранить это право — иначе запрос не выполняется:
   отключённый или понижённый сотрудник не проводит операцию чужими руками. */
const AP_REQ_PERM = { refund:"finance.refund", adjust:"finance.manage", pricing:"pricing.edit", role_new:"roles.create", role_edit:"roles.edit",
  role_del:"roles.delete", staff_add:"staff.create", staff_role:"staff.edit", dir_del:"services.delete" };
function requesterBlock(a){
  const u = O.staff.find(s => s.id === a.by), p = a.payload || {};
  if (!u || u.active === false) return "ap_err_requester";
  const founder = u.role === "founder";
  if (!founder && !hasPerm(permsOf(u.role), AP_REQ_PERM[a.kind])) return "ap_err_requester";
  if (a.kind === "role_edit" && (p.roleId === u.role || (!founder && TOP_ROLES.includes(p.roleId)) || grantsBeyond(u, p.from, p.to).length)) return "ap_err_requester";
  if (a.kind === "role_new" && grantsBeyond(u, {}, p.role.perms).length) return "ap_err_requester";
  if (a.kind === "staff_role") { const x = O.staff.find(s => s.id === p.staffId);
    if (p.staffId === u.id || (!founder && (TOP_ROLES.includes(p.to) || TOP_ROLES.includes(x?.role)))) return "ap_err_requester"; }
  if (a.kind === "staff_add" && !founder && TOP_ROLES.includes(p.rec.role)) return "ap_err_requester";
  return null;
}
/* Сотрудника отключили или сменили ему роль — его ждущие запросы снимаются. */
function withdrawAllBy(staffId){
  for (const a of O.approvals) if (a.status === "pending" && a.by === staffId) {
    Object.assign(a, { status:"withdrawn", decidedBy:me()?.id || null, decidedAt:Date.now(), reason:"", error:"ap_err_requester" });
    audit("ap_withdraw", { apk:a.kind, w:a.vars }, { module:AP_KINDS[a.kind].module });
  }
}
function decideApproval(id, ok, reason = ""){
  const a0 = O.approvals.find(x => x.id === id);
  if (!a0 || a0.status !== "pending") { rerender(); return false; }
  const why = apBlock(a0); if (why) { toast(t(why)); return false; }
  if (!ok && !reason) { toast(t("err_reason")); return false; }
  // Операция проверит данные заново — берём свежие кабинет и сайт.
  S = loadState() || S; adminPrefs(); SITE = loadSite();
  let status = null;
  change(() => {
    const a = O.approvals.find(x => x.id === id); if (!a || a.status !== "pending") return;
    const err = ok ? requesterBlock(a) || AP_EXEC[a.kind](a.payload, a) : null;
    status = !ok ? "rejected" : err ? "failed" : "executed";
    Object.assign(a, { status, decidedBy:me().id, decidedAt:Date.now(), reason:ok ? "" : reason, error:err || "" });
    audit(!ok ? "ap_no" : err ? "ap_fail" : "ap_ok", { apk:a.kind, w:a.vars, name:staffName(a.by), reason, error:err ? strRef(err) : "" }, { module:AP_KINDS[a.kind].module });
  });
  if (status) toast(t("t_ap_" + status));
  return !!status;
}
function withdrawApproval(id){
  let done = false;
  change(() => {
    const a = O.approvals.find(x => x.id === id); if (!a || a.status !== "pending" || a.by !== me().id) return;
    Object.assign(a, { status:"withdrawn", decidedBy:me().id, decidedAt:Date.now() }); done = true;
    audit("ap_withdraw", { apk:a.kind, w:a.vars }, { module:AP_KINDS[a.kind].module });
  });
  if (done) toast(t("t_ap_withdrawn"));
}

/* ---- строка запроса ----
   mode: decide — можно решить; mine — свой, ждёт; wait — чужой, решить нельзя
   (показываем почему); done — решённый. */
function apDiff(a){
  return a.diff?.length ? `<ul class="ap-diff">${a.diff.map(d => `<li><span class="muted">${esc(t(d.k))}:</span> <s>${esc(auditVal(d.from) || "—")}</s> <span aria-hidden="true">→</span><span class="sr-only">${esc(t("ap_becomes"))}</span> <b>${esc(auditVal(d.to) || "—")}</b></li>`).join("")}</ul>` : "";
}
function apRow(a, mode){
  const k = AP_KINDS[a.kind], by = O.staff.find(s => s.id === a.by);
  const meta = [by ? `${by.name} · ${roleName(by.role)}` : "—", ago(a.at)].join(" · ");
  let act = "";
  if (mode === "decide") act = `<button type="button" class="solid sm" data-act="apok" data-v="${a.id}">${esc(t("approve"))}</button>${rejectBox("ap" + a.id, "apno", `data-v="${a.id}"`, k.perm, "ap_reason_ph")}`;
  else if (mode === "mine") act = `<span class="pill st-PENDING">${esc(t("ap_wait"))}</span><button type="button" class="link" data-act="apwithdraw" data-v="${a.id}">${esc(t("ap_withdraw"))}</button>`;
  else if (mode === "wait") act = `<span class="pill st-PENDING">${esc(t("ap_wait"))}</span>`;
  else act = `<span class="pill ${a.status === "executed" ? "st-CONFIRMED" : a.status === "withdrawn" ? "st-NEW" : "st-CANCELLED"}">${esc(t("ap_st_" + a.status))}</span>`;
  const note = mode === "wait" ? `<span class="small muted">${esc(t(apBlock(a) || "ap_wait"))}</span>`
    : mode === "done" ? `<span class="small muted">${esc(tf(a.status === "withdrawn" ? "ap_withdrawn_at" : "ap_decided", { name:staffName(a.decidedBy), ago:ago(a.decidedAt) }))}${a.reason ? ` · «${esc(a.reason)}»` : ""}${a.error ? ` · ${esc(t(a.error))}` : ""}</span>` : "";
  return `<div class="task ap-row" id="ap-${a.id}"><span class="task-ic ${mode === "decide" ? "warn" : ""}">${IC[k.icon]}</span>
    <span class="task-main"><b>${esc(apText(a))}</b><span class="muted small">${esc(meta)}</span>${apDiff(a)}${note}</span>
    ${a.amount ? `<b class="task-amt mono">${esc(auditVal(uzsRef(a.amount, a.kind === "adjust")))}</b>` : "<span></span>"}
    <span class="task-act">${act}</span></div>`;
}
Object.assign(ACT, {
  apok:       el => { const f = nextApFocus(el); if (decideApproval(el.dataset.v, true)) f(); },
  apno:       el => { const f = nextApFocus(el); if (decideApproval(el.dataset.v, false, takeInp("why:ap" + el.dataset.v))) { M.ui.ask["ap" + el.dataset.v] = false; rerender(); f(); } },
  apwithdraw: el => withdrawApproval(el.dataset.v)
});
/* После решения строка уходит из списка — фокус на следующую «Подтвердить»
   или на заголовок, чтобы клавиатура не терялась в начале страницы. */
function nextApFocus(el){
  const rows = $$(".ap-row"), i = rows.indexOf(el.closest(".ap-row"));
  const nextId = (rows[i + 1] || rows[i - 1])?.id;
  return () => { const b = nextId && $(`#${nextId} [data-act="apok"]`); (b || $("h1"))?.focus({ preventScroll:!b }); };
}
