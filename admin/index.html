/* ==========================================================================
   Обзор: что ждёт сотрудника сейчас, доход от сбора по дням, последние
   действия. Цифры — по всем агентствам и сайту.
   ========================================================================== */
"use strict";

const DAY_MS = 864e5, CHART_DAYS = 30;
const dayKey = ms => ymd(new Date(ms));

/* Доход Charteri — сервисный сбор оплаченных заказов агентств. Сбор не
   возвращается, поэтому отмена его не вычитает. */
function feeByDay(days = CHART_DAYS){
  const from = addDays(TODAY, -(days - 1)), sums = new Map();
  for (let i = 0; i < days; i++) sums.set(addDays(from, i), 0);
  for (const a of agencies()) for (const o of a.st.orders) {
    if (!o.paidAt || !o.fee) continue;
    const k = dayKey(o.paidAt); if (sums.has(k)) sums.set(k, sums.get(k) + o.fee.uzs);
  }
  return [...sums].map(([d, v]) => ({ d, v }));
}
function salesSince(ms){
  let sales = 0, fee = 0, n = 0;
  for (const a of agencies()) for (const o of a.st.orders) if (o.paidAt && o.paidAt >= ms && o.total) { sales += o.total.uzs; fee += o.fee?.uzs || 0; n++; }
  // Заказ сайта считается, только если его оплатили (в истории есть PAID).
  for (const o of SITE?.orders || []) { const paid = o.history?.find(h => h.s === "PAID"); if (paid && paid.at >= ms && o.total) { sales += o.total.uzs; n++; } }
  return { sales, fee, n };
}
/* Короткая запись больших сумм: 12,4 млн. Полная — в подсказке и таблице. */
const compactUZS = n => n >= 1e9 ? tf("bn", { v:(n / 1e9).toFixed(1).replace(".", S.lang === "en" ? "." : ",") })
  : n >= 1e6 ? tf("mln", { v:(n / 1e6).toFixed(1).replace(".", S.lang === "en" ? "." : ",") }) : grp(n);

/* Столбцы по дням: один ряд — без легенды, его называет заголовок. Ось одна,
   сетка — волосяные линии, у столбца скруглён только верх. Подсказка на
   наведение и фокус; те же цифры — в таблице под графиком для экранного диктора. */
/* Ширина графика — по ширине карточки (FC_W мерится после отрисовки), чтобы
   подписи осей оставались 11 px и на телефоне. */
let FC_W = 720;
function feeChart(data, W = FC_W){
  const H = W < 480 ? 200 : 220, L = 56, R = 8, T = 12, B = 26, max = Math.max(1, ...data.map(x => x.v));
  const every = Math.max(1, Math.ceil(data.length / Math.max(2, Math.floor((W - L) / 72))));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step, band = (W - L - R) / data.length, bw = Math.min(24, band - 2);
  const y = v => T + (H - T - B) * (1 - v / top);
  const ticks = []; for (let v = 0; v <= top + 1; v += step) ticks.push(v);
  const bar = (x, i) => {
    const h = Math.max(x.v ? 2 : 0, H - B - y(x.v)), bx = L + band * i + (band - bw) / 2, by = H - B - h, r = Math.min(4, h);
    const d = h ? `M${bx},${H - B}V${by + r}Q${bx},${by} ${bx + r},${by}H${bx + bw - r}Q${bx + bw},${by} ${bx + bw},${by + r}V${H - B}Z` : "";
    return `<g class="fc-bar" tabindex="${i === data.length - 1 ? 0 : -1}" role="img" aria-label="${esc(fdate(x.d))}: ${esc(fmtUZS(x.v))}" data-d="${esc(fdate(x.d, { weekday:"short", day:"numeric", month:"short" }))}" data-v="${esc(fmtUZS(x.v))}">
      <rect class="fc-hit" x="${L + band * i}" y="${T}" width="${band}" height="${H - T - B}"/>${d ? `<path d="${d}"/>` : ""}</g>`;
  };
  const labels = data.map((x, i) => (data.length - 1 - i) % every === 0 ? `<text class="fc-x" x="${L + band * i + band / 2}" y="${H - 8}" text-anchor="middle">${esc(fdate(x.d))}</text>` : "").join("");
  return `<div class="fchart" data-w="${W}"><svg viewBox="0 0 ${W} ${H}" role="group" aria-label="${esc(t("chart_fee"))}" aria-describedby="fc-keys">
      ${ticks.map(v => `<line class="fc-grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="fc-y" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${esc(compactUZS(v))}</text>`).join("")}
      ${data.map(bar).join("")}${labels}</svg>
    <div class="fc-tip" aria-hidden="true" hidden></div><p class="sr-only" id="fc-keys">${esc(t("chart_keys"))}</p></div>`;
}
function niceStep(raw){ const p = 10 ** Math.floor(Math.log10(Math.max(raw, 1))), m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
/* Подсказка у столбца: значение крупно, дата мельче. */
function tipAt(g){
  const box = g.closest(".fchart"), tip = box?.querySelector(".fc-tip"); if (!tip) return;
  tip.replaceChildren(Object.assign(document.createElement("b"), { textContent:g.dataset.v }), Object.assign(document.createElement("span"), { textContent:g.dataset.d }));
  const r = g.getBoundingClientRect(), b = box.getBoundingClientRect();
  tip.hidden = false; tip.style.left = clamp(r.left - b.left + r.width / 2, 60, b.width - 60) + "px"; tip.style.top = Math.max(0, r.top - b.top - 8) + "px";
}
const tipOff = g => { const tip = g.closest(".fchart")?.querySelector(".fc-tip"); if (tip) tip.hidden = true; };
document.addEventListener("pointerover", e => { const g = e.target.closest?.(".fc-bar"); if (g) tipAt(g); });
document.addEventListener("pointerout", e => { const g = e.target.closest?.(".fc-bar"); if (g && !g.contains(e.relatedTarget)) tipOff(g); });
document.addEventListener("focusin", e => { const g = e.target.closest?.(".fc-bar"); if (g) tipAt(g); });
document.addEventListener("focusout", e => { const g = e.target.closest?.(".fc-bar"); if (g) tipOff(g); });
/* Стрелки ведут по дням; в Tab график — одна остановка (последний день). */
document.addEventListener("keydown", e => {
  const g = e.target.closest?.(".fc-bar"); if (!g || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
  const bars = $$(".fc-bar", g.closest("svg")), i = bars.indexOf(g);
  const j = e.key === "Home" ? 0 : e.key === "End" ? bars.length - 1 : clamp(i + (e.key === "ArrowRight" ? 1 : -1), 0, bars.length - 1);
  e.preventDefault(); bars.forEach((b, k) => b.setAttribute("tabindex", k === j ? "0" : "-1")); bars[j].focus();
});

/* Сумма в плитке: от 100 млн — коротко («320,2 млн сум»), полная — в подсказке
   и для экранного диктора, чтобы плитка не обрезала цифры. */
const kpiMoney = n => n >= 1e8 ? { short:compactUZS(n) + NB + t("cur_uzs"), full:fmtUZS(n) } : fmtUZS(n);
function kpi(label, value, sub, href){
  const v = typeof value === "object" ? `<b class="kpi-v" title="${esc(value.full)}"><span aria-hidden="true">${esc(value.short)}</span><span class="sr-only">${esc(value.full)}</span></b>` : `<b class="kpi-v">${esc(value)}</b>`;
  const inner = `<span class="kpi-l">${esc(label)}</span>${v}${sub ? `<span class="kpi-s">${esc(sub)}</span>` : ""}`;
  return href ? `<a class="kpi" href="${href}">${inner}</a>` : `<div class="kpi">${inner}</div>`;
}

          ${recent.length ? `<ol class="feed">${recent.map(e => `<li><span class="feed-dot"></span><span class="stack" style="gap:2px"><span>${esc(auditText(e))}</span>
            <span class="muted small">${esc(staffName(e.staffId))} · ${esc(ago(e.at))}</span></span></li>`).join("")}</ol>` : `<p class="muted">${esc(t("audit_empty"))}</p>`}</section>` : ""}

  },
  after(){

/* Правила: черновик живёт до «Сохранить». Порог — целые сумы от 0. */
function saveRules(){
  if (!isFounder()) return toast(t("no_rights"));
  const draft = M.ui.rulesDraft; if (!draft) return;
  // Правила могли поменять в другой вкладке, пока черновик был открыт.
  if (JSON.stringify(O.rules) !== draft.base) { M.ui.rulesDraft = null; rerender(); return toast(t("ap_err_changed")); }
  const d = draft.rules, next = cleanRules(d);
  for (const k of AP_RULES) if ("min" in d[k] && !(Number.isInteger(d[k].min) && d[k].min >= 0 && d[k].min <= RULE_MIN_MAX)) { $(`[data-rule-min="${k}"]`)?.focus(); return showErr("#rlerr", t("err_rule_min")); }
  const diff = AP_RULES.filter(k => JSON.stringify(O.rules[k]) !== JSON.stringify(next[k])).map(k => ({ k:"rule_" + k, from:ruleVal(O.rules[k]), to:ruleVal(next[k]) }));

  toast(t("t_rules"));
}

/* ==========================================================================
   Общие куски CRM: комментарии и контакты, задачи, ответственный, история.

/* ---- комментарии и контакты ----

      <textarea data-inp="nt:${esc(target)}" rows="2" maxlength="${NOTE_MAX}" placeholder="${esc(t("crm_note_ph"))}" aria-label="${esc(t("crm_note_text"))}">${esc(inp("nt:" + target))}</textarea>

/* ---- задачи и напоминания ---- */
/* Поручить задачу можно тому, кто ведёт лиды и видит, к чему она относится. */
const taskAssignees = target => crmStaff().filter(s => canSeeTarget(target, s));
/* Срок по умолчанию — через 1–2 часа, ровно по часам; вечером и ночью — завтра в 10:00. */
function defaultDue(){
  const d = new Date(); d.setMinutes(0, 0, 0); d.setHours(d.getHours() + 2);

}
const canToggleTask = x => can("crm.edit") && (x.assignee === me()?.id || crmAll());

}

/* ---- ответственный ----
   Назначать может «CRM: управление»; остальные — только взять ничьего себе. */
function managerField(target, cur){

/* ---- действия ---- */
function addNote(target){
  if (!canNote(target)) return toast(t("no_rights"));
  const kind = NOTE_KINDS.includes(inp("nk:" + target, "call")) ? inp("nk:" + target, "call") : "note", text = inp("nt:" + target).trim();
  const box = $(`[data-inp="${CSS.escape("nt:" + target)}"]`);
  if (text.length < 2) { toast(t("err_note")); box?.setAttribute("aria-invalid", "true"); box?.focus(); return; }
  change(() => {
    O.crm.notes.unshift({ id:uid("n"), target, kind, text, by:me().id, at:Date.now() });
    const l = target.startsWith("l:") ? leadById(target.slice(2)) : null;
    // Первый контакт с новым лидом — лид сам переходит в «Связались».
    if (l && l.status === "new" && kind !== "note") { leadEvent(l, { type:"status", from:"new", to:"contacted" }); l.status = "contacted"; }
    audit("crm_note", { what:strRef("nk_" + kind), target:targetLabel(target) }, { module:"crm", diff:[{ k:"crm_note_text", from:"", to:text }] });
  });
  if (M.ui.inp) delete M.ui.inp["nt:" + target];
  rerender(); toast(t("t_crm_note")); $(`[data-inp="${CSS.escape("nt:" + target)}"]`)?.focus();
}
function addTask(target){
  if (!can("crm.edit") || !canNote(target)) return toast(t("no_rights"));
  const dd = defaultDue(), k = s => `${s}:${target}`, text = inp(k("tt")).trim(), date = inp(k("td"), dd.date), time = inp(k("th"), dd.time), who = inp(k("ta"), me().id);
  const [hh, mm] = time.split(":").map(Number), due = parseYMD(date).setHours(hh || 0, mm || 0, 0, 0);
  const bad = text.length < 3 ? ["err_task_text", "tt"] : !/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(due) ? ["err_task_due", "td"] : !taskAssignees(target).some(s => s.id === who) ? ["err_task_who", "ta"] : null;
  $$(`[data-inp$="${CSS.escape(":" + target)}"][aria-invalid]`).forEach(x => x.removeAttribute("aria-invalid"));
  if (bad) { const f = $(`[data-inp="${CSS.escape(k(bad[1]))}"]`), eid = "terr-" + cssKey(target);
    f?.setAttribute("aria-invalid", "true"); f?.setAttribute("aria-describedby", eid); showErr("#" + eid, t(bad[0])); f?.focus({ preventScroll:true }); return; }
  change(() => { O.crm.tasks.push({ id:uid("tk"), target, text, due, assignee:who, by:me().id, at:Date.now(), done:false });
    audit("task_new", { text, target:targetLabel(target), name:staffName(who) }, { module:"crm" }); });
  if (M.ui.inp) delete M.ui.inp[k("tt")];
  rerender(); toast(tf("t_task_new", { name:staffName(who) })); $(`[data-inp="${CSS.escape(k("tt"))}"]`)?.focus();
}
function setManager(target, id){
  const l = target.startsWith("l:") ? leadById(target.slice(2)) : null;
  if (!can("crm.edit") || (l && !canEditLead(l))) return toast(t("no_rights"));
  // Назначить другого — только с «CRM: управление»; без него — взять ничьего себе.
  const cur = l ? l.manager : target.startsWith("c:") ? clientByKey(target.slice(2))?.manager || null : clientData(target)?.manager || null;
  if (!crmAll() && !(cur == null && id === me().id)) return toast(t("no_rights"));
  if (id && !crmStaff().some(s => s.id === id)) return;

  change(() => {
    if (l) { const x = leadById(l.id); leadEvent(x, { type:"assign", from:x.manager, to:id || null }); x.manager = id || null; }
    else { const r = clientRec(target); if (target.startsWith("c:")) { const c = clientByKey(target.slice(2)); if (c && !r.phone) r.phone = c.phone; } r.manager = id || null; r.events.unshift({ at:Date.now(), by:me().id, type:"assign", to:id || null }); }

  });

}
Object.assign(ACT, {

document.addEventListener("change", e => {

/* ---- 60-finance.js ---- */
/* ==========================================================================
   Деньги: пополнения всех агентств, общая выписка, доход Charteri от сбора,
   возвраты. Выгрузка CSV — для бухгалтерии.

"use strict";

const FIN_TABS = ["topups", "ledger", "revenue", "refunds"];
const LEDGER_LIMIT = 200;

function finTopups(){
  const f = M.ui.ftop || "pending";
  const rows = agencies().flatMap(a => a.st.topups.map(p => ({ p, a }))).filter(x => f === "all" || x.p.status === f).sort((x, y) => y.p.at - x.p.at);

  return chips + `<div class="tasks">${rows.map(({ p, a }) => p.status === "pending" ? topupRow(p, a) : `<div class="task"><span class="task-ic">${IC.wallet}</span>

    <b class="task-amt mono">+${esc(fmtUZS(p.amount))}</b><span class="task-act">${p.status === "done" ? `<span class="pill st-CONFIRMED">${esc(t("tu_done"))}</span>` : `<span class="pill st-CANCELLED">${esc(t("tu_rejected"))}</span>`}</span></div>`).join("")}</div>`;
}
function ledgerAll(){
  const k = M.ui.fled || "all";
  return agencies().flatMap(a => a.st.ledger.map(l => ({ l, a }))).filter(x => k === "all" || x.l.kind === k).sort((x, y) => y.l.at - x.l.at);
}
function finLedger(){
  const k = M.ui.fled || "all", rows = ledgerAll(), shown = rows.slice(0, LEDGER_LIMIT);
  return `<div class="chipbar">${["all", "topup", "order", "refund", "adjust"].map(x => `<button type="button" class="chip" data-act="fled" data-v="${x}" aria-pressed="${k === x}">${esc(t("fl_" + x))}</button>`).join("")}</div>
    <div class="atable" style="--cols:150px minmax(0,1.2fr) minmax(0,1.6fr) 150px 150px" role="table" aria-label="${esc(t("statement"))}">

        <span class="a-cell a-key" role="cell">${esc(ledgerLabel(l, a.st))}</span><span class="a-num a-keep mono ${l.amount > 0 ? "plus" : ""}" role="cell">${l.amount > 0 ? "+" : "−"}${grp(Math.abs(l.amount))}</span>
        <span class="a-num mono muted" role="cell">${grp(l.after)}</span></div>`).join("")}</div>
    ${rows.length > shown.length ? `<p class="muted small">${esc(tf("shown_of", { n:shown.length, total:rows.length }))}</p>` : ""}`;
}
/* Доход — сбор оплаченных заказов агентств: по услугам и по агентствам,
   за текущий месяц и за всё время. Продажи — стоимость услуг без сбора. */
function revenue(){
  const month = TODAY.slice(0, 7), rows = { month:{}, all:{} }, byAg = [];
  for (const a of agencies()) {
    let agFee = 0, agSales = 0;
    for (const o of a.st.orders) {
      if (!o.paidAt || !o.total) continue;
      const fee = o.fee?.uzs || 0, sales = o.total.uzs;
      for (const [p, ok] of [["all", true], ["month", ymd(new Date(o.paidAt)).startsWith(month)]]) {
        if (!ok) continue; const r = rows[p][o.type] ||= { n:0, sales:0, fee:0 }; r.n++; r.sales += sales; r.fee += fee;
      }
      agFee += fee; agSales += sales;
    }
    byAg.push({ a, fee:agFee, sales:agSales });
  }
  return { rows, byAg:byAg.sort((x, y) => y.fee - x.fee) };
}
function finRevenue(){
  const { rows, byAg } = revenue(), types = ["FLIGHT", "TOUR", "HOTEL", "JET", "HELI"];
  const table = p => { const tot = types.reduce((s, k) => { const r = rows[p][k]; if (r) { s.n += r.n; s.sales += r.sales; s.fee += r.fee; } return s; }, { n:0, sales:0, fee:0 });
    return `<div class="atable" style="--cols:minmax(0,1.6fr) 90px minmax(0,1.3fr) minmax(0,1.2fr)" role="table" aria-label="${esc(t(p === "month" ? "rev_month" : "rev_all"))}">
      <div class="arow ahead" role="row"><span role="columnheader">${esc(t("col_service"))}</span><span class="a-num" role="columnheader">${esc(t("an_orders"))}</span>
        <span class="a-num" role="columnheader">${esc(t("col_sales"))}</span><span class="a-num" role="columnheader">${esc(t("col_fee"))}</span></div>
      ${types.map(k => { const r = rows[p][k] || { n:0, sales:0, fee:0 }; return `<div class="arow" role="row"><span class="a-cell a-key" role="cell">${esc(t("type_" + k))}</span>
        <span class="a-num mono" role="cell">${r.n}</span><span class="a-num mono" role="cell">${fmtUZS(r.sales)}</span><span class="a-num a-keep mono" role="cell">${fmtUZS(r.fee)}</span></div>`; }).join("")}
      <div class="arow total" role="row"><b class="a-key" role="cell">${esc(t("total"))}</b><span class="a-num mono" role="cell">${tot.n}</span><b class="a-num mono" role="cell">${fmtUZS(tot.sales)}</b><b class="a-num a-keep mono" role="cell">${fmtUZS(tot.fee)}</b></div></div>`; };
  return `<div class="rev-grid"><div class="stack"><h3>${esc(t("rev_month"))}</h3>${table("month")}</div><div class="stack"><h3>${esc(t("rev_all"))}</h3>${table("all")}</div></div>
    <h3 class="subh">${esc(t("rev_by_agency"))}</h3>

"use strict";

const pctInput = (key, bps) => inpField(key, { value:String(bps / 100), label:t(key), extra:`inputmode="decimal" maxlength="5" ${can("pricing.edit") ? "" : "disabled"}` });

          <p class="muted small">${esc(t("pr_fixed_d"))}</p></section>
      </div></div>`;
  }
};
/* Проценты с запятой или точкой, до сотых; разумные пределы — чтобы опечатка
   не сделала сбор 300%. */
function readPct(key, max){
  const raw = String(inp(key, "")).replace(",", ".").trim(); if (raw === "") return null;
  const v = Number(raw); if (!Number.isFinite(v) || v < 0 || v > max) return NaN;
  return Math.round(v * 100);
}
ACT.prsave = () => {
  if (denied("pricing.edit")) return;
  const p = prices(), fee = readPct("pr_fee_in", 10), mk = readPct("pr_markup_in", 30);
  if (Number.isNaN(fee) || Number.isNaN(mk)) return toast(t("err_pct"));
  const from = { feeBps:p.feeBps, flightMarkupBps:p.flightMarkupBps }, to = { feeBps:fee ?? p.feeBps, flightMarkupBps:mk ?? p.flightMarkupBps };
  if (to.feeBps === from.feeBps && to.flightMarkupBps === from.flightMarkupBps) return toast(t("pr_same"));
  const clear = () => { delete M.ui.inp?.pr_fee_in; delete M.ui.inp?.pr_markup_in; rerender(); };
  if (needsApproval("pricing")) { if (requestApproval("pricing", { key:"pricing", payload:{ from, to }, diff:pricingDiff(from, to) })) clear(); return; }
  let err = null;
  change(() => { err = execPricing({ from, to }); });
  clear(); toast(err ? t(err) : t("pr_saved"));
};
const pricingDiff = (from, to) => [["pr_fee", "feeBps"], ["pr_markup", "flightMarkupBps"]].filter(([, k]) => from[k] !== to[k])
  .map(([label, k]) => ({ k:label, from:{ pct:from[k] }, to:{ pct:to[k] } }));
/* Цены могли поменяться, пока запрос ждал: тогда он не выполняется. */
function execPricing({ from, to }){
  const p = prices();
  if (p.feeBps !== from.feeBps || p.flightMarkupBps !== from.flightMarkupBps) return "ap_err_changed";
  writeJSON(PRICES_KEY, to); PRICES = null;
  for (const d of pricingDiff(from, to)) audit(d.k === "pr_fee" ? "fee" : "markup", { from:d.from, to:d.to }, { diff:[d] });
  return null;
}

function readDir(d){

  return { iata:d.iata.trim().toUpperCase(), city:clean(d.city), country:clean(d.country), lat:num(d.lat), lon:num(d.lon), eco:Math.round(num(d.eco)),
    popular:!!d.popular, resort:!!d.resort, color:DIR_COLORS[d.color] || DIR_COLORS[0],

/* Ошибка и поле, к которому она относится: фокус ставим на это поле. */
function dirError(x){

  if (!/^[A-Z]{3}$/.test(x.iata)) return bad("err_dir_iata", "iata");
  if (AIRPORTS.some(a => a.iata === x.iata) || dirsSaved().some(d => d.iata === x.iata)) return bad("err_dir_dup", "iata");
  for (const g of ["city", "country"]) for (const l of L) if (x[g][l].length < 2 || x[g][l].length > NAME_MAX) return bad("err_dir_names", `${g}.${l}`);
  if (!Number.isFinite(x.lat) || Math.abs(x.lat) > 90) return bad("err_dir_coords", "lat");
  if (!Number.isFinite(x.lon) || Math.abs(x.lon) > 180) return bad("err_dir_coords", "lon");
  if (distanceKm(COORDS.TAS, [x.lat, x.lon]) < 150) return bad("err_dir_near", "lat");
  if (!Number.isFinite(x.eco) || x.eco < 50 || x.eco > 5000) return bad("err_dir_eco", "eco");
  if (x.resort) { const i = x.hotels.findIndex(h => h.name.length < 3 || !(h.base >= 20 && h.base <= 5000));
    if (i >= 0) return { key:"err_dir_hotels", hotel:`${i}.${x.hotels[i].name.length < 3 ? "name" : "base"}` }; }
  return null;
}

/* ---- галочки ----
   Действие без просмотра раздела бессмысленно: включили действие — включился
   просмотр; сняли просмотр — снялись все действия раздела. */
document.addEventListener("change", e => {
  const k = e.target.dataset?.pm; if (!k) return;
  const r = selRole(); if (!canEditRole(r)) return;
  const [m, a] = k.split("."), perms = clonePermsOf(draftPerms(r));
  const base = M.ui.roleDraft?.id === r.id ? M.ui.roleDraft.base : clonePermsOf(permsOf(r.id));
  const set = new Set(perms[m] || []);
  if (e.target.checked) { set.add(a); set.add("view"); } else if (a === "view") set.clear(); else set.delete(a);
  perms[m] = PERM_MODS[m].filter(x => set.has(x)); if (!perms[m].length) delete perms[m];
  M.ui.roleDraft = samePerms(perms, base) ? null : { id:r.id, base, perms };
  rerender(); $(`[data-pm="${k}"]`)?.focus();
  announce(tf("role_changed", { n:M.ui.roleDraft ? permDiff(base, perms).length : 0 }));
});
const clonePermsOf = p => Object.fromEntries(Object.entries(p).map(([m, a]) => [m, [...a]]));
document.addEventListener("input", e => { const k = e.target.dataset?.rn; if (k && M.ui.roleNew) M.ui.roleNew[k] = e.target.value; });
document.addEventListener("change", e => { const k = e.target.dataset?.rn; if (k && M.ui.roleNew) M.ui.roleNew[k] = e.target.value; });

/* ---- сохранение ---- */
function saveRolePerms(){
  const r = selRole(), d = M.ui.roleDraft; if (!d || d.id !== r.id) return;
  if (!canEditRole(r)) return toast(t("no_rights"));
  // Пока отмечали галочки, права роли могли поменять в другой вкладке.
  if (!samePerms(permsOf(r.id), d.base)) { M.ui.roleDraft = null; rerender(); $("#role-h")?.focus(); return toast(t("ap_err_changed")); }
  const from = clonePermsOf(d.base), to = cleanPerms(d.perms);
  if (samePerms(from, to)) { M.ui.roleDraft = null; rerender(); return toast(t("role_same")); }
  if (grantsBeyondMine(from, to).length) return toast(t("err_grant_beyond"));
  const payload = { roleId:r.id, from, to }, vars = { role:roleRef(r.id) }, diff = permDiff(from, to);
  if (needsApproval("role_edit")) { if (requestApproval("role_edit", { key:"role_edit:" + r.id, payload, vars, diff })) { M.ui.roleDraft = null; rerender(); $("#role-h")?.focus(); } return; }
  let e = null; change(() => { e = execRoleEdit(payload); });
  M.ui.roleDraft = null; rerender(); $("#role-h")?.focus(); toast(e ? t(e) : tf("t_role_saved", { role:roleName(r.id) }));
}
/* Название уникально среди действующих ролей — на всех трёх языках системных. */
function roleNameTaken(name){
  const n = name.toLowerCase();
  return liveRoles().some(r => (r.sys ? ["ru", "uz", "en"].map(l => roleName(r.id, l)) : [r.name]).some(x => x.toLowerCase() === n));
}
function createRole(){
  if (denied("roles.create")) return;
  const d = M.ui.roleNew, name = d.name.trim().replace(/\s+/g, " "), base = roleById(d.copy);
  if (name.length < 2 || name.length > ROLE_NAME_MAX) return showErr("#rnerr", t("err_role_name"));
  if (roleNameTaken(name)) return showErr("#rnerr", t("err_role_dup"));
  if (!base || base.deleted || base.id === "founder") return;
  const perms = clonePermsOf(permsOf(base.id));
  if (grantsBeyondMine({}, perms).length) return showErr("#rnerr", t("err_grant_beyond"));
  const role = { id:uid("r"), name, perms }, payload = { role }, vars = { role:name };
  const diff = permDiff({}, perms);
  if (needsApproval("role_new")) { if (requestApproval("role_new", { key:"role_new:" + name.toLowerCase(), payload, vars, diff })) { M.ui.roleNew = null; rerender(); } return; }
  let e = null; change(() => { e = execRoleNew(payload); });
  if (e) return showErr("#rnerr", t(e));
  M.ui.roleNew = null; M.ui.roleSel = role.id; M.ui.roleDraft = null; rerender(); toast(tf("t_role_new", { role:name }));
  $(`[data-act="rolesel"][data-v="${CSS.escape(role.id)}"]`)?.scrollIntoView({ block:"nearest", inline:"nearest" }); $("#role-h")?.focus();
}
function deleteRole(id){
  const r = roleById(id); if (!r || r.sys || r.deleted || denied("roles.delete")) return;
  if (holders(id).length) return toast(t("err_role_used"));
  if (!confirm(tf("role_delete_q", { role:r.name }))) return;
  const payload = { roleId:id }, vars = { role:r.name };
  if (needsApproval("role_del")) { requestApproval("role_del", { key:"role_del:" + id, payload, vars }); return; }
  let e = null; change(() => { e = execRoleDel(payload); });
  if (e) return toast(t(e));
  M.ui.roleSel = null; M.ui.roleDraft = null; rerender(); toast(tf("t_role_del", { role:r.name })); $("h1")?.focus();
}
/* Исполнители (см. 17-approvals.js): работают внутри change(). */
function execRoleEdit({ roleId, from, to }){
  const r = roleById(roleId); if (!r || r.deleted || r.id === "founder") return "ap_err_gone";
  if (!samePerms(r.perms, from)) return "ap_err_changed";
  r.perms = cleanPerms(to);
  audit("role_edit", { role:roleRef(r.id) }, { diff:permDiff(from, r.perms) });
  return null;
}
/* ap — запрос, если роль создаётся по нему: автор роли — тот, кто просил. */
function execRoleNew({ role }, ap){
  if (roleNameTaken(role.name)) return "err_role_dup";
  const perms = cleanPerms(role.perms);
  O.roles.push({ id:role.id, sys:false, name:role.name, perms, by:ap ? ap.by : me().id, ...(ap ? { approvedBy:me().id } : {}), at:Date.now() });
  audit("role_new", { role:role.name }, { diff:permDiff({}, perms) });
  return null;
}
/* Роль не удаляется из данных: журнал помнит её название. */
function execRoleDel({ roleId }){
  const r = roleById(roleId); if (!r || r.sys || r.deleted) return "ap_err_gone";
  if (holders(roleId).length) return "err_role_used";
  r.deleted = true; r.deletedAt = Date.now();
  audit("role_delete", { role:r.name });
  return null;
}

  rolesel:      el => { if (M.ui.roleSel !== el.dataset.v) M.ui.roleDraft = null; M.ui.roleSel = el.dataset.v; rerender(); $(`[data-act="rolesel"][data-v="${CSS.escape(el.dataset.v)}"]`)?.focus(); },

  rolenew:      () => { if (denied("roles.create")) return; M.ui.roleNew = { name:"", copy:"viewer" }; M.ui.rnFocus = true; rerender(); },
  rolenewclose: () => { M.ui.roleNew = null; rerender(); $('[data-act="rolenew"]')?.focus(); },
  rolecreate:   () => createRole(),

});

/* ---- 84-audit.js ---- */
/* ==========================================================================
   Журнал действий: кто (и в какой роли), что, когда, откуда (IP, устройство),
   было → стало. Фильтры по сотруднику, разделу, периоду и тексту; выгрузка
   CSV — по праву audit.export. Записи не удаляются и не правятся.
   ========================================================================== */
"use strict";

/* Раздел старых записей (без поля module) — по действию. */
const AUDIT_MODULE = {
  price:"orders", confirm:"orders", cancel:"orders", refund:"finance", req_done:"b2c", req_declined:"b2c", topup_ok:"finance", topup_rejected:"finance",
  app_ok:"b2b", app_rejected:"b2b", block:"b2b", unblock:"b2b", adjust:"finance", ag_create:"b2b", ag_edit:"b2b", ag_message:"b2b",
  fee:"pricing", markup:"pricing", dir_add:"services", dir_hide:"services", dir_show:"services", dir_delete:"services",
  staff_add:"staff", staff_off:"staff", staff_on:"staff", staff_role:"staff", staff_edit:"staff", role_new:"roles", role_edit:"roles", role_delete:"roles",
  rules:"settings", reset:"settings", export:"finance", switch:"session", signin:"session", signout:"session"
};
const AU_MODS = [...Object.keys(PERM_MODS), "session"];
const AU_PERIODS = ["all", "today", "7", "30"];
const auditModule = e => e.module || AUDIT_MODULE[e.action] || "session";
/* Роль на момент действия; у старых записей её нет — текущая. */
const auditRole = e => roleName(e.role || O.staff.find(s => s.id === e.staffId)?.role);

function auditRows(){
  const who = M.ui.auWho || "all", mod = M.ui.auMod || "all", per = M.ui.auPer || "all", q = (M.ui.auq || "").trim().toLowerCase();
  // Начало сегодняшнего дня — по часам сейчас: админка может быть открыта с вечера.
  const since = per === "today" ? new Date().setHours(0, 0, 0, 0) : per === "all" ? 0 : Date.now() - Number(per) * DAY_MS;
  return O.audit.filter(e => (who === "all" || e.staffId === who) && (mod === "all" || auditModule(e) === mod) && e.at >= since
    && (!q || [auditText(e), staffName(e.staffId), e.ip || "", ...(e.diff || []).map(diffText)].join(" ").toLowerCase().includes(q)));
}
function auditList(){
  const rows = auditRows();
  if (!rows.length) return `<p class="muted">${esc(t(O.audit.length ? "audit_none_match" : "audit_empty"))}</p>`;
  return `<div class="atable au-table" style="--cols:140px minmax(0,1.2fr) minmax(0,3fr) minmax(0,1.1fr)" role="table" aria-label="${esc(t("an_audit"))}">
    <div class="arow ahead" role="row"><span role="columnheader">${esc(t("col_date"))}</span><span role="columnheader">${esc(t("col_staff"))}</span>
      <span role="columnheader">${esc(t("col_action"))}</span><span role="columnheader">${esc(t("col_where"))}</span></div>
    ${rows.slice(0, AU_SHOW).map(e => `<div class="arow" role="row"><span class="a-cell a-sub muted small" role="cell">${esc(fdt(e.at))}</span>
      <span class="a-cell a-sub wrap" role="cell">${esc(staffName(e.staffId))}<br><span class="muted small">${esc(auditRole(e))}</span></span>
      <span class="a-key" role="cell"><span>${esc(auditText(e))}</span>${e.diff?.length ? `<ul class="ap-diff">${e.diff.map(d => `<li><span class="muted">${esc(t(d.k))}:</span> <s>${esc(auditVal(d.from) || "—")}</s>
        <span aria-hidden="true">→</span><span class="sr-only">${esc(t("ap_becomes"))}</span> <b>${esc(auditVal(d.to) || "—")}</b></li>`).join("")}</ul>` : ""}
        <span class="muted small">${esc(t("m_" + auditModule(e)))}</span></span>
      <span class="a-cell small muted" role="cell"><span class="mono">${esc(e.ip || "—")}</span><br>${esc(e.dev || "")}</span></div>`).join("")}</div>
    ${rows.length > AU_SHOW ? `<p class="muted small">${esc(tf("au_more", { n:rows.length - AU_SHOW }))}</p>` : ""}`;
}
/* На экране — последние записи; выгрузка — все подходящие. */
const AU_SHOW = 200;
PAGES.audit = {
  render(){
    const who = M.ui.auWho || "all", mod = M.ui.auMod || "all", per = M.ui.auPer || "all";
    return `<div class="page">
      <div class="pagehead row-head"><div class="stack" style="gap:6px"><h1>${esc(t("an_audit"))}</h1><p class="muted">${esc(t("audit_sub"))}</p></div>
        <button type="button" class="ghost sm" data-act="aucsv" ${guard("audit.export")}>${IC.doc}<span>${esc(t("download_csv"))}</span></button></div>
      <div class="card stack"><div class="ofind au-find">
          <select id="auWho" class="minisel" aria-label="${esc(t("col_staff"))}"><option value="all">${esc(t("staff_all"))}</option>${[...O.staff].sort(byRank).map(s => `<option value="${s.id}" ${who === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select>
          <select id="auMod" class="minisel" aria-label="${esc(t("col_section"))}"><option value="all">${esc(t("au_mod_all"))}</option>${AU_MODS.map(m => `<option value="${m}" ${mod === m ? "selected" : ""}>${esc(t("m_" + m))}</option>`).join("")}</select>
          <select id="auPer" class="minisel" aria-label="${esc(t("au_period"))}">${AU_PERIODS.map(x => `<option value="${x}" ${per === x ? "selected" : ""}>${esc(t("au_per_" + x))}</option>`).join("")}</select>
          <label class="search">${IC.search}<input id="auq" type="search" value="${esc(M.ui.auq || "")}" placeholder="${esc(t("audit_search"))}" aria-label="${esc(t("audit_search"))}"></label></div>
        <p class="muted small" id="aucount" aria-live="polite">${esc(auCount())}</p>
        <div id="aulist">${auditList()}</div></div>
      <p class="muted small" style="margin-top:12px">${esc(t("au_ip_note"))}</p></div>`;
  }
};
const auCount = () => { const n = auditRows().length; return n ? tf("au_count", { n }) : t("audit_none_match"); };
const auRefresh = () => { const l = $("#aulist"); if (l) l.innerHTML = auditList(); const c = $("#aucount"); if (c) c.textContent = auCount(); };
document.addEventListener("input", e => { if (e.target.id === "auq") { M.ui.auq = e.target.value; auRefresh(); } });
document.addEventListener("change", e => {
  const k = { auWho:"auWho", auMod:"auMod", auPer:"auPer" }[e.target.id]; if (!k) return;
  M.ui[k] = e.target.value; auRefresh();
});
ACT.aucsv = () => {
  if (denied("audit.export")) return;
  const when = ms => new Date(ms).toLocaleString(LOC[S.lang]), rows = auditRows();
  const out = [[t("col_date"), t("col_staff"), t("staff_role"), t("col_section"), t("col_action"), t("col_was"), t("col_now"), "IP", t("au_device")],
    ...rows.map(e => [when(e.at), staffName(e.staffId), auditRole(e), t("m_" + auditModule(e)), auditText(e),
      (e.diff || []).map(d => `${t(d.k)}: ${auditVal(d.from) || "—"}`).join("; "), (e.diff || []).map(d => `${t(d.k)}: ${auditVal(d.to) || "—"}`).join("; "), e.ip || "", e.dev || ""])];
  const blob = new Blob([csvText(out)], { type:"text/csv;charset=utf-8" });
  const a = Object.assign(document.createElement("a"), { href:URL.createObjectURL(blob), download:`charteri-audit-${TODAY}.csv` });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  change(() => audit("export", { what:strRef("an_audit") }, { module:"audit" }));
};

/* ---- 99-boot.js ---- */
/* ==========================================================================
   Запуск админки. Если кабинет в этом браузере ещё не открывали — создаём
   его демо-данные здесь же: админке нужно живое агентство.
   ========================================================================== */
"use strict";

applyDirections();                // направления из админки — до первой отрисовки
S = loadState();
if (!S || !Array.isArray(S.ledger) || !S.agency) { S = freshState(); S.session = null; S.rev = 1; writeJSON(CAB_KEY, S); }
O = loadOps() || freshOps(null);
if (!O.rev || O._migrated) saveOps();          // перенос на новые роли сохраняем сразу
SITE = loadSite();
seedApps();
adminPrefs();
heartbeat();
crmSync();                        // заявки с сайта и агентств → лиды до первого показа
syncBlocked();                    // сайт закрывает бронирование ровно тем номерам, что заблокированы в CRM
render(true);

</script>
</body>
</html>
